<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIC FOUNDRY — 프로그래머블 공정자동화</title>
<style>
/* ===========================================================================
   계기반 (Instrument faceplate)

   개념: UI 는 창(window)이 아니라 **장비의 앞면**이다. 어두운 세계 위에 밝은
   아노다이즈 알루미늄 판이 얹혀 있고, 라벨은 판에 각인돼 있고, 수치는 판에
   박힌 **어두운 계기창(well)** 안에서 빛난다. 게임 화면과 UI 가 같은 톤이면
   서로 섞여 읽히므로, 일부러 반대로 간다.

   시그니처: 밝은 금속판 + 어두운 계기창. 이 대비 하나에 힘을 몰고 나머지는
   조용히 둔다 (모서리 라운드 없음, 그림자 최소, 장식 없음).

   색 규약은 실제 반(盤)의 것을 따른다 — 운전 녹색 / 주의 호박 / 정지·위험 주황적.
   위험 줄무늬(노랑)는 게임 속 벨트와 같은 색이고 경보 한 곳에만 쓴다.
   =========================================================================== */
:root{
  /* 금속 판 */
  --face:#d8d4cc; --face-hi:#eae7e0; --face-lo:#c2bdb4;
  --edge:#6d675e; --rule:#a9a39a;
  /* 각인된 글자 */
  /* --ink-3 는 9~10px 라벨에 쓰이므로 밝은 판 위에서 4.5:1 을 넘겨야 한다.
     처음 #7e837f 로 뒀더니 비용 표기가 읽히지 않았다. */
  --ink:#1c2024; --ink-2:#585e65; --ink-3:#63696e;
  /* 계기창 (판에 박힌 어두운 창) */
  --well:#23282c; --well-ink:#eae6dd; --well-edge:#0e1113; --well-dim:#8b9199;
  /* 상태색 — 반의 규약 */
  --run:#1f6b46; --warn:#96610a; --stop:#b23a10; --steel:#2c5470;
  --hazard:#e2b21c;
  /* 글꼴: 라틴은 각인체(DIN), 한글은 본문체, 수치는 등폭 */
  --label:"Bahnschrift","Franklin Gothic","Segoe UI Variable",sans-serif;
  --body:"Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1214;color:var(--ink);
  font-family:var(--body);font-size:12.5px;user-select:none;-webkit-font-smoothing:antialiased}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;
  touch-action:none;-webkit-user-select:none;user-select:none}

/* 각인 라벨 — 판에 새긴 글자는 위가 어둡고 아래에 흰 하이라이트가 남는다 */
.eng{font-family:var(--label);font-variation-settings:'wght' 700,'wdth' 75;
  text-transform:uppercase;letter-spacing:.15em;color:var(--ink-2);
  text-shadow:0 1px 0 rgba(255,255,255,.8)}

/* 계기창 — 이 UI 의 시그니처. 수치는 반드시 여기 안에서만 산다. */
.well{background:var(--well);color:var(--well-ink);border:1px solid var(--well-edge);
  border-radius:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 var(--face-hi);
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 판 */
.panel{position:absolute;background:linear-gradient(180deg,#e3dfd8 0,var(--face) 44%,#cdc8bf 100%);
  border:1px solid var(--edge);border-radius:0;
  box-shadow:inset 0 1px 0 var(--face-hi),inset 0 -1px 0 rgba(0,0,0,.14),0 5px 16px rgba(0,0,0,.5)}
.panel h3{margin:0;padding:6px 10px 5px;font-family:var(--label);
  font-variation-settings:'wght' 700,'wdth' 75;text-transform:uppercase;
  font-size:10.5px;letter-spacing:.15em;color:var(--ink-2);
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  background:linear-gradient(180deg,rgba(0,0,0,.07),rgba(0,0,0,0));
  border-bottom:1px solid var(--rule)}
.pad{padding:8px 10px}

/* 색 유틸 (JS 인라인 색을 대신한다) */
.dim{color:var(--ink-2)} .ok{color:var(--run)} .warn{color:var(--warn)}
.bad{color:var(--stop)} .lnk{color:var(--steel)}

/* 상단 계기열 */
#top{top:8px;left:50%;transform:translateX(-50%);display:flex;z-index:5}
#top .stat{padding:5px 11px 6px;border-right:1px solid var(--rule);text-align:center;min-width:78px}
#top .stat:last-child{border-right:none}
#top .k{display:block;font-family:var(--label);font-variation-settings:'wght' 700,'wdth' 75;
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
  text-shadow:0 1px 0 rgba(255,255,255,.8);margin-bottom:3px}
#top .v{display:block;padding:2px 6px;font-size:14px;line-height:1.2}
.okv{color:#7ee0a2} .warnv{color:#f0c15a} .badv{color:#ff8a6a}

/* 건설 판 */
#build{left:8px;top:8px;width:214px;max-height:calc(100vh - 16px);overflow-y:auto;z-index:5}
.bhint{padding:3px 10px;font-family:var(--label);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.bitem{display:flex;gap:7px;align-items:center;padding:4px 8px;cursor:pointer;
  border-left:3px solid transparent;border-bottom:1px solid rgba(0,0,0,.055)}
.bitem:hover{background:rgba(255,255,255,.4)}
.bitem.sel{background:rgba(178,58,16,.13);border-left-color:var(--stop)}
.bitem.locked{opacity:.36;cursor:not-allowed}
.bitem.poor .bn{color:var(--stop)}
.bkey{font-family:var(--mono);font-size:9.5px;color:var(--well-ink);background:var(--well);
  width:15px;text-align:center;border-radius:1px;padding:1px 0;flex:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.bn{flex:1;font-size:12px;white-space:nowrap;color:var(--ink)}
.bc{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);text-align:right;white-space:nowrap}

/* 우측 열 */
#right{position:absolute;right:8px;top:8px;width:226px;display:flex;flex-direction:column;
  gap:8px;max-height:calc(100vh - 16px);z-index:5}
/* 기본 flex-shrink 가 1 이라 세로가 모자라면 위 판들이 눌려 내용이 잘린다
   (창고 마지막 줄이 반쯤 잘려 있었다). 판은 줄어들지 않게 하고,
   남는 높이는 지도 판(인라인 flex:1)이 가져간다. */
#right .panel{position:relative;inset:auto;flex:0 0 auto}
/* 품목이 15종뿐이라 다 들어간다. 잘라서 스크롤시키면 마지막 줄이 반쯤 잘려
   보여 "패널이 깨진 것"처럼 읽힌다. */
#invList{max-height:252px;overflow-y:auto;padding:3px 0;scrollbar-width:thin}
.irow{display:flex;justify-content:space-between;padding:1.5px 10px;font-size:11.5px}
.irow .n{color:var(--ink-2)}
.irow .q{font-family:var(--mono);color:var(--ink)}
.craftbtn{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;margin:2px 0;
  background:linear-gradient(180deg,#e6e2da,#d2cdc4);border:1px solid var(--rule);
  box-shadow:inset 0 1px 0 #fff;cursor:pointer;font-size:11.5px;color:var(--ink)}
.craftbtn:hover{border-color:var(--edge)}
.craftbtn:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.craftbtn.no{opacity:.42;cursor:not-allowed}
/* 손 조립 대기열 — 시간이 든다는 사실이 보여야 한다. 안 보이면 '눌러도 아무 일이
   없다'로 읽힌다. 진행 막대는 지금 만드는 것 하나에만 붙는다. */
#craftQueue:empty{display:none}
/* 패널 제목의 오른쪽 안내가 float 라 그 아래로 흘러들어와 겹쳤다 */
#craftQueue{padding:5px 8px 0;clear:both}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:3px 7px;margin:2px 0;border:1px solid var(--rule);background:var(--face-lo);
  font-size:11px;position:relative;overflow:hidden;cursor:pointer}
.qrow .qbar{position:absolute;left:0;top:0;bottom:0;background:rgba(44,84,112,.32);z-index:0}
.qrow span{position:relative;z-index:1}
.qrow:hover{border-color:var(--stop)}
.qrow .qx{color:var(--ink-2);font-family:var(--mono)}
.qcap{font:600 9.5px/1.6 var(--label);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border-bottom:1px solid var(--rule);margin-bottom:3px}
#craftList{max-height:200px;overflow-y:auto;padding:5px 8px;scrollbar-width:thin}
/* 지도는 판에 박힌 창이다 */
#mini{position:relative;width:100%;height:178px;display:block;background:var(--well);
  border-top:1px solid var(--well-edge);cursor:pointer;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.8)}

/* 튜토리얼 */
#tutor{left:230px;bottom:8px;width:356px;display:none;z-index:6;max-height:56vh;overflow-y:auto}
.tdone{color:var(--ink-3);font-size:11px;line-height:1.6;margin-bottom:7px;
  border-bottom:1px solid var(--rule);padding-bottom:6px}
.tchk{color:var(--run)}
.tnow{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px;line-height:1.35}
.twhy{font-size:11.5px;color:var(--warn);line-height:1.6;margin-bottom:6px}
.thow{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin:0;padding-left:18px}
.thow li{margin:3px 0}
.thow b{color:var(--ink)}
.tneed{margin-top:7px;padding-top:6px;border-top:1px solid var(--rule);
  font-size:10.5px;color:var(--ink-3);line-height:1.5}
#tutorFoot{display:flex;gap:6px;padding:0 11px 9px}

/* 인스펙터 */
#insp{left:594px;bottom:8px;width:296px;display:none;z-index:6;max-height:62vh;overflow-y:auto}
.frow{display:flex;gap:6px;align-items:center;margin:4px 0}
.frow label{flex:none;width:62px;font-family:var(--label);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);text-shadow:0 1px 0 rgba(255,255,255,.8)}
select,input[type=text],input[type=number]{background:#f2efe9;color:var(--ink);
  border:1px solid var(--rule);border-radius:1px;padding:3px 5px;font-family:var(--mono);
  font-size:11.5px;flex:1;min-width:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
select:focus,input:focus{outline:2px solid var(--steel);outline-offset:-1px}

/* 버튼은 반의 스위치다 — 눌리면 실제로 들어간다 */
button{font-family:var(--label);font-variation-settings:'wght' 600,'wdth' 87.5;
  letter-spacing:.06em;background:linear-gradient(180deg,#e9e5de,#cfcac1);color:var(--ink);
  border:1px solid var(--edge);border-radius:1px;padding:4px 10px;font-size:11.5px;cursor:pointer;
  box-shadow:inset 0 1px 0 #fff,0 1px 0 rgba(0,0,0,.22)}
button:hover{background:linear-gradient(180deg,#f2eee7,#d6d1c8)}
button:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.35);transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(180deg,#3a6a8c,#25506e);color:#f2efe9;border-color:#183a52;
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
button.danger{background:linear-gradient(180deg,#c4471a,#9c3009);color:#f7efe9;border-color:#732207;
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--mono);font-size:10.5px;background:var(--well);color:var(--well-ink);
  border-radius:1px;padding:2px 5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}

/* 연구 */
#tech{left:50%;top:50%;transform:translate(-50%,-50%);width:660px;max-height:78vh;
  overflow-y:auto;display:none;z-index:20}
.trow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.trow.done{opacity:.5} .trow.locked{opacity:.45}
.trow .tn{flex:1;color:var(--ink)}
.trow .td{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.55}
.tcost{font-family:var(--mono);font-size:11px;color:var(--stop);white-space:nowrap}

/* 노드 편집기 — 같은 반 위의 작업대 */
#logic{position:absolute;inset:0;background:#c6c3bb;display:none;z-index:30}
#logicBar{position:absolute;top:0;left:0;right:0;height:42px;
  border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,#e3dfd8,#cdc8bf);
  box-shadow:inset 0 1px 0 var(--face-hi),0 2px 6px rgba(0,0,0,.28)}
#logicBar .ttl{font-family:var(--label);font-variation-settings:'wght' 700,'wdth' 75;
  text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:var(--ink-2);
  text-shadow:0 1px 0 rgba(255,255,255,.8)}
#logicBar .hint{color:var(--ink-3);font-size:11px;flex:1}
#pal{position:absolute;left:0;top:42px;bottom:0;width:196px;border-right:1px solid var(--edge);
  overflow-y:auto;background:linear-gradient(180deg,#ded9d2,#cfcac1)}
.pcat{padding:5px 10px;font-family:var(--label);font-size:9px;letter-spacing:.16em;
  color:var(--ink-2);text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.8);
  background:rgba(0,0,0,.07);border-bottom:1px solid var(--rule);border-top:1px solid var(--rule)}
.pitem{padding:4.5px 10px;cursor:pointer;font-size:11.5px;color:var(--ink);
  border-left:3px solid transparent}
.pitem:hover{background:rgba(255,255,255,.5);border-left-color:var(--stop)}
.pitem.locked{opacity:.34;cursor:not-allowed}
/* 작업대 표면: 미세 격자 방안 */
#graphWrap{position:absolute;left:196px;top:42px;right:0;bottom:0;overflow:hidden;
  background:
    linear-gradient(rgba(0,0,0,.055) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(0,0,0,.055) 1px,transparent 1px) 0 0/24px 24px,
    #d3cfc7;
  cursor:grab}
#graphWrap.panning{cursor:grabbing}
#graphInner{position:absolute;left:0;top:0;width:6000px;height:4000px;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:6000px;height:4000px;pointer-events:none;overflow:visible}
/* 노드는 판에 붙인 작은 모듈 */
/* 출력 노드가 '지금 하는 일'을 말하는 줄. 뜻이 뒤집혔는지 배선하는 순간 보이게. */
.nmean{margin:5px 6px 2px;padding:3px 6px;border-radius:3px;font-size:10.5px;line-height:1.35;
  background:rgba(31,107,70,.12);border-left:2px solid var(--run);color:#1b3a2a}
.nmean:empty{display:none}
.nmean.bad{background:rgba(178,58,16,.13);border-left-color:var(--stop);color:#7a2a0d;font-weight:600}
.node{position:absolute;width:184px;
  background:linear-gradient(180deg,#e7e3dc,#d4cfc6);border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 #fff,0 3px 9px rgba(0,0,0,.35);font-size:11px;color:var(--ink)}
.node.in{border-top:3px solid var(--run)}
.node.op{border-top:3px solid var(--steel)}
.node.out{border-top:3px solid var(--stop)}
.node.sel{outline:1px solid var(--stop)}
.nhead{padding:4px 7px;cursor:move;font-family:var(--label);
  font-variation-settings:'wght' 700,'wdth' 87.5;font-size:10.5px;letter-spacing:.05em;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,0,0,.06);border-bottom:1px solid var(--rule);
  text-shadow:0 1px 0 rgba(255,255,255,.7)}
.nhead .x{color:var(--ink-3);cursor:pointer;padding:0 3px}
.nhead .x:hover{color:var(--stop)}
.nbody{padding:4px 6px}
.nrow{display:flex;align-items:center;gap:4px;margin:2px 0;min-height:17px}
.nrow label{font-family:var(--label);color:var(--ink-2);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;flex:none;width:54px}
.nrow select,.nrow input{font-size:10.5px;padding:1px 3px}
.ports{display:flex;justify-content:space-between;padding:2px 0 4px}
.pcol{display:flex;flex-direction:column;gap:3px}
.port{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-2);cursor:crosshair}
.pcol.o .port{flex-direction:row-reverse}
.dot{width:9px;height:9px;border-radius:50%;background:#f2efe9;border:1.5px solid var(--steel);flex:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.port:hover .dot{background:var(--stop);border-color:var(--stop)}
.dot.on{background:var(--run);border-color:var(--run)}
/* 포트 값도 계기창 안에 */
.pv{font-family:var(--mono);font-size:10px;min-width:30px;text-align:right;
  background:var(--well);color:var(--well-ink);border-radius:1px;padding:0 3px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.entbtn{font-size:10px;padding:1px 5px;flex:1;text-align:left;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;letter-spacing:0}

/* 알림 */
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.tmsg{background:linear-gradient(180deg,#e6e2da,#d2cdc4);border:1px solid var(--edge);
  border-left:4px solid var(--warn);padding:6px 13px;font-size:12px;color:var(--ink);
  box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(0,0,0,.4)}
.tmsg.bad{border-left-color:var(--stop)}
.tmsg.good{border-left-color:var(--run)}

/* 경보 — 여기 한 곳에만 위험 줄무늬를 쓴다 */
#alarms{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:6;
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.alarm{background:var(--stop);color:#fdf5ef;font-family:var(--mono);font-size:11.5px;
  padding:3px 11px;border:1px solid #732207;border-top:3px solid var(--hazard);
  box-shadow:0 2px 8px rgba(0,0,0,.45);animation:blink 1.1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.42}}
#dispRow{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:5;display:flex;gap:6px}
.disp{background:var(--well);color:var(--well-ink);border:1px solid var(--well-edge);
  padding:3px 9px;font-family:var(--mono);font-size:11.5px;border-radius:2px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.disp b{color:#f0c15a;font-weight:600}

/* 도움말 */
#help{left:50%;top:50%;transform:translate(-50%,-50%);width:680px;max-height:80vh;
  overflow-y:auto;display:none;z-index:25;line-height:1.62}
#help .pad{font-size:12.5px;color:var(--ink)}
#help h4{margin:14px 0 5px;font-family:var(--label);font-variation-settings:'wght' 700,'wdth' 75;
  text-transform:uppercase;letter-spacing:.15em;color:var(--stop);font-size:11px;
  text-shadow:0 1px 0 rgba(255,255,255,.8)}
#help code{font-family:var(--mono);background:var(--well);color:var(--well-ink);
  border-radius:1px;padding:1px 5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
#help ul{margin:4px 0;padding-left:18px} #help li{margin:3px 0}
#help p{margin:6px 0}
.close{position:absolute;right:8px;top:5px;cursor:pointer;color:var(--ink-3);font-size:15px}
.close:hover{color:var(--stop)}

@media (prefers-reduced-motion: reduce){ .alarm{animation:none} }

/* ===== 모바일 =====================================================
   데스크톱 배치는 절대위치 패널 여러 장이 화면을 둘러싸는 형태다. 폭 390px 에서는
   그 패널들의 합이 화면보다 넓어서, 모바일 브라우저가 뷰포트를 콘텐츠 폭까지
   넓히고 전체를 축소해 넣는다(shrink-to-fit). 넘침은 사라지지만 글자가 2/3 로
   쪼그라들어 아무것도 읽을 수 없다 — 실측에서 기기 폭 390 에 뷰포트 586 이 나왔다.
   그래서 좁은 화면에서는 패널을 **바닥 시트**로 바꾸고 한 번에 하나만 띄운다. */
#mobBar{display:none}

@media (max-width: 720px){
  /* 어떤 요소도 화면보다 넓어지지 않게 못박는다. 하나라도 넘치면 전체가 축소된다. */
  html,body{max-width:100%;overflow-x:hidden}

  #top{left:0;right:0;top:0;transform:none;width:100%;max-width:100%;
       border-radius:0;border-left:none;border-right:none;
       overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start}
  #top .stat{min-width:64px;padding:4px 8px 5px}
  #top .v{font-size:13px}

  /* 패널은 전부 바닥 시트로. 기본은 숨김이고 조작 바가 하나씩 연다. */
  #build,#right,#insp,#tutor{
    position:fixed;left:0;right:0;bottom:56px;top:auto;width:auto;max-width:100%;
    max-height:52vh;overflow-y:auto;border-radius:0;border-left:none;border-right:none;
    display:none;z-index:20}
  body.sheet-build #build{display:block}
  body.sheet-right #right{display:flex}
  /* 인스펙터와 튜토리얼은 시트 토글과 무관하게 스스로 뜬다 (선택·진행에 따라) */
  body.sheet-insp #insp{display:block}
  body.sheet-tutor #tutor{display:block}
  #right{flex-direction:column;gap:6px}
  #mini{width:100%;height:auto}

  /* 조작 바 (좁은 화면) */
  #mobBar{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;z-index:25;
          background:linear-gradient(180deg,var(--face) 0,#c9c4bb 100%);
          border-top:1px solid var(--edge);align-items:stretch}
  #mobBar button{flex:1;min-height:44px;margin:4px 3px;font-size:12px;
                 font-family:var(--label);font-variation-settings:'wght' 700,'wdth' 87}
  #mobBar button.on{background:var(--steel);color:#fff}

  /* 손가락 표적은 44px 이상. 26px 짜리 목록은 실기에서 오탭이 난다. */
  #buildList .bitem,#craftList .citem,#invList .irow{min-height:44px;align-items:center}
  .panel h3 .close{min-width:44px;min-height:44px;display:inline-flex;
                   align-items:center;justify-content:center}
  .panel button{min-height:44px}

  /* 노드 편집기: 팔레트를 왼쪽 기둥에서 위쪽 띠로 눕힌다 */
  #pal{left:0;right:0;top:42px;bottom:auto;width:auto;height:104px;
       border-right:none;border-bottom:1px solid var(--edge);
       overflow-x:auto;overflow-y:hidden;white-space:nowrap}
  #pal .pitem{display:inline-block;min-height:44px}
  #graphWrap{left:0;top:146px}
  #toast{bottom:120px}
}

/* 조작 수단은 **폭이 아니라 포인터 종류**로 갈린다. 768px 태블릿은 넓지만 손가락으로
   쓴다 — 폭만 보고 갈랐다가 태블릿에서 회전·철거 버튼이 사라지고 탭 표적이 26px 로
   남았다(실측). 좁은 화면의 시트 배치는 위 max-width 분기가, 손가락 조작에 필요한
   버튼과 표적 크기는 여기가 담당한다. */
@media (pointer: coarse){
  #mobBar{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;z-index:25;
          background:linear-gradient(180deg,var(--face) 0,#c9c4bb 100%);
          border-top:1px solid var(--edge);align-items:stretch}
  #mobBar button{flex:1;min-height:44px;margin:4px 3px;font-size:12px;
                 font-family:var(--label);font-variation-settings:'wght' 700,'wdth' 87}
  #mobBar button.on{background:var(--steel);color:#fff}
  #buildList .bitem,#craftList .citem,#invList .irow{min-height:44px;align-items:center}
  .panel h3 .close{min-width:44px;min-height:44px;display:inline-flex;
                   align-items:center;justify-content:center}
  .panel button{min-height:44px}
  #pal .pitem{min-height:44px}
  /* 바닥 바에 가리지 않게 아래를 비운다 */
  #build,#right{max-height:calc(100vh - 72px)}
}

<script>
(function(){
"use strict";
/* ===================== 00_core.js ===================== */
// ===========================================================================
//  00_core.js — 상수, 결정론 난수, 수학, 오류 수집
//
//  설계 규칙 (과거 실패 원장에서 옮겨온 것):
//   * 누산기는 선언 시 반드시 0으로 초기화한다. undefined + dt = NaN 은 예외 없이
//     번지고 렌더는 조용히 성공한다.
//   * 난수는 "먼저 뽑고 나중에 자리를 찾는다". 풀 점유율이 난수 소비량을 바꾸면
//     결정론이 깨진다.
//   * 프로토타입 상속은 쓰지 않는다 — Object.create 재할당으로 메서드가 조용히
//     사라진 적이 있다. 전부 팩토리 함수로 만든다.
// ===========================================================================

var VERSION = '1.0.0';

var TILE = 32;            // 타일 한 변 픽셀 (레퍼런스 스크린샷과 동일 배율)
var W = 160;              // 월드 가로 타일 수
var H = 160;              // 월드 세로 타일 수
var TICK = 1 / 60;        // 고정 시뮬 스텝 (Factorio 와 같은 60 UPS)
var MAX_STEPS = 8;        // 한 프레임에 밀어넣을 수 있는 최대 스텝 (나선 방지)

// --- 방향 ------------------------------------------------------------------
// 0=북(위), 1=동, 2=남, 3=서.  화면 좌표계는 y가 아래로 증가한다.
var DIR_DX = [0, 1, 0, -1];
var DIR_DY = [-1, 0, 1, 0];
var DIR_NAME = ['북', '동', '남', '서'];

function dirOpp(d) { return (d + 2) & 3; }
function dirCW(d) { return (d + 1) & 3; }
function dirCCW(d) { return (d + 3) & 3; }

// --- 결정론 난수 -----------------------------------------------------------
// mulberry32. 시드 하나로 전체 수열이 결정된다. 게임 로직용(RNG)과 연출용(FX_RNG)을
// 물리적으로 분리하되, 연출 쪽은 "뽑고 나서 자리를 찾는" 규약을 지켜야 의미가 있다.
function makeRng(seed) {
  var s = seed >>> 0;
  var draws = 0;
  return {
    next: function () {
      draws++;
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int: function (n) { return Math.floor(this.next() * n); },
    range: function (a, b) { return a + this.next() * (b - a); },
    pick: function (arr) { return arr[Math.floor(this.next() * arr.length)]; },
    reseed: function (v) { s = v >>> 0; draws = 0; },
    draws: function () { return draws; }
  };
}

var RNG = makeRng(20260807);      // 게임 로직 전용
var FX_RNG = makeRng(991);        // 연출 전용 — 게임 수열을 절대 건드리지 않는다

// --- 수학 ------------------------------------------------------------------
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
function sign(v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); }

// 값 잡음 — 지형/광맥 생성용. 시드에 대해 결정론.
function makeNoise(seed) {
  var rng = makeRng(seed);
  var P = new Float32Array(256 * 256);
  for (var i = 0; i < P.length; i++) P[i] = rng.next();
  function at(ix, iy) { return P[((iy & 255) << 8) | (ix & 255)]; }
  function smooth(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    // smoothstep — 격자 이음매가 각지지 않게
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = at(ix, iy), b = at(ix + 1, iy), c = at(ix, iy + 1), d = at(ix + 1, iy + 1);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
  }
  return {
    // 옥타브 합성. amp 합으로 나눠 항상 0..1 을 유지한다.
    fbm: function (x, y, oct, freq) {
      var v = 0, amp = 1, sum = 0, f = freq || 1;
      for (var o = 0; o < (oct || 3); o++) {
        v += smooth(x * f, y * f) * amp;
        sum += amp; amp *= 0.5; f *= 2;
      }
      return v / sum;
    },
    raw: smooth
  };
}

// --- 색 --------------------------------------------------------------------
function rgb(r, g, b) { return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }
function rgba(r, g, b, a) { return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + a + ')'; }

// hex → [r,g,b]
function hex2rgb(h) {
  var n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function shade(h, f) {
  var c = hex2rgb(h);
  return rgb(clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255));
}

// --- 오류 수집 -------------------------------------------------------------
// 게임 루프 안에서 터진 예외는 화면을 멈추게 하지 말고 모아 둔다. 검증 하네스가
// 이 배열을 출력 계약으로 읽는다 (콘솔 문자열 눈대중 금지).
var ERRORS = [];
function logError(where, e) {
  var msg = where + ': ' + ((e && e.stack) ? String(e.stack).split('\n').slice(0, 3).join(' | ') : String(e));
  if (ERRORS.length < 60) ERRORS.push(msg);
}
function guard(where, fn) {
  try { fn(); } catch (e) { logError(where, e); }
}

// --- 소형 유틸 -------------------------------------------------------------
function fmt(n, d) {
  if (!isFinite(n)) return '—';
  var p = Math.pow(10, d || 0);
  return String(Math.round(n * p) / p);
}
// 1234 -> "1.2k". 수치 판독은 등폭 글꼴로 그린다.
function fmtShort(n) {
  var a = Math.abs(n);
  if (a >= 1e9) return fmt(n / 1e9, 1) + 'G';
  if (a >= 1e6) return fmt(n / 1e6, 1) + 'M';
  if (a >= 1e3) return fmt(n / 1e3, 1) + 'k';
  return fmt(n, 0);
}
function fmtTime(s) {
  var m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

function idx(x, y) { return y * W + x; }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }

/* ===================== 05_data.js ===================== */
// ===========================================================================
//  05_data.js — 아이템 / 레시피 / 건물 스펙 / 기술트리
//
//  수치 오라클: 처리량·전력·사거리는 Factorio 의 공개 수치를 그대로 가져왔다.
//  임의로 정한 값이 아니므로 사용자가 wiki 와 대조해 검수할 수 있다.
//    · 벨트 1.875 타일/s → 레인당 7.5개/s → 합 15개/s   (yellow transport belt)
//    · 인서터 스윙 1.2s → 0.83개/s, 13 kW              (burner-less inserter)
//    · 채광기 0.5 광석/s, 90 kW                        (electric mining drill)
//    · 제련 3.2s/판, 180 kW                            (시간=stone furnace, 전력=electric furnace)
//    · 조립기 speed 0.75, 155 kW                       (assembling machine 2)
//    · 발전기 900 kW, 석탄 4 MJ → 0.225 석탄/s          (steam engine + 석탄 발열량)
//    · 연구소 60 kW, speed 1.0                         (lab)
//    · 터렛 사거리 18타일, 5 dmg/발, 10발/s             (gun turret + firearm magazine)
//    · 적 체력 소형 15 / 중형 75 / 대형 375             (biter)
//  이 표를 바꾸면 tests/driver.js 의 처리량 게이트가 즉시 어긋난다 — 일부러 그렇게 묶었다.
// ===========================================================================

// --- 아이템 ---------------------------------------------------------------
// shape: 렌더러가 벨트 위 아이템을 그릴 때 쓰는 형태 힌트
var ITEMS = {
  'iron-ore':    { name: '철광석',   color: '#8593a0', shape: 'rock' },
  'copper-ore':  { name: '구리광석', color: '#c87941', shape: 'rock' },
  'coal':        { name: '석탄',     color: '#2b2b30', shape: 'rock' },
  'stone':       { name: '돌',       color: '#a89880', shape: 'rock' },

  'iron-plate':  { name: '철판',     color: '#b8bfc6', shape: 'plate' },
  'copper-plate':{ name: '구리판',   color: '#e08a4a', shape: 'plate' },
  'brick':       { name: '벽돌',     color: '#b06a4a', shape: 'plate' },
  'steel':       { name: '강철',     color: '#8d9aa8', shape: 'plate' },

  'gear':        { name: '톱니',     color: '#7d858d', shape: 'gear' },
  'wire':        { name: '구리선',   color: '#d4732a', shape: 'wire' },
  'circuit':     { name: '회로기판', color: '#4fae5a', shape: 'chip' },

  'belt-item':   { name: '벨트',     color: '#c9a227', shape: 'chip' },
  'inserter-item':{name: '인서터',   color: '#c9a227', shape: 'gear' },
  'ammo':        { name: '탄창',     color: '#c94f3d', shape: 'ammo' },

  'sci-red':     { name: '적색 연구팩', color: '#e0483c', shape: 'flask' },
  'sci-green':   { name: '녹색 연구팩', color: '#49c05a', shape: 'flask' }
};
var ITEM_IDS = Object.keys(ITEMS);

// --- 레시피 ---------------------------------------------------------------
// cat: 'smelt' = 용광로, 'craft' = 조립기, 'hand' 도 가능한 것은 handOk

function techCycles(tid) {
  var c = TECHS[tid].cost, m = 0;
  for (var k in c) if (c[k] > m) m = c[k];
  return m;
}

// ===========================================================================
//  10_world.js — 격자 세계: 지형, 광맥, 나무, 점유맵, 오염 격자
//
//  좌표 규약: 타일 좌표 (tx, ty) 는 정수. 월드 좌표는 타일 단위 실수.

// ===========================================================================

var ORE_NONE = 0, ORE_IRON = 1, ORE_COPPER = 2, ORE_COAL = 3, ORE_STONE = 4;
var ORE_ITEM = [null, 'iron-ore', 'copper-ore', 'coal', 'stone'];
var ORE_COLOR = [null, '#8593a0', '#c87941', '#22222a', '#a89880'];

var PW = Math.ceil(W / SPEC.pollutionPerChunk);   // 오염 격자 가로
var PH = Math.ceil(H / SPEC.pollutionPerChunk);

var world = {
  terr: new Uint8Array(W * H),      // 0..3 잔디 변주
  ore: new Uint8Array(W * H),
  oreAmt: new Uint16Array(W * H),
  tree: new Uint8Array(W * H),      // 0 없음, 1..3 나무 변주
  occ: new Int32Array(W * H),       // 엔티티 id (0 = 빈 칸)
  poll: new Float32Array(PW * PH),  // 오염량
  pollNext: new Float32Array(PW * PH),
  spawnX: (W / 2) | 0,
  spawnY: (H / 2) | 0,
  totalPollution: 0,                // 누적 발생량 (진화도 계산용)
  absorbedByTrees: 0,
  minedTotal: 0                     // 땅에서 뽑아낸 총 개수 — 물질수지 게이트의 좌변
};

function pidx(px, py) { return py * PW + px; }
function pollAtTile(tx, ty) {
  var px = (tx / SPEC.pollutionPerChunk) | 0, py = (ty / SPEC.pollutionPerChunk) | 0;
  if (px < 0 || py < 0 || px >= PW || py >= PH) return 0;
  return world.poll[pidx(px, py)];
}
function addPollution(tx, ty, amt) {
  var px = (tx / SPEC.pollutionPerChunk) | 0, py = (ty / SPEC.pollutionPerChunk) | 0;
  if (px < 0 || py < 0 || px >= PW || py >= PH) return;
  world.poll[pidx(px, py)] += amt;
  world.totalPollution += amt;
}

// --- 광맥 한 덩이 심기 -----------------------------------------------------
// 중심에서 멀어질수록 매장량이 줄어드는 타원 블롭. 가장자리가 각지지 않게
// 잡음으로 반지름을 흔든다.
function plantOre(cx, cy, type, radius, richness, rng) {
  var wob = [];
  for (var a = 0; a < 16; a++) wob.push(0.7 + rng.next() * 0.6);
  var placed = 0;
  var r2 = radius * radius;
  for (var y = Math.max(0, cy - radius - 2); y <= Math.min(H - 1, cy + radius + 2); y++) {
    for (var x = Math.max(0, cx - radius - 2); x <= Math.min(W - 1, cx + radius + 2); x++) {
      var dx = x - cx, dy = y - cy;
      var ang = Math.atan2(dy, dx);
      var wi = ((ang + Math.PI) / (2 * Math.PI) * 16) | 0;
      var wobA = wob[wi % 16], wobB = wob[(wi + 1) % 16];
      var wf = lerp(wobA, wobB, ((ang + Math.PI) / (2 * Math.PI) * 16) % 1);
      var rr = radius * wf;
      var d2 = dx * dx + dy * dy;
      if (d2 > rr * rr) continue;
      var f = 1 - Math.sqrt(d2) / rr;                   // 0..1, 중심이 1
      var amt = Math.floor(richness * (0.35 + 0.65 * f * f));
      if (amt <= 0) continue;
      var i = idx(x, y);
      if (world.oreAmt[i] >= amt) continue;             // 겹치면 많은 쪽이 이긴다
      world.ore[i] = type;
      world.oreAmt[i] = Math.min(65000, amt);
      world.tree[i] = 0;                                 // 광맥 위엔 나무가 없다
      placed++;
    }
  }
  void r2;
  return placed;
}

// --- 세계 생성 -------------------------------------------------------------
function generateWorld(seed) {
  RNG.reseed(seed >>> 0);
  var n1 = makeNoise(seed ^ 0x1234);
  var n2 = makeNoise(seed ^ 0x9abc);

  world.terr.fill(0); world.ore.fill(0); world.oreAmt.fill(0);
  world.tree.fill(0); world.occ.fill(0);
  world.poll.fill(0); world.pollNext.fill(0);
  world.totalPollution = 0;
  world.absorbedByTrees = 0;
  world.minedTotal = 0;

  var cx = world.spawnX, cy = world.spawnY;

  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var i = idx(x, y);
      var v = n1.fbm(x, y, 4, 0.06);
      world.terr[i] = v < 0.42 ? 0 : (v < 0.52 ? 1 : (v < 0.62 ? 2 : 3));
      // 나무: 다른 주파수의 잡음이 임계 이상인 곳에 숲을 이룬다
      var t = n2.fbm(x + 500, y + 500, 3, 0.09);
      var dc = dist(x, y, cx, cy);
      if (t > 0.60 && dc > 14) world.tree[i] = 1 + ((t * 37) | 0) % 3;
    }
  }

  // 시작 광맥 — 스폰 주변에 4종을 반드시 하나씩. 없으면 게임이 시작되지 않는다.
  var startRing = [
    { t: ORE_IRON,   ang: -0.6, d: 13, r: 6, rich: 3000 },
    { t: ORE_COPPER, ang: 1.9,  d: 14, r: 5, rich: 2600 },
    { t: ORE_COAL,   ang: 3.6,  d: 12, r: 5, rich: 3000 },
    { t: ORE_STONE,  ang: 5.1,  d: 15, r: 4, rich: 2000 }
  ];
  for (var s = 0; s < startRing.length; s++) {
    var o = startRing[s];
    var ox = Math.round(cx + Math.cos(o.ang) * o.d);
    var oy = Math.round(cy + Math.sin(o.ang) * o.d);
    plantOre(ox, oy, o.t, o.r, o.rich, RNG);
  }

  // 바깥 광맥 — 멀수록 크고 풍부하다. 확장할 이유를 만든다.
  var types = [ORE_IRON, ORE_IRON, ORE_COPPER, ORE_COAL, ORE_STONE];
  for (var k = 0; k < 46; k++) {
    var ang = RNG.next() * Math.PI * 2;
    var d = 26 + RNG.next() * 48;
    var px = Math.round(cx + Math.cos(ang) * d);
    var py = Math.round(cy + Math.sin(ang) * d);
    if (!inBounds(px, py)) continue;
    var far = d / 74;
    plantOre(px, py, RNG.pick(types), 5 + Math.floor(RNG.next() * 6 + far * 4),
      2500 + Math.floor(far * 9000 + RNG.next() * 3000), RNG);
  }

  // 스폰 반경은 평평하게 — 첫 공장을 지을 자리
  for (var yy = cy - 8; yy <= cy + 8; yy++) {
    for (var xx = cx - 8; xx <= cx + 8; xx++) {
      if (!inBounds(xx, yy)) continue;
      if (dist(xx, yy, cx, cy) < 8.5) world.tree[idx(xx, yy)] = 0;
    }
  }
  return world;
}

// --- 점유 --------------------------------------------------------------------
function occAt(tx, ty) {
  if (!inBounds(tx, ty)) return -1;              // 밖 = 막힘
  return world.occ[idx(tx, ty)];
}
function areaFree(tx, ty, w, h) {
  for (var y = ty; y < ty + h; y++) {
    for (var x = tx; x < tx + w; x++) {
      if (!inBounds(x, y)) return false;
      var i = idx(x, y);
      if (world.occ[i] !== 0) return false;
      if (world.tree[i] !== 0) return false;
    }
  }
  return true;
}
function setOcc(tx, ty, w, h, id) {
  for (var y = ty; y < ty + h; y++) {
    for (var x = tx; x < tx + w; x++) {
      if (inBounds(x, y)) world.occ[idx(x, y)] = id;
    }
  }
}
function clearTrees(tx, ty, w, h) {
  var n = 0;
  for (var y = ty; y < ty + h; y++) {
    for (var x = tx; x < tx + w; x++) {
      if (!inBounds(x, y)) continue;
      if (!world.tree[idx(x, y)]) continue;
      world.tree[idx(x, y)] = 0;
      n++;
      // 인구조사를 여기서 바로 깎는다. 예전엔 안 깎아서, 건물로 밀어낸 나무가
      // 영원히 오염을 흡수했다 (전량 재조사를 걸면 드래그 배치마다 25600칸을 다시 센다).
      if (treeCountPerChunk) {
        var pi = pidx((x / SPEC.pollutionPerChunk) | 0, (y / SPEC.pollutionPerChunk) | 0);
        if (treeCountPerChunk[pi] > 0) treeCountPerChunk[pi]--;
      }
    }
  }
  return n;
}

// --- 광맥 채굴 ----------------------------------------------------------------
// 채광기 영역 안에서 남은 매장량이 가장 많은 칸을 하나 판다.
function mineFrom(tx, ty, w, h) {
  var best = -1, bestAmt = 0, bestType = 0;
  for (var y = ty; y < ty + h; y++) {
    for (var x = tx; x < tx + w; x++) {
      if (!inBounds(x, y)) continue;
      var i = idx(x, y);
      if (world.oreAmt[i] > bestAmt) { bestAmt = world.oreAmt[i]; best = i; bestType = world.ore[i]; }
    }
  }
  if (best < 0 || bestAmt <= 0) return null;
  world.oreAmt[best]--;
  world.minedTotal++;
  if (world.oreAmt[best] === 0) world.ore[best] = ORE_NONE;
  return ORE_ITEM[bestType];
}
// 배치 미리보기용 — 캐지 않고 어떤 광종이 얼마나 깔려 있는지만 본다.
function surveyOre(tx, ty, w, h) {
  var total = 0, type = 0;
  for (var y = ty; y < ty + h; y++) {
    for (var x = tx; x < tx + w; x++) {
      if (!inBounds(x, y)) continue;
      var i = idx(x, y);
      if (world.oreAmt[i] > 0) { total += world.oreAmt[i]; if (!type) type = world.ore[i]; }
    }
  }
  return { total: total, type: type, item: ORE_ITEM[type] };
}

// --- 오염 확산 ------------------------------------------------------------
// 4방향 확산 + 자연 감쇠 + 나무 흡수. 매 틱이 아니라 0.25초마다 돈다.
var pollTimer = 0;
function stepPollution(dt) {
  pollTimer += dt;
  if (pollTimer < 0.25) return;
  var steps = Math.floor(pollTimer / 0.25);
  pollTimer -= steps * 0.25;
  if (steps > 4) steps = 4;                    // 프레임이 밀려도 폭주하지 않게

  for (var s = 0; s < steps; s++) {
    var P = world.poll, N = world.pollNext;
    for (var y = 0; y < PH; y++) {
      for (var x = 0; x < PW; x++) {
        var i = pidx(x, y);
        var v = P[i];
        var spread = v * 0.06;
        var keep = v - spread * 4;
        var acc = keep;
        // 이웃에서 흘러들어오는 양
        if (x > 0) acc += P[i - 1] * 0.06;
        if (x < PW - 1) acc += P[i + 1] * 0.06;
        if (y > 0) acc += P[i - PW] * 0.06;
        if (y < PH - 1) acc += P[i + PW] * 0.06;
        N[i] = acc * 0.998;                     // 자연 감쇠
      }
    }
    world.poll = N;
    world.pollNext = P;
  }
}

// 나무는 오염을 흡수한다 — 벌목하면 오염이 더 멀리 퍼진다는 인과가 생긴다.
var treeCensusDone = false;
var treeCountPerChunk = null;
function rebuildTreeCensus() {
  treeCountPerChunk = new Int32Array(PW * PH);
  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      if (world.tree[idx(x, y)]) {
        treeCountPerChunk[pidx((x / SPEC.pollutionPerChunk) | 0, (y / SPEC.pollutionPerChunk) | 0)]++;
      }
    }
  }
  treeCensusDone = true;
}
// 나무 1그루가 초당 흡수하는 양. 매 틱 호출되므로 dt 를 곱해야 "초당"이 된다.
// 예전에는 `* dt * 60` 이라 dt 가 상쇄돼 **틱당 고정량 = 초당 60배**였다. 그 결과
// 오염이 공장 근처 숲에 전부 먹혀 둥지까지 가지 못했고, 습격이 사실상 오지 않았다
// (측정: 30분에 파도 6회·30마리, 터렛 6대가 손실 0으로 방어 — 압박 부재).
var TREE_ABSORB_PER_SEC = 0.0015;
function absorbByTrees(dt) {
  if (!treeCensusDone) rebuildTreeCensus();
  for (var i = 0; i < world.poll.length; i++) {
    var t = treeCountPerChunk[i];
    if (!t || world.poll[i] <= 0) continue;
    var take = Math.min(world.poll[i], t * TREE_ABSORB_PER_SEC * dt);
    world.poll[i] -= take;
    world.absorbedByTrees += take;
  }
}

/* ===================== 20_belt.js ===================== */
// ===========================================================================
//  20_belt.js — 벨트 물류 (2레인) + 분배기
//
//  레인 규약: lane 0 = 진행방향 기준 왼쪽, lane 1 = 오른쪽.
//  아이템은 { id, pos } 이고 pos 는 타일 진입변(0) → 진출변(1) 까지의 진행률.
//  한 레인 배열은 앞(pos 큰 것)부터 정렬돼 있다. lane[0] 이 선두.
//
//  처리 순서에 대한 주의 —
//    상류를 먼저 처리하면 하류의 낡은 위치를 보고 인계를 거절해 처리량이 조용히
//    몇 퍼센트 깎인다. 그래서 배치가 바뀔 때마다 "하류부터" 도는 순서를 위상정렬로
//    다시 만든다(beltOrder). 순환 벨트는 위상이 없으므로 뒤에 몰아 붙인다.
// ===========================================================================

var GAP = SPEC.beltSlotGap;          // 0.25 — 레인당 타일 4개
var beltSpeedMul = 1;                // 고속 벨트 연구로 2가 된다

function beltSpeed() { return SPEC.beltTilesPerSec * beltSpeedMul; }

// --- 셀 --------------------------------------------------------------------
function makeCell(ent, tx, ty, dir) {
  return { ent: ent, tx: tx, ty: ty, dir: dir, lanes: [[], []], gate: true };
}
function cellItemCount(c) { return c.lanes[0].length + c.lanes[1].length; }

// 이 타일의 벨트 셀을 찾는다 (벨트/분배기만 해당)
function cellAt(tx, ty) {
  var id = occAt(tx, ty);
  if (id <= 0) return null;
  var e = entities[id];
  if (!e || !e.cells) return null;
  for (var i = 0; i < e.cells.length; i++) {
    if (e.cells[i].tx === tx && e.cells[i].ty === ty) return e.cells[i];
  }
  return null;
}

// 진입 규약 — from 셀(진행 dFrom)이 to 셀(진행 dTo)로 넘길 때 도착 레인.
//  뒤에서 들어오면(직진/커브) 레인 유지, 옆에서 들어오면(사이드로드) 그 쪽 레인.
function entryLane(toCell, fromTx, fromTy, srcLane) {
  var dxFrom = fromTx - toCell.tx, dyFrom = fromTy - toCell.ty;
  var dFrom = -1;
  for (var d = 0; d < 4; d++) if (DIR_DX[d] === dxFrom && DIR_DY[d] === dyFrom) dFrom = d;
  if (dFrom < 0) return srcLane;
  if (dFrom === dirOpp(toCell.dir)) return srcLane;      // 정후방 → 레인 유지
  if (dFrom === dirCW(toCell.dir)) return 1;             // 오른쪽에서 → 오른쪽 레인
  if (dFrom === dirCCW(toCell.dir)) return 0;            // 왼쪽에서 → 왼쪽 레인
  return srcLane;                                        // 정면(역주행)은 인계 불가지만 방어적으로
}

// 셀이 아이템을 받을 수 있는가 — 맨 뒤 아이템이 GAP 만큼 비켜났는가
function laneHasRoom(lane) {
  if (lane.length === 0) return true;
  return lane[lane.length - 1].pos >= GAP;
}
function lanePush(lane, id, pos) {
  var back = lane.length ? lane[lane.length - 1].pos : Infinity;
  var p = clamp(pos, 0, Math.min(1, back - GAP));
  lane.push({ id: id, pos: p });
  return true;
}

// --- 출력 대상 --------------------------------------------------------------
// 벨트: 진행방향 다음 타일의 셀. 분배기: 두 출구 중 라운드로빈.
function outputTarget(cell, lane) {
  var e = cell.ent;
  if (e.type === 'splitter') return splitterOutput(e, cell, lane);
  var nx = cell.tx + DIR_DX[cell.dir], ny = cell.ty + DIR_DY[cell.dir];
  var t = cellAt(nx, ny);
  if (!t) return null;
  if (t.ent.type === 'belt' && dirOpp(t.dir) === cell.dir) return null;  // 정면 충돌 벨트
  return { cell: t, lane: entryLane(t, cell.tx, cell.ty, lane) };
}

function splitterOutput(e, cell, lane) {
  // 두 셀 각각의 앞 타일이 출구다. rr 로 번갈아 내보내되, 한쪽이 막히면 다른 쪽.
  var order = [e.rr, 1 - e.rr];
  if (e.outPrio === 0 || e.outPrio === 1) {
    // **cells[0] 은 언제나 좌표가 작은 쪽**이지 '왼쪽'이 아니다 (25_entity.js:116).
    // 이 집의 규약에서 왼쪽은 진행방향 기준이다 (레인 0 = dirCCW, 45_render.js:300).
    //   북(0): 왼쪽=서=cells[0] · 동(1): 왼쪽=북=cells[0]
    //   남(2): 왼쪽=동=cells[1] · 서(3): 왼쪽=남=cells[1]
    // 그래서 남·서향 분배기는 UI 에서 [왼쪽]을 고르면 오른쪽으로 나갔다.
    var L = (e.dir === 0 || e.dir === 1) ? 0 : 1;
    var first = (e.outPrio === 0) ? L : (1 - L);
    order = [first, 1 - first];
  }
  for (var k = 0; k < 2; k++) {
    var ci = order[k];
    var oc = e.cells[ci];
    var nx = oc.tx + DIR_DX[oc.dir], ny = oc.ty + DIR_DY[oc.dir];
    var t = cellAt(nx, ny);
    if (!t) continue;
    if (t.ent.type === 'belt' && dirOpp(t.dir) === oc.dir) continue;   // 정면 충돌 벨트
    var tl = entryLane(t, oc.tx, oc.ty, lane);
    // 게이트가 닫힌 출구를 고르면 호출자가 거절해 그 틱 인계가 통째로 실패한다.
    // 게다가 닫힌 셀은 stepBelts 가 건너뛰어 비지 않으므로 laneHasRoom 이 영원히 true 다
    // → 우선순위 쪽을 닫으면 열린 쪽이 텅 비어도 분배기가 영구 정체한다.
    if (!t.gate || !laneHasRoom(t.lanes[tl])) continue;
    if (e.outPrio === null || e.outPrio === undefined) e.rr = 1 - ci;
    return { cell: t, lane: tl };
  }
  return null;
}

// --- 처리 순서 (위상정렬) ---------------------------------------------------
var beltOrder = [];
var beltOrderDirty = true;

function markBeltDirty() { beltOrderDirty = true; }

function rebuildBeltOrder() {
  var cells = [];
  for (var id in entities) {
    var e = entities[id];
    if (e && e.cells) for (var i = 0; i < e.cells.length; i++) cells.push(e.cells[i]);
  }
  // 각 셀의 하류(출력 대상 셀)를 미리 구해 역방향 인접을 만든다
  var index = new Map();
  for (var c = 0; c < cells.length; c++) index.set(cells[c], c);
  var downstream = new Array(cells.length);
  var indeg = new Int32Array(cells.length);     // "하류가 몇 개인가" 가 아니라
  for (var c2 = 0; c2 < cells.length; c2++) {
    var cell = cells[c2];
    var outs = [];
    // 분배기는 두 출구 모두를 하류로 본다
    if (cell.ent.type === 'splitter') {
      for (var s = 0; s < cell.ent.cells.length; s++) {
        var oc = cell.ent.cells[s];
        var t0 = cellAt(oc.tx + DIR_DX[oc.dir], oc.ty + DIR_DY[oc.dir]);
        if (t0 && index.has(t0)) outs.push(index.get(t0));
      }
    } else {
      var t1 = cellAt(cell.tx + DIR_DX[cell.dir], cell.ty + DIR_DY[cell.dir]);
      if (t1 && index.has(t1) && !(t1.ent.type === 'belt' && dirOpp(t1.dir) === cell.dir)) {
        outs.push(index.get(t1));
      }
    }
    downstream[c2] = outs;
  }
  // 하류가 먼저 나와야 하므로, "상류 개수"로 위상정렬하는 대신
  // 하류 방향 간선을 뒤집어 (하류 -> 상류) 로 두고 진입차수 0 부터 뽑는다.
  var rev = new Array(cells.length);
  for (var r = 0; r < cells.length; r++) rev[r] = [];
  for (var a = 0; a < cells.length; a++) {
    for (var b = 0; b < downstream[a].length; b++) {
      rev[downstream[a][b]].push(a);
      indeg[a]++;                                  // a 는 자기 하류가 처리된 뒤에 와야 한다
    }
  }
  var queue = [], out = [];
  for (var q = 0; q < cells.length; q++) if (indeg[q] === 0) queue.push(q);
  while (queue.length) {
    var n = queue.shift();
    out.push(cells[n]);
    for (var m = 0; m < rev[n].length; m++) {
      if (--indeg[rev[n][m]] === 0) queue.push(rev[n][m]);
    }
  }
  // 순환(벨트 루프)에 남은 셀은 위상이 없다 — 뒤에 그대로 붙인다
  if (out.length < cells.length) {
    var seen = new Set(out);
    for (var z = 0; z < cells.length; z++) if (!seen.has(cells[z])) out.push(cells[z]);
  }
  beltOrder = out;
  beltOrderDirty = false;
}

// --- 한 틱 진행 --------------------------------------------------------------
var beltStats = { delivered: 0 };     // 인계 성공 횟수 — 처리량 게이트가 읽는다

function stepBelts(dt) {
  if (beltOrderDirty) rebuildBeltOrder();
  var move = beltSpeed() * dt;
  for (var ci = 0; ci < beltOrder.length; ci++) {
    var cell = beltOrder[ci];
    if (!cell.gate) continue;                   // 제어기가 닫은 게이트
    for (var li = 0; li < 2; li++) {
      var lane = cell.lanes[li];
      for (var i = 0; i < lane.length; i++) {
        var it = lane[i];
        var cap;
        if (i === 0) {
          // 선두 — 타일 끝까지 가고, 넘으면 인계 시도
          var want = it.pos + move;
          if (want >= 1) {
            var tgt = outputTarget(cell, li);
            if (tgt && tgt.cell.gate && laneHasRoom(tgt.cell.lanes[tgt.lane])) {
              lane.shift();
              lanePush(tgt.cell.lanes[tgt.lane], it.id, want - 1);
              beltStats.delivered++;
              i--;                              // 배열이 당겨졌으므로 같은 인덱스를 다시
              continue;
            }
            it.pos = 1;
          } else {
            it.pos = want;
          }
        } else {
          cap = lane[i - 1].pos - GAP;
          it.pos = Math.min(it.pos + move, cap);
          if (it.pos < 0) it.pos = 0;
        }
      }
    }
  }
}

// --- 외부 투입/회수 (기계·인서터가 쓴다) --------------------------------------
// 기계가 벨트에 뱉을 때: 뒤쪽 여유가 있는 레인 하나에 넣는다.
function beltAccept(cell, itemId, preferLane) {
  if (!cell || !cell.gate) return false;
  var order = (preferLane === 0 || preferLane === 1) ? [preferLane, 1 - preferLane] : [0, 1];
  for (var k = 0; k < 2; k++) {
    var lane = cell.lanes[order[k]];
    if (laneHasRoom(lane)) { lanePush(lane, itemId, 0); return true; }
  }
  return false;
}
// 인서터가 집을 때: 타일 중앙(pos 0.5)에 가장 가까운 아이템. 필터가 있으면 그것만.
//
// 고르는 규칙은 beltPeek 과 **반드시 같아야 한다.** 예전엔 peek 이 레인 배열의 첫
// 원소(선두)를 보고 take 는 중앙 최근접을 집어서, 정체된 벨트(1.0/0.75/0.5/0.25로
// 꽉 찬 상태 — 기계 앞에서 늘 일어난다)에서 서로 다른 아이템을 가리켰다.
// 그러면 "놓을 수 있는지"를 A로 검사하고 B를 집어, 못 놓는 B를 영원히 쥔 채 굳는다.
function beltPick(cell, filter) {
  if (!cell) return null;
  var bestLane = -1, bestIdx = -1, bestD = 99;
  for (var li = 0; li < 2; li++) {
    var lane = cell.lanes[li];
    for (var i = 0; i < lane.length; i++) {
      if (filter && lane[i].id !== filter) continue;
      var d = Math.abs(lane[i].pos - 0.5);
      if (d < bestD) { bestD = d; bestLane = li; bestIdx = i; }
    }
  }
  return bestLane < 0 ? null : { lane: bestLane, idx: bestIdx, id: cell.lanes[bestLane][bestIdx].id };
}
function beltPeek(cell, filter) {
  var p = beltPick(cell, filter);
  return p ? p.id : null;
}
function beltTake(cell, filter) {
  var p = beltPick(cell, filter);
  if (!p) return null;
  return cell.lanes[p.lane].splice(p.idx, 1)[0].id;
}
// 벨트 위 내용물 세기 — 제어기의 벨트 센서, 그리고 저장에 쓴다.
function beltContents(cell, into) {
  var m = into || {};
  for (var li = 0; li < 2; li++) {
    var lane = cell.lanes[li];
    for (var i = 0; i < lane.length; i++) m[lane[i].id] = (m[lane[i].id] || 0) + 1;
  }
  return m;
}

/* ===================== 25_entity.js ===================== */
// ===========================================================================
//  25_entity.js — 엔티티 등록/배치/철거 + 기계 동작 + 인서터
//
//  불변식 (원장의 교착 사례들에서 옮겨온 것):
//   * "작업이 진행 중일 때만 자원을 쥔다" — 인서터는 놓을 곳이 없으면 집지 않는다.
//   * 모든 대기 상태에 탈출 타임아웃을 둔다 — stallT 가 그것이다.
//   * 철거는 점유맵·전력망·벨트순서·신호망을 전부 무효화한다. 한 곳이라도 빠지면
//     유령 참조가 남아 라인이 조용히 멈춘다.
// ===========================================================================

var entities = {};          // id -> entity
var entOrder = [];          // 결정론 순회를 위한 생성 순서
var nextEntId = 1;

function entityAt(tx, ty) {
  var id = occAt(tx, ty);
  return id > 0 ? entities[id] : null;
}
function forEachEntity(fn) {
  for (var i = 0; i < entOrder.length; i++) {
    var e = entities[entOrder[i]];
    if (e) fn(e);
  }
}

// --- 배치 가능 검사 ---------------------------------------------------------
// restore=true 는 "저장본 복원" 이다. 이때는 **자원·광맥·기술 검사를 하지 않는다.**
//   저장 시점의 인벤토리는 '짓고 남은 것'이라 부족한 게 정상이고, 광맥은 다 캤을 수 있다.
//   그 검사를 복원에도 걸면 멀쩡한 저장본에서 공장이 통째로 사라진다 (실측: 벨트 60개 → 0개).
//   기하 검사(맵 밖·점유)는 복원에서도 반드시 유지한다 — 그건 저장본의 무결성이다.
function canPlace(type, tx, ty, dir, restore) {
  var B = BUILDINGS[type];
  if (!B) return { ok: false, why: '알 수 없는 건물' };
  if (!restore && B.tech && !techDone[B.tech]) return { ok: false, why: TECHS[B.tech].name + ' 연구 필요' };
  var w = B.w, h = B.h;
  if (B.rot && (dir === 1 || dir === 3) && w !== h) { var t = w; w = h; h = t; }
  for (var y = ty; y < ty + h; y++) {
    for (var x = tx; x < tx + w; x++) {
      if (!inBounds(x, y)) return { ok: false, why: '맵 밖' };
      if (world.occ[idx(x, y)] !== 0) return { ok: false, why: '이미 뭔가 있다' };
    }
  }
  if (!restore && type === 'miner') {
    var sv = surveyOre(tx, ty, w, h);
    if (!sv.total) return { ok: false, why: '광맥이 없다' };
  }
  if (!restore) {
    var cost = B.cost;
    for (var k in cost) {
      if ((inventory[k] || 0) < cost[k]) {
        return { ok: false, missing: k, need: cost[k], have: (inventory[k] || 0),
                 why: ITEMS[k].name + ' ' + cost[k] + '개 필요 (지금 ' + (inventory[k] || 0) + '개)' };
      }
    }
  }
  return { ok: true, w: w, h: h };
}

// "그건 어디서 얻나" — 부족하다고만 말하면 플레이어가 막힌다.
// 재료 사슬을 한 줄로 펴서 알려준다. 예: 회로기판 → 철판 1 + 구리선 3 (손 조립)
function howToGet(itemId) {
  var r = RECIPES[itemId];
  if (!r) {
    // 레시피가 없으면 땅에서 나오는 것이다
    if (ORE_ITEM.indexOf(itemId) > 0) return '채광기를 그 광맥 위에 놓아 캔다';
    return null;
  }
  var parts = [];
  for (var k in r.inp) parts.push(r.inp[k] + '×' + ITEMS[k].name);
  var recipe = parts.join(' + ');
  if (r.tech && !techDone[r.tech]) return TECHS[r.tech].name + ' 연구가 먼저다';
  if (r.handOk) return recipe + ' → 우측 [손 조립]에서 클릭';
  if (r.cat === 'smelt') return recipe + ' → 용광로에 넣는다';
  return recipe + ' → 조립기에 레시피를 걸어 만든다';
}

// --- 배치 -------------------------------------------------------------------
// free 는 두 가지를 함께 뜻한다: 비용을 안 받고, 비용/광맥/기술 검사도 안 한다.
// (예전에는 차감만 건너뛰고 검사는 그대로여서 복원이 조용히 실패했다.)
function placeEntity(type, tx, ty, dir, free) {
  var chk = canPlace(type, tx, ty, dir, free);
  if (!chk.ok) return null;
  var B = BUILDINGS[type];
  var w = chk.w, h = chk.h;
  clearTrees(tx, ty, w, h);
  if (!free) { for (var k in B.cost) inventory[k] -= B.cost[k]; }

  var id = nextEntId++;
  var tiles = w * h;
  var e = {
    id: id, type: type, tx: tx, ty: ty, w: w, h: h, dir: dir | 0,
    hp: 0, maxHp: 0,
    enabled: true,          // 이번 틱 실제 가동 여부 (제어기 또는 플레이어가 정한다)
    playerEnabled: true,    // 플레이어의 의사. 제어기 지배가 풀리면 여기로 돌아온다
    playerFilter: null,
    logicForced: false,     // 제어기가 실제로 지배 중인가 (UI 표시용)
    fEnable: false, fGate: false, fFilter: false, fFire: false,
    powerSat: 0,            // 이번 틱 전력 만족도 0..1
    net: -1,                // 전력망 번호
    inv: {}, out: {},
    recipe: null, progress: 0,
    stallT: 0,              // 아무 일도 못 한 시간 — 교착 진단용
    anim: 0
  };
  e.maxHp = (type === 'wall') ? SPEC.wallHp : tiles * SPEC.buildingHpPerTile;
  e.hp = e.maxHp;

  if (type === 'belt') {
    e.cells = [makeCell(e, tx, ty, e.dir)];
  } else if (type === 'splitter') {
    // 두 번째 칸은 **점유 사각형과 같은 축**으로 잡아야 한다.
    // 예전엔 dirCW 로 잡았는데, 회전 보정(w/h 스왑)은 dir 1/3 에서만 일어나므로
    // 남(2)·서(3) 향 분배기는 셀이 사각형 밖에 생겼다 — 점유한 칸엔 셀이 없고
    // 셀이 있는 칸은 비점유라, 벨트 인계가 막히고 철거가 이웃의 점유를 지웠다.
    // w/h 는 chk 에서 이미 회전 보정된 값이다.
    var sx = (w === 2) ? 1 : 0, sy = (h === 2) ? 1 : 0;
    e.cells = [makeCell(e, tx, ty, e.dir),
               makeCell(e, tx + sx, ty + sy, e.dir)];
    e.rr = 0;
    e.outPrio = null;
  } else if (type === 'inserter') {
    e.phase = 0; e.t = 0; e.held = null; e.filter = null;
  } else if (type === 'miner') {
    e.surveyed = surveyOre(tx, ty, w, h);
  } else if (type === 'generator') {
    e.fuel = 0;            // 남은 에너지 kJ
    e.load = 0;
  } else if (type === 'turret') {
    e.ammo = 0; e.shotT = 0; e.target = null; e.fireOk = true;
  } else if (type === 'controller') {
    e.graph = newGraph();
    e.lastEval = null;
  } else if (type === 'lab') {
    e.researching = 0;
  }

  entities[id] = e;
  entOrder.push(id);
  setOcc(tx, ty, w, h, id);
  markBeltDirty();
  markPowerDirty();
  markLogicDirty();
  return e;
}

// --- 철거 -------------------------------------------------------------------
function removeEntity(id, refund) {
  var e = entities[id];
  if (!e) return false;
  // 점유 해제는 사각형 하나로 끝난다. 예전엔 분배기만 셀 좌표로 한 번 더 지웠는데,
  // 셀이 사각형 밖에 있던 시절의 임시방편이었고 이웃 건물의 점유를 지우는 통로였다.
  setOcc(e.tx, e.ty, e.w, e.h, 0);
  if (refund) {
    var B = BUILDINGS[e.type];
    for (var k in B.cost) inventory[k] = (inventory[k] || 0) + B.cost[k];
    // 안에 들어 있던 것도 돌려준다 — 안 그러면 철거가 아이템 소각기가 된다
    for (var a in e.inv) inventory[a] = (inventory[a] || 0) + e.inv[a];
    for (var b in e.out) inventory[b] = (inventory[b] || 0) + e.out[b];
    // e.ammo 는 **발** 단위다 (탄창 1개 = SPEC.turretShotsPerAmmo 발). 발 개수를
    // 그대로 탄창 개수로 돌려주면 철거가 10배 복사기가 된다. 자투리 발은 못 돌려준다.
    if (e.type === 'turret' && e.ammo > 0) {
      var mags = Math.floor(e.ammo / SPEC.turretShotsPerAmmo);
      if (mags > 0) inventory['ammo'] = (inventory['ammo'] || 0) + mags;
    }
    // 발전기의 석탄은 e.inv 가 아니라 e.fuel(에너지)에 녹아 있다. 여기서 안 돌려주면
    // 바로 위 주석이 막으려던 그것 — 철거가 아이템 소각기 — 이 발전기에만 남는다.
    if (e.type === 'generator' && e.fuel > 0) {
      var coals = Math.floor(e.fuel / SPEC.coalEnergy);
      if (coals > 0) inventory['coal'] = (inventory['coal'] || 0) + coals;
    }
    if (e.held) inventory[e.held] = (inventory[e.held] || 0) + 1;   // 손에 쥔 것도 (안 그러면 소멸)
    if (e.cells) {
      for (var ci = 0; ci < e.cells.length; ci++) {
        var m = beltContents(e.cells[ci]);
        for (var mi in m) inventory[mi] = (inventory[mi] || 0) + m[mi];
      }
    }
  }
  delete entities[id];
  var oi = entOrder.indexOf(id);
  if (oi >= 0) entOrder.splice(oi, 1);
  // 유령 참조 제거 — 다른 제어기가 이 엔티티를 가리키고 있을 수 있다
  dropLogicRefs(id);
  // 편집 중이던 제어기를 철거하면 편집기를 닫는다. 안 그러면 죽은 그래프를 계속
  // 편집하게 되고, 그 편집은 아무 데도 반영되지 않는다.
  if (typeof closeLogicIfEditing === 'function') closeLogicIfEditing(id);
  if (typeof cancelPickIfTarget === 'function') cancelPickIfTarget(id);
  markBeltDirty();
  markPowerDirty();
  markLogicDirty();
  return true;
}

// 세계에 있는 물건을 플레이어 보유 자재로 옮긴다.
//
// 이게 없으면 게임이 막다른 길이 된다: 공장이 만든 것은 전부 상자·기계 버퍼에 쌓이는데
// 건물 비용과 손 조립은 보유 자재에서만 나가므로, 시작 지급분을 다 쓰면 상자가 가득
// 차 있어도 아무것도 못 짓는다. 예전엔 유일한 회수 경로가 "상자를 철거하는 것"이었다.
//
// 발전기 연료(이미 태울 에너지로 바뀐 것)와 터렛 탄약은 대상이 아니다 — 철거로만 회수한다.
function takeAllToStock(e) {
  if (!e) return 0;
  var moved = 0;
  function drain(bag) {
    for (var k in bag) {
      var n = bag[k];
      if (n > 0) { inventory[k] = (inventory[k] || 0) + n; moved += n; }
    }
  }
  drain(e.inv); e.inv = {};
  if (e.out) { drain(e.out); e.out = {}; }
  if (moved) { markPowerDirty(); markLogicDirty(); }
  return moved;
}
function stockTakeCount(e) {
  if (!e) return 0;
  return invTotal(e.inv || {}) + invTotal(e.out || {});
}

// 보유 자재 → 세계. takeAllToStock 의 반대편이다.
//
// 이 방향이 없으면 라인을 손으로 초기 급유(priming)할 수 없다. 보유 자재에 구리판이
// 126개 있어도 조립기에 못 넣어서, 레시피를 걸어 놓고도 왜 안 도는지 알 수 없다.
// 예전에는 발전기 석탄 버튼 하나만 이 방향이었다.
//
// **무엇을 받을지는 canAccept 가 정한다** — 인서터가 쓰는 것과 같은 판정이다.
// 따로 규칙을 쓰면 "인서터로는 들어가는데 손으로는 안 들어간다"가 반드시 생긴다.
var PUT_TYPES = { generator: 1, turret: 1, lab: 1, furnace: 1, assembler: 1 };

function stockPuttableItems(e) {
  var out = [];
  if (!e || !PUT_TYPES[e.type]) return out;
  for (var i = 0; i < ITEM_IDS.length; i++) {
    var k = ITEM_IDS[i];
    if ((inventory[k] || 0) > 0 && canAccept(e, k)) out.push(k);
  }
  return out;
}

// 출력 버퍼만 걷어온다. takeAllToStock 은 입력까지 비우는데, 기계에 그걸 쓰면
// 넣어 준 재료를 도로 뺏어서 영원히 완성되지 않는다 (자율 플레이어가 실제로 그랬다).
function takeOutputToStock(e) {
  if (!e || !e.out) return 0;
  var moved = 0;
  for (var k in e.out) {
    var n = e.out[k];
    if (n > 0) { inventory[k] = (inventory[k] || 0) + n; moved += n; }
  }
  e.out = {};
  if (moved) { markPowerDirty(); markLogicDirty(); }
  return moved;
}

// perItemMax — 한 번 호출에 **품목당** 넣을 최대 개수. 생략하면 예전처럼 버퍼가 찰
// 때까지 넣는다(플레이어의 [보유 자재 넣기] 버튼이 기대하는 동작).
// 상한이 필요한 이유: 버퍼는 품목당 50개라, 재료가 귀할 때 먼저 걸린 기계 한 대가
// 50개를 가져가 주차해 버리면 나머지가 통째로 굶는다.
function putFromStock(e, perItemMax) {
  if (!e || !PUT_TYPES[e.type]) return 0;
  var cap = (typeof perItemMax === 'number' && perItemMax > 0) ? perItemMax : Infinity;
  var moved = 0, guard = 0;
  // **굽던 것의 재료를 먼저 시도한다.** 레시피가 풀린 용광로는 ITEM_IDS 선언 순서로
  // 처음 받아들여지는 광석에 굳는데(giveTo), 그 순서는 플레이어가 볼 수 없다 —
  // 철을 굽던 용광로에 [보유 자재 넣기]를 눌렀더니 구리를 굽기 시작하는 것이
  // 그래서 일어났다. 굽던 광석이 재고에 없을 때만 예전처럼 아무거나 받는다.
  var scan = ITEM_IDS;
  if (e.type === 'furnace' && !e.recipe && e.lastRecipe && RECIPES[e.lastRecipe]) {
    var pref = [];
    for (var pk in RECIPES[e.lastRecipe].inp) pref.push(pk);
    if (pref.length && (inventory[pref[0]] || 0) > 0) {
      scan = pref.concat(ITEM_IDS);
    }
  }
  for (var i = 0; i < scan.length; i++) {
    var k = scan[i];
    // canAccept 가 기계의 버퍼 한도를 이미 알고 있으므로 여기서 다시 세지 않는다.
    // guard 는 무한루프 방어일 뿐이고 정상 경로에서는 한도가 먼저 걸린다.
    var gave = 0;
    while ((inventory[k] || 0) > 0 && gave < cap && canAccept(e, k) && guard++ < 20000) {
      if (!giveTo(e, k)) break;
      invTake(inventory, k, 1);
      moved++; gave++;
    }
  }
  if (moved) { markPowerDirty(); markLogicDirty(); }
  return moved;
}

// --- 인벤토리 헬퍼 ----------------------------------------------------------
function invCount(obj, k) { return obj[k] || 0; }
function invAdd(obj, k, n) { obj[k] = (obj[k] || 0) + n; }
function invTake(obj, k, n) {
  var have = obj[k] || 0;
  if (have < n) return false;
  obj[k] = have - n;
  if (obj[k] === 0) delete obj[k];
  return true;
}
function invTotal(obj) { var s = 0; for (var k in obj) s += obj[k]; return s; }

// --- 아이템 주고받기 --------------------------------------------------------
// 대상이 이 아이템을 받을 수 있는가 (인서터가 집기 전에 물어본다 — 교착 방지)
function canAccept(e, itemId) {
  if (!e) return false;
  switch (e.type) {
    case 'chest': return invTotal(e.inv) < SPEC.chestCap;
    case 'generator': return itemId === 'coal' && e.fuel < SPEC.coalEnergy * 20;
    case 'turret': return itemId === 'ammo' && e.ammo < 200;
    case 'lab': return (itemId === 'sci-red' || itemId === 'sci-green') && invCount(e.inv, itemId) < 100;
    case 'furnace':
    case 'assembler': {
      // 용광로에 레시피가 이미 걸려 있으면 **그 레시피의 입력만** 받는다.
      // 예전엔 '아무 제련 레시피나 받는' 판정이라, 철을 굽던 용광로가 구리광석도
      // 받아들이고는 영원히 안 쓰는 채로 입력 버퍼를 막았다.
      var rec = null;
      if (e.type === 'assembler') rec = e.recipe ? RECIPES[e.recipe] : null;
      else rec = e.recipe ? RECIPES[e.recipe] : furnaceRecipeFor(itemId);
      if (!rec) return false;
      if (!rec.inp[itemId]) return false;
      return invCount(e.inv, itemId) < SPEC.machineBufIn;
    }
    default: return false;
  }
}
function giveTo(e, itemId) {
  if (!canAccept(e, itemId)) return false;
  if (e.type === 'generator') { e.fuel += SPEC.coalEnergy; return true; }
  if (e.type === 'turret') { e.ammo += SPEC.turretShotsPerAmmo; return true; }
  if (e.type === 'furnace' && !e.recipe) e.recipe = furnaceRecipeIdFor(itemId);
  invAdd(e.inv, itemId, 1);
  return true;
}
// 대상에서 하나 꺼낸다 (필터 지정 가능)
function takeFrom(e, filter) {
  if (!e) return null;
  var src = null;
  if (e.type === 'chest') src = e.inv;
  else if (e.type === 'miner' || e.type === 'furnace' || e.type === 'assembler') src = e.out;
  else return null;
  if (filter) { return invTake(src, filter, 1) ? filter : null; }
  for (var k in src) { if (src[k] > 0) { invTake(src, k, 1); return k; } }
  return null;
}
function peekTake(e, filter) {
  if (!e) return null;
  var src = null;
  if (e.type === 'chest') src = e.inv;
  else if (e.type === 'miner' || e.type === 'furnace' || e.type === 'assembler') src = e.out;
  else return null;
  if (filter) return (src[filter] > 0) ? filter : null;
  for (var k in src) if (src[k] > 0) return k;
  return null;
}

function furnaceRecipeIdFor(itemId) {
  for (var r in RECIPES) {
    var rec = RECIPES[r];
    if (rec.cat !== 'smelt') continue;
    if (rec.inp[itemId]) { if (rec.tech && !techDone[rec.tech]) continue; return r; }
  }
  return null;
}
function furnaceRecipeFor(itemId) {
  var id = furnaceRecipeIdFor(itemId);
  return id ? RECIPES[id] : null;
}

// --- 기계 한 틱 --------------------------------------------------------------
var machineSpeedMul = 1;     // 생산 효율 연구
var machinePowerMul = 1;

function machineRecipeReady(e, rec) {
  for (var k in rec.inp) if (invCount(e.inv, k) < rec.inp[k]) return false;
  for (var o in rec.out) if (invCount(e.out, o) + rec.out[o] > SPEC.machineBufOut) return false;
  return true;
}

function stepCrafter(e, dt, speed) {
  // 용광로는 완전히 빈 순간 레시피를 놓는다 — 그래야 다음에 다른 광석을 넣으면
  // 그쪽으로 갈아탄다. 안 놓으면 철을 굽던 용광로가 영원히 구리를 거부한다.
  if (e.type === 'furnace' && e.recipe && e.progress === 0 &&
      invTotal(e.inv) === 0 && invTotal(e.out) === 0) {
    // 무엇을 굽고 있었는지는 남긴다. 레시피를 놓는 이유는 "다른 광석을 넣으면
    // 갈아탈 수 있게" 이지 "아무거나 먼저 온 것으로 바꾸려고" 가 아니다.
    e.lastRecipe = e.recipe;
    e.recipe = null;
  }
  var rec = e.recipe ? RECIPES[e.recipe] : null;
  if (!rec) { e.progress = 0; e.stallT += dt; e.working = false; return; }
  // **연구 조건은 시뮬에서도 지킨다.** 예전에는 UI 의 레시피 목록만 걸러서,
  // 그 목록을 지나지 않고 걸린 레시피(저장본·시험 훅)는 연구 없이도 돌았다.
  // 관문이 한 곳에만 있으면 그 곳을 안 지나는 길이 곧 구멍이다.
  if (rec.tech && !techDone[rec.tech]) { e.progress = 0; e.stallT += dt; e.working = false; return; }
  if (!e.enabled) { e.stallT += dt; e.working = false; return; }
  if (e.powerSat <= 0) { e.stallT += dt; e.working = false; return; }
  if (e.progress === 0 && !machineRecipeReady(e, rec)) { e.stallT += dt; e.working = false; return; }
  if (e.progress === 0) { for (var k in rec.inp) invTake(e.inv, k, rec.inp[k]); }

  e.working = true;
  e.stallT = 0;
  e.progress += (dt * speed * machineSpeedMul * e.powerSat) / rec.time;
  if (e.progress >= 1) {
    e.progress = 0;
    for (var o in rec.out) invAdd(e.out, o, rec.out[o]);
    // 누적 생산 통계 — 튜토리얼 판정이 쓴다. "지금 버퍼에 있는가"로 보면
    // 인서터가 빼 가는 순간을 놓쳐 영원히 다음 단계로 못 넘어간다.
    if (e.type === 'furnace') prodStats.smelted++;
    else prodStats.crafted++;
    prodStats.byRecipe[e.recipe] = (prodStats.byRecipe[e.recipe] || 0) + 1;
    emitPollution(e, 4);
  }
}

// 기계 출력 버퍼를 앞 타일 벨트로 밀어낸다 (채광기 전용 — 조립기·용광로는 인서터로 뺀다)
function pushToFront(e) {
  var d = e.dir;
  // 건물 앞변의 각 타일을 순서대로 시도
  var pts = [];
  if (d === 0) { for (var x = e.tx; x < e.tx + e.w; x++) pts.push([x, e.ty - 1]); }
  else if (d === 2) { for (var x2 = e.tx; x2 < e.tx + e.w; x2++) pts.push([x2, e.ty + e.h]); }
  else if (d === 1) { for (var y = e.ty; y < e.ty + e.h; y++) pts.push([e.tx + e.w, y]); }
  else { for (var y2 = e.ty; y2 < e.ty + e.h; y2++) pts.push([e.tx - 1, y2]); }
  for (var k in e.out) {
    if (e.out[k] <= 0) continue;
    for (var p = 0; p < pts.length; p++) {
      var c = cellAt(pts[p][0], pts[p][1]);
      if (c && beltAccept(c, k)) { invTake(e.out, k, 1); return true; }
      var te = entityAt(pts[p][0], pts[p][1]);
      if (te && te !== e && canAccept(te, k)) { giveTo(te, k); invTake(e.out, k, 1); return true; }
    }
  }
  return false;
}

function stepMiner(e, dt) {
  // **정지는 정지다.** 예전에는 꺼진 채광기도 pushToFront 로 버퍼를 계속 벨트에
  // 밀어냈다 — 제어기로 '정지' 시켜 놓고도 물건이 계속 나가면 정지가 아니다.
  // (전기가 없어 멈춘 경우도 같다.)
  if (!e.enabled || e.powerSat <= 0) { e.working = false; e.stallT += dt; return; }
  if (invTotal(e.out) >= SPEC.machineBufOut) { e.working = false; e.stallT += dt; pushToFront(e); return; }
  e.progress += dt * SPEC.minerRate * machineSpeedMul * e.powerSat;
  e.working = true;
  while (e.progress >= 1) {
    e.progress -= 1;
    var got = mineFrom(e.tx, e.ty, e.w, e.h);
    if (!got) { e.progress = 0; e.working = false; e.depleted = true; break; }
    e.depleted = false;
    invAdd(e.out, got, 1);
    emitPollution(e, 6);
  }
  pushToFront(e);
}

function stepGenerator(e, dt) {
  // 실제 출력은 전력망이 정한다 (e.load 0..1). 연료는 부하에 비례해 탄다.
  if (e.fuel > 0 && e.load > 0) {
    var kj = SPEC.genOutput * e.load * dt;
    e.fuel -= kj;
    if (e.fuel < 0) e.fuel = 0;
    // 매 틱 호출되므로 dt 를 곱해야 "초당" 배출이 된다.
    // 이걸 빠뜨려 60배로 뿜었고, 90초 만에 진화도 45%가 되는 것으로 드러났다.
    emitPollution(e, 20 * e.load * dt);
    e.working = true;
  } else {
    e.working = false;
  }
}

function stepLab(e, dt) {
  var t = currentResearch;
  if (!t || !e.enabled || e.powerSat <= 0) { e.working = false; return; }
  var need = TECHS[t].cost;
  for (var k in need) if (invCount(e.inv, k) < 1) { e.working = false; e.stallT += dt; return; }
  e.working = true; e.stallT = 0;
  var amt = dt * SPEC.labSpeed * machineSpeedMul * e.powerSat;
  e.researching += amt;
  while (e.researching >= 1) {
    e.researching -= 1;
    var ok = true;
    for (var k2 in need) if (invCount(e.inv, k2) < 1) ok = false;
    if (!ok) { e.researching = 0; break; }
    for (var k3 in need) invTake(e.inv, k3, 1);
    addResearchProgress(1);
  }
  emitPollution(e, 2 * dt);      // 틱마다 호출 → dt 필요 (발전기와 같은 함정)
}

// --- 인서터 ------------------------------------------------------------------
function inserterSource(e) { var d = dirOpp(e.dir); return { x: e.tx + DIR_DX[d], y: e.ty + DIR_DY[d] }; }
function inserterTarget(e) { return { x: e.tx + DIR_DX[e.dir], y: e.ty + DIR_DY[e.dir] }; }

function inserterCanPlace(e, itemId) {
  var t = inserterTarget(e);
  var c = cellAt(t.x, t.y);
  if (c) return laneHasRoom(c.lanes[0]) || laneHasRoom(c.lanes[1]);
  return canAccept(entityAt(t.x, t.y), itemId);
}
function inserterDoPlace(e, itemId) {
  var t = inserterTarget(e);
  var c = cellAt(t.x, t.y);
  if (c) return beltAccept(c, itemId);
  var te = entityAt(t.x, t.y);
  if (te && canAccept(te, itemId)) return giveTo(te, itemId);
  return false;
}
function inserterPeekSource(e) {
  var s = inserterSource(e);
  var c = cellAt(s.x, s.y);
  // beltPeek 은 beltTake 와 **같은 규칙**으로 고른다. 여기서 어긋나면
  // "놓을 수 있는지"를 A로 검사하고 B를 집어 영원히 쥔 채 굳는다.
  if (c) return beltPeek(c, e.filter);
  return peekTake(entityAt(s.x, s.y), e.filter);
}
function inserterGrab(e) {
  var s = inserterSource(e);
  var c = cellAt(s.x, s.y);
  if (c) return beltTake(c, e.filter);
  return takeFrom(entityAt(s.x, s.y), e.filter);
}

function stepInserter(e, dt) {
  if (!e.enabled) { e.working = false; e.stallT += dt; return; }
  if (e.powerSat <= 0) { e.working = false; e.stallT += dt; return; }
  var half = SPEC.inserterSwing / 2;
  var adv = (dt / half) * e.powerSat;

  if (e.phase === 0) {
    // 뒤로 뻗는 중 — 도착하면 집는다. 단 놓을 곳이 없으면 집지 않는다(자원 점유 금지).
    e.t += adv;
    if (e.t >= 1) {
      var peek = inserterPeekSource(e);
      if (peek === null || peek === undefined) { e.t = 1; e.working = false; e.stallT += dt; return; }
      if (!inserterCanPlace(e, peek)) { e.t = 1; e.working = false; e.stallT += dt; return; }
      var got = inserterGrab(e);
      if (got === null || got === undefined) { e.t = 1; e.working = false; e.stallT += dt; return; }
      e.held = got; e.phase = 1; e.t = 0; e.stallT = 0;
    }
    e.working = true;
  } else {
    e.t += adv;
    if (e.t >= 1) {
      if (inserterDoPlace(e, e.held)) {
        e.held = null; e.phase = 0; e.t = 0; e.stallT = 0;
      } else {
        e.t = 1; e.working = false; e.stallT += dt;   // 손에 쥔 채 대기
        return;
      }
    }
    e.working = true;
  }
}

// --- 오염 배출 ---------------------------------------------------------------
function emitPollution(e, perCraft) {
  addPollution(e.tx + (e.w >> 1), e.ty + (e.h >> 1), perCraft * 0.02);
}

/* ===================== 30_power.js ===================== */
// ===========================================================================
//  30_power.js — 전력망
//
//  전주끼리 7.5타일 안이면 같은 망. 전주는 자기 중심 5x5 를 공급한다.
//  기계는 자기 타일 중 하나라도 공급구역에 걸치면 그 망에 붙는다.
//
//  만족도 = min(1, 공급 / 수요). 부족하면 모든 기계가 그 비율로 느려진다
//  (Factorio 의 브라운아웃). 제어기가 이 값을 읽어 부하를 차단하는 것이
//  이 게임에서 가장 재미있는 자동화 과제다.
// ===========================================================================

var powerDirty = true;
var netCover = new Int32Array(W * H);   // 0 = 비공급, n>0 = 망 번호 n-1
var nets = [];                          // { supplyCap, demand, sat, gens[], loads }

function markPowerDirty() { powerDirty = true; }

function powerDraw(e) {
  var B = BUILDINGS[e.type];
  if (!B || !B.power) return 0;
  if (!e.enabled) return 0;
  var p = B.power * machinePowerMul;
  switch (e.type) {
    case 'miner':
      if (e.depleted) return 0;
      return invTotal(e.out) >= SPEC.machineBufOut ? 0 : p;
    case 'furnace':
    case 'assembler': {
      var rec = e.recipe ? RECIPES[e.recipe] : null;
      if (!rec) return 0;
      if (e.progress > 0) return p;
      return machineRecipeReady(e, rec) ? p : 0;
    }
    case 'lab': {
      if (!currentResearch) return 0;
      var need = TECHS[currentResearch].cost;
      for (var k in need) if (invCount(e.inv, k) < 1) return 0;
      return p;
    }
    default:
      return p;
  }
}

function rebuildPower() {
  netCover.fill(0);
  nets = [];
  var poles = [];
  forEachEntity(function (e) { if (e.type === 'pole') poles.push(e); });

  // 유니온-파인드로 전주를 묶는다
  var parent = new Int32Array(poles.length);
  for (var i = 0; i < poles.length; i++) parent[i] = i;
  function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
  function uni(a, b) { a = find(a); b = find(b); if (a !== b) parent[b] = a; }
  var reach2 = SPEC.poleReach * SPEC.poleReach;
  for (var a = 0; a < poles.length; a++) {
    for (var b = a + 1; b < poles.length; b++) {
      if (dist2(poles[a].tx, poles[a].ty, poles[b].tx, poles[b].ty) <= reach2) uni(a, b);
    }
  }
  // 루트 → 망 번호
  var rootNet = {};
  for (var p = 0; p < poles.length; p++) {
    var r = find(p);
    if (rootNet[r] === undefined) {
      rootNet[r] = nets.length;
      nets.push({ supplyCap: 0, demand: 0, sat: 1, gens: [], poles: [] });
    }
    poles[p].net = rootNet[r];
    nets[rootNet[r]].poles.push(poles[p]);
  }
  // 공급구역 스탬프
  var S = SPEC.poleSupply;
  for (var q = 0; q < poles.length; q++) {
    var e0 = poles[q];
    for (var y = e0.ty - S; y <= e0.ty + S; y++) {
      for (var x = e0.tx - S; x <= e0.tx + S; x++) {
        if (inBounds(x, y)) netCover[idx(x, y)] = e0.net + 1;
      }
    }
  }
  // 기계를 망에 붙인다
  forEachEntity(function (e) {
    if (e.type === 'pole') return;
    e.net = -1;
    for (var y = e.ty; y < e.ty + e.h && e.net < 0; y++) {
      for (var x = e.tx; x < e.tx + e.w; x++) {
        if (!inBounds(x, y)) continue;
        var c = netCover[idx(x, y)];
        if (c > 0) { e.net = c - 1; break; }
      }
    }
    if (e.net >= 0 && e.type === 'generator') nets[e.net].gens.push(e);
  });
  rebuildWireEdges();
  powerDirty = false;
}

// 그릴 전선 목록 — 도달 범위 안 "모든 쌍"을 그으면 격자 배치에서 대각선까지 이어져
// 화면이 그물이 된다(레퍼런스의 전선은 몇 가닥뿐이다). 망마다 최소신장트리만 남긴다.
// 전기적 연결성은 유니온-파인드가 이미 정했으므로, 여기는 순수하게 표시용이다.
var wireEdges = [];
function rebuildWireEdges() {
  wireEdges = [];
  for (var n = 0; n < nets.length; n++) {
    var ps = nets[n].poles;
    if (ps.length < 2) continue;
    var inTree = [0];
    var rest = [];
    for (var i = 1; i < ps.length; i++) rest.push(i);
    while (rest.length) {
      var bestA = -1, bestB = -1, bestD = Infinity, bestRi = -1;
      for (var r = 0; r < rest.length; r++) {
        for (var t = 0; t < inTree.length; t++) {
          var d = dist2(ps[rest[r]].tx, ps[rest[r]].ty, ps[inTree[t]].tx, ps[inTree[t]].ty);
          if (d < bestD) { bestD = d; bestA = inTree[t]; bestB = rest[r]; bestRi = r; }
        }
      }
      if (bestB < 0) break;
      wireEdges.push([ps[bestA].tx, ps[bestA].ty, ps[bestB].tx, ps[bestB].ty]);
      inTree.push(bestB);
      rest.splice(bestRi, 1);
    }
  }
}

var powerStats = { supply: 0, demand: 0, sat: 1, netCount: 0 };

// 시험 전용 — 전력을 논외로 두고 다른 계통만 재고 싶을 때 켠다.
// 전력 자체는 별도 게이트(brownout / satScalesSpeed / energyBalance / noFuelStops)로
// 진짜 발전기를 놓고 검정하므로, 이 우회로가 전력 검증을 갉아먹지 않는다.
var powerCheatOn = false;

function stepPower(dt) {
  if (powerDirty) rebuildPower();
  // 발전기 부하는 매 틱 0 에서 시작해 아래 망 루프가 다시 채운다.
  // 이 초기화가 없으면 전주를 철거해 망에서 떨어진 발전기가 **마지막 부하율로
  // 영원히 연료를 태우고 오염을 뿜는다** (전기는 아무 데도 안 가는데).
  // 틱 순서가 stepPower → stepEntities 라 연결된 발전기는 같은 틱에 값이 복구된다.
  forEachEntity(function (e) { if (e.type === 'generator') e.load = 0; });
  if (powerCheatOn) {
    var dem = 0;
    forEachEntity(function (e) { e.powerSat = 1; dem += powerDraw(e); });
    powerStats.supply = dem; powerStats.demand = dem; powerStats.sat = 1;
    powerStats.netCount = nets.length;
    return;
  }
  var totSup = 0, totDem = 0;

  for (var n = 0; n < nets.length; n++) {
    var net = nets[n];
    net.supplyCap = 0;
    for (var g = 0; g < net.gens.length; g++) {
      var gen = net.gens[g];
      // 꺼진 발전기는 공급하지 않는다 — 제어기의 가동/정지 노드가 발전기에도 먹혀야
      // "예비 발전기를 필요할 때만 돌린다" 같은 배선이 성립한다.
      if (gen.fuel > 0 && gen.enabled) net.supplyCap += SPEC.genOutput;
    }
    net.demand = 0;
  }
  forEachEntity(function (e) {
    if (e.net < 0 || e.net >= nets.length) { e.powerSat = 0; return; }
    nets[e.net].demand += powerDraw(e);
  });
  for (var n2 = 0; n2 < nets.length; n2++) {
    var nt = nets[n2];
    nt.sat = nt.demand <= 0 ? 1 : Math.min(1, nt.supplyCap / nt.demand);
    // 발전기 부하율 — 연료는 실제로 뽑아 쓴 만큼만 탄다
    var used = Math.min(nt.demand, nt.supplyCap);
    var loadFrac = nt.supplyCap > 0 ? used / nt.supplyCap : 0;
    for (var g2 = 0; g2 < nt.gens.length; g2++) {
      nt.gens[g2].load = (nt.gens[g2].fuel > 0 && nt.gens[g2].enabled) ? loadFrac : 0;
    }
    totSup += nt.supplyCap; totDem += nt.demand;
  }
  forEachEntity(function (e) {
    if (e.type === 'pole' || e.type === 'generator') { e.powerSat = 1; return; }
    var B = BUILDINGS[e.type];
    if (!B || !B.power) { e.powerSat = 1; return; }
    e.powerSat = (e.net >= 0 && e.net < nets.length) ? nets[e.net].sat : 0;
  });

  powerStats.supply = totSup;
  powerStats.demand = totDem;
  powerStats.sat = totDem <= 0 ? 1 : Math.min(1, totSup / totDem);
  powerStats.netCount = nets.length;
  void dt;
}

// 제어기 센서용 — 특정 엔티티가 속한 망의 만족도
function netSatOf(e) {
  if (!e || e.net < 0 || e.net >= nets.length) return 0;
  return nets[e.net].sat;
}
// 망별 전력 수지. **전역 합계를 쓰면 안 된다** — 발전소가 둘 이상이면 제어기가
// 지도 반대편 공장의 숫자를 보고 판단한다(감사에서 오탐·미탐 둘 다 재현됐다).
// 여유kW 는 클램프하지 않는다: 만족%는 min(1,·) 로 100 에서 잘려 "얼마나 남는가"를
// 구별할 수 없고, 그래서 부하 차단 히스테리시스에 쓸 사공간이 없었다.
function netPowerOf(e) {
  if (!e || e.net < 0 || e.net >= nets.length) {
    return { connected: 0, supply: 0, demand: 0, head: 0 };
  }
  var nt = nets[e.net];
  return { connected: 1, supply: nt.supplyCap, demand: nt.demand,
           head: nt.supplyCap - nt.demand };
}

/* ===================== 35_logic.js ===================== */
// ===========================================================================
//  35_logic.js — ★ 이 게임의 차별점: 프로그래머블 제어기
//
//  제어기 하나는 데이터플로 그래프다. 매 틱 위상순으로 한 번 평가한다.
//  순환(피드백)이 생기면 그 간선만 "직전 틱의 값"을 읽는다 — 즉 1틱 지연 레지스터다.
//  실제 순차논리(D 플립플롭 한 단)와 같은 의미이고, 그래서 SR 래치·카운터·PID 같은
//  상태 소자를 자연스럽게 배선할 수 있다.
//
//  값은 전부 실수 하나. **참/거짓은 0.5 이상 = 참**이다 (TRUE_EPS).
//  0 초과가 아니다 — 0.4 는 거짓이다. 신호가 대부분 정수(0/1)라 잡음을
//  참으로 읽지 않으려고 이렇게 뒀다. 사칙 1/4=0.25, PID 출력 0.3 처럼
//  소수를 내는 노드를 참/거짓 자리에 물릴 때 걸린다 — 도움말에도 적어 둔다.
// ===========================================================================

var TRUE_EPS = 0.5;      // >= 0.5 를 참으로 본다 (정수 신호가 대부분이라)
function truthy(v) { return v >= TRUE_EPS; }

// --- 노드 정의표 -----------------------------------------------------------
//  cat: 'in' 입력 / 'op' 연산 / 'out' 출력
//  cfg 항목 type: 'num' | 'item' | 'ent' | 'opsel' | 'text'
var NODE_DEFS = {
  // ---- 입력 ----
  'const':   { label: '상수', cat: 'in', ins: [], outs: ['값'],
               cfg: [{ k: 'value', t: 'num', label: '값', def: 1 }] },
  'chest':   { label: '상자 재고', cat: 'in', ins: [], outs: ['개수'],
               cfg: [{ k: 'ent', t: 'ent', label: '대상', filter: ['chest'] },
                     { k: 'item', t: 'item', label: '품목' }] },
  'machine': { label: '기계 상태', cat: 'in', ins: [], outs: ['가동', '정체', '진행%'],
               cfg: [{ k: 'ent', t: 'ent', label: '대상',
                       filter: ['miner', 'furnace', 'assembler', 'lab', 'generator', 'turret', 'inserter'] }] },
  // 출구 다섯 개 **모두 자기 전력망 기준**이다. 예전에는 만족%만 자기 망이고
