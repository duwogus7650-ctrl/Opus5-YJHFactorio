var NODE_KINDS = Object.keys(NODE_DEFS);

function nodeAvailable(kind) {
  var d = NODE_DEFS[kind];
  return !d.tech || !!techDone[d.tech];
}

// --- 그래프 ----------------------------------------------------------------
function newGraph() {
  return { nodes: [], links: [], nextNid: 1, order: null, backEdges: null, dirty: true };
}
function graphAddNode(g, kind, x, y) {
  var d = NODE_DEFS[kind];
  var n = { nid: g.nextNid++, kind: kind, x: x, y: y, cfg: {}, state: {}, out: [], prev: [] };
  for (var i = 0; i < d.cfg.length; i++) {
    var c = d.cfg[i];
    n.cfg[c.k] = (c.def !== undefined) ? c.def : (c.t === 'num' ? 0 : (c.t === 'opsel' ? c.opts[0] : null));
  }
  for (var o = 0; o < d.outs.length; o++) { n.out.push(0); n.prev.push(0); }
  g.nodes.push(n);
  g.dirty = true;
  return n;
}
function graphNode(g, nid) {
  for (var i = 0; i < g.nodes.length; i++) if (g.nodes[i].nid === nid) return g.nodes[i];
  return null;
}
function graphRemoveNode(g, nid) {
  for (var i = g.nodes.length - 1; i >= 0; i--) if (g.nodes[i].nid === nid) g.nodes.splice(i, 1);
  for (var j = g.links.length - 1; j >= 0; j--) {
    if (g.links[j].fn === nid || g.links[j].tn === nid) g.links.splice(j, 1);
  }
  g.dirty = true;
}
// 입력 포트 하나에는 간선 하나만 — 여러 개가 붙으면 값이 결정되지 않는다
function graphLink(g, fromNid, fromPort, toNid, toPort) {
  if (fromNid === toNid) return false;
  for (var j = g.links.length - 1; j >= 0; j--) {
    if (g.links[j].tn === toNid && g.links[j].tp === toPort) g.links.splice(j, 1);
  }
  g.links.push({ fn: fromNid, fp: fromPort, tn: toNid, tp: toPort });
  g.dirty = true;
  return true;
}
function graphUnlink(g, toNid, toPort) {
  for (var j = g.links.length - 1; j >= 0; j--) {
    if (g.links[j].tn === toNid && g.links[j].tp === toPort) { g.links.splice(j, 1); g.dirty = true; }
  }
}

// --- 위상정렬 + 피드백 간선 판별 ---------------------------------------------
// DFS 로 후향 간선(back edge)을 찾아 그것만 "직전 틱 값"으로 읽게 표시한다.
function graphCompile(g) {
  var byId = {};
  for (var i = 0; i < g.nodes.length; i++) byId[g.nodes[i].nid] = g.nodes[i];
  var adj = {};
  for (var a = 0; a < g.nodes.length; a++) adj[g.nodes[a].nid] = [];
  for (var l = 0; l < g.links.length; l++) {
    var lk = g.links[l];
    if (byId[lk.fn] && byId[lk.tn]) adj[lk.fn].push({ to: lk.tn, link: lk });
    lk.back = false;
  }

  // **평가 순서는 '화면에 보이는 배치'의 함수여야 한다.**
  // 예전에는 DFS 진입점 순서 = g.nodes 배열 순서 = **노드를 만든 순서**였다.
  // 그래서 위치와 배선이 글자 하나까지 같은 두 회로가 다르게 돌았다 — 어느 배선이
  // 1틱 지연 되먹임이 되는지가 갈렸고, 값까지 달라졌다. 더 나쁜 것은 노드 하나를
  // 지우고 같은 자리에 다시 만들면(splice 후 push) 그 노드가 순서 맨 뒤로 밀려
  // 손도 안 댄 회로가 갑자기 다르게 도는 것이었다.
  // 화면에는 좌표와 배선만 보이고 생성 순서는 어디에도 안 나오므로, 플레이어가
  // 원인을 짚을 단서가 없었다. 좌표순으로 정렬하면 보이는 것이 곧 규칙이 된다.
  function layoutKey(n) { return [Math.round(n.x), Math.round(n.y), n.nid]; }
  function cmpNode(p, q) {
    var A = layoutKey(p), B = layoutKey(q);
    return (A[0] - B[0]) || (A[1] - B[1]) || (A[2] - B[2]);
  }
  var roots = g.nodes.slice().sort(cmpNode);
  for (var r2 = 0; r2 < roots.length; r2++) {
    var ls2 = adj[roots[r2].nid];
    if (ls2 && ls2.length > 1) {
      ls2.sort(function (u, v) { return cmpNode(byId[u.to], byId[v.to]); });
    }
  }
  var color = {};     // 0 미방문, 1 스택 위, 2 완료
  var order = [];
  function dfs(nid) {
    color[nid] = 1;
    var ls = adj[nid];
    for (var k = 0; k < ls.length; k++) {
      var t = ls[k].to;
      if (color[t] === 1) { ls[k].link.back = true; }        // 후향 간선 = 피드백
      else if (!color[t]) dfs(t);
    }
    color[nid] = 2;
    order.push(nid);
  }
  // **후위순회를 숲 전체에서 한 번에 뒤집는다 (reverse post-order).** 이것만이
  // 그래프 전체의 올바른 위상순서다 — 즉 어떤 노드도 자기 입력보다 먼저 돌지 않는다.
  //
  // 두 번 손댔다가 두 번 다 되돌렸으니 다시 건드리지 말 것:
  //   · 나무마다 따로 뒤집기 → 두 나무가 공유하는 노드가 입력보다 먼저 돌아
  //     샘플홀드가 옛 샘플로 갱신됐다 (node.hold RED).
  //   · 진입을 좌표 역순으로 → 순환 회로는 진입점이 하나뿐이라 좌표를 옮겨도
  //     순서가 안 바뀌었다 (ctrl.orderFollowsLayout RED).
  //
  // 한 회로 안에서는 "왼쪽 위가 먼저"가 성립한다(진입점이 먼저 나온다). 서로 이어지지
  // 않은 회로 **사이의** 순서는 DFS 구조가 정하며 좌표대로가 아니다 — 도움말은
  // 그 사실대로 쓴다. 같은 대상을 두 회로가 잡으면 순서에 기대지 말고 충돌 경고를 볼 것.
  for (var s = 0; s < roots.length; s++) if (!color[roots[s].nid]) dfs(roots[s].nid);
  order.reverse();
  g.order = order;
  g.byId = byId;
  // 입력 포트별 소스 링크 색인
  g.inLinks = {};
  for (var m = 0; m < g.links.length; m++) {
    var lm = g.links[m];
    if (!byId[lm.fn] || !byId[lm.tn]) continue;
    g.inLinks[lm.tn + ':' + lm.tp] = lm;
  }
  g.dirty = false;
  g.cycles = g.links.filter(function (x) { return x.back; }).length;
}

// --- 평가 -------------------------------------------------------------------
var logicDirty = true;
function markLogicDirty() { logicDirty = true; }
function dropLogicRefs(entId) {
  forEachEntity(function (e) {
    if (e.type !== 'controller' || !e.graph) return;
    for (var i = 0; i < e.graph.nodes.length; i++) {
      var n = e.graph.nodes[i];
      if (n.cfg && n.cfg.ent === entId) n.cfg.ent = null;
    }
  });
}

var alarms = [];        // 이번 틱에 켜진 램프 문구
var displays = [];      // { label, value }

// 이 입력 포트에 배선이 실제로 물려 있는가. 값이 0 인 것과 아예 안 물린 것은
// 다르다 — 출력 노드가 그 둘을 구별하지 않아 '안 물림'을 '정지 명령'으로 읽었다.
function inputFed(g, n, port) {
  return !!(g.inLinks && g.inLinks[n.nid + ':' + port]);
}

function readIn(g, n, port) {
  // **컴파일 전 그래프에서 부를 수 있다.** inLinks 는 graphCompile 이 만드는데,
  // 편집기의 해석 줄(updateLive)은 제어기가 아직 한 번도 평가되지 않은 상태에서도
  // 이 함수를 부른다 — 그때 g.inLinks 가 undefined 라 TypeError 로 죽고,
  // 그 예외가 updateLive 전체를 멈춰 편집기가 영구히 얼어붙는다.
  if (!g.inLinks) return 0;
  var lk = g.inLinks[n.nid + ':' + port];
  if (!lk) return 0;
  var src = g.byId[lk.fn];
  if (!src) return 0;
  var v = lk.back ? src.prev[lk.fp] : src.out[lk.fp];
  return (typeof v === 'number' && isFinite(v)) ? v : 0;
}

function evalNode(g, n, dt, ctrl) {
  var d = NODE_DEFS[n.kind];
  if (d.tech && !techDone[d.tech]) { for (var z = 0; z < n.out.length; z++) n.out[z] = 0; return; }
  switch (n.kind) {
    case 'const': n.out[0] = +n.cfg.value || 0; break;

    case 'chest': {
      var e = entities[n.cfg.ent];
      if (!e || e.type !== 'chest') { n.out[0] = 0; break; }
      n.out[0] = n.cfg.item ? invCount(e.inv, n.cfg.item) : invTotal(e.inv);
      break;
    }
    case 'machine': {
      var m = entities[n.cfg.ent];
      if (!m) { n.out[0] = 0; n.out[1] = 0; n.out[2] = 0; break; }
      n.out[0] = m.working ? 1 : 0;
      n.out[1] = m.stallT > 1.5 ? 1 : 0;
      n.out[2] = Math.round((m.progress || 0) * 100);
      break;
    }
    case 'power': {
      var np = ctrl ? netPowerOf(ctrl)
                    : { connected: 1, supply: powerStats.supply,
                        demand: powerStats.demand, head: powerStats.supply - powerStats.demand };
      var sat = ctrl ? netSatOf(ctrl) : powerStats.sat;
      n.out[0] = Math.round(sat * 100);
      n.out[1] = Math.round(np.supply);
      n.out[2] = Math.round(np.demand);
      n.out[3] = Math.round(np.head);      // 클램프 없음 — 남는 쪽도 보인다
      n.out[4] = np.connected;
      break;
    }
    case 'timer': {
      var per = Math.max(0.05, +n.cfg.period || 1);
      n.state.t = (n.state.t || 0) + dt;
      var fired = 0;
      if (n.state.t >= per) { n.state.t -= per; fired = 1; }
      n.out[0] = fired;
      n.out[1] = Math.round((n.state.t / per) * 100);
      break;
    }
    case 'belt': {
      var be = entities[n.cfg.ent];
      if (!be || !be.cells) { n.out[0] = 0; break; }
      var acc = {};
      for (var c = 0; c < be.cells.length; c++) beltContents(be.cells[c], acc);
      n.out[0] = n.cfg.item ? (acc[n.cfg.item] || 0) : invTotal(acc);
      break;
    }
    case 'invsense': n.out[0] = n.cfg.item ? (inventory[n.cfg.item] || 0) : 0; break;
    case 'research': {
      n.out[0] = currentResearch ? Math.round(researchFrac() * 100) : 0;
      n.out[1] = currentResearch ? 1 : 0;
      break;
    }
    case 'enemy': {
      var R = Math.max(1, +n.cfg.radius || 30);
      var cx = ctrl ? ctrl.tx + 1 : world.spawnX, cy = ctrl ? ctrl.ty + 1 : world.spawnY;
      var cnt = 0, near = R + 1;
      for (var i = 0; i < enemies.length; i++) {
        var dd = dist(enemies[i].x, enemies[i].y, cx, cy);
        if (dd <= R) { cnt++; if (dd < near) near = dd; }
      }
      n.out[0] = cnt;
      // 적이 없을 때 0(=가장 가까움)을 내면 "거리 < 10 이면 방어" 같은 배선이
      // 평상시에 항상 참이 된다. 감지 반경 밖을 뜻하는 값을 낸다.
      n.out[1] = cnt ? Math.round(near * 10) / 10 : R;
      break;
    }

    case 'cmp': {
      var A = readIn(g, n, 0), B = readIn(g, n, 1), r = 0;
      switch (n.cfg.op) {
        case '>': r = A > B; break;
        case '>=': r = A >= B; break;
        case '<': r = A < B; break;
        case '<=': r = A <= B; break;
        case '==': r = A === B; break;
        case '!=': r = A !== B; break;
      }
      n.out[0] = r ? 1 : 0;
      break;
    }
    case 'math': {
      var a1 = readIn(g, n, 0), b1 = readIn(g, n, 1), v = 0;
      switch (n.cfg.op) {
        case '+': v = a1 + b1; break;
        case '-': v = a1 - b1; break;
        case '*': v = a1 * b1; break;
        case '/': v = b1 === 0 ? 0 : a1 / b1; break;      // 0 나눗셈은 0 — NaN 전파 금지
        case '%': v = b1 === 0 ? 0 : a1 % b1; break;
        case 'min': v = Math.min(a1, b1); break;
        case 'max': v = Math.max(a1, b1); break;
      }
      n.out[0] = isFinite(v) ? v : 0;
      break;
    }
    case 'bool': {
      var ba = truthy(readIn(g, n, 0)), bb = truthy(readIn(g, n, 1)), rb = false;
      switch (n.cfg.op) {
        case 'AND': rb = ba && bb; break;
        case 'OR': rb = ba || bb; break;
        case 'XOR': rb = ba !== bb; break;
        case 'NOT A': rb = !ba; break;
      }
      n.out[0] = rb ? 1 : 0;
      break;
    }
    case 'clamp': n.out[0] = clamp(readIn(g, n, 0), +n.cfg.lo || 0, +n.cfg.hi || 0); break;
    case 'select': n.out[0] = truthy(readIn(g, n, 0)) ? readIn(g, n, 1) : readIn(g, n, 2); break;

    case 'latch': {
      var S = truthy(readIn(g, n, 0)), R2 = truthy(readIn(g, n, 1));
      if (R2) n.state.q = 0; else if (S) n.state.q = 1;
      n.out[0] = n.state.q ? 1 : 0;
      break;
    }
    case 'counter': {
      var inc = truthy(readIn(g, n, 0)), rst = truthy(readIn(g, n, 1));
      if (n.state.prevInc === undefined) n.state.prevInc = false;
      if (rst) n.state.c = 0;
      else if (inc && !n.state.prevInc) n.state.c = (n.state.c || 0) + 1;
      n.state.prevInc = inc;
      var mx = +n.cfg.max || 0;
      if (mx > 0 && n.state.c > mx) n.state.c = 0;
      n.out[0] = n.state.c || 0;
      break;
    }
    case 'edge': {
      var cur = truthy(readIn(g, n, 0));
      var pv = !!n.state.prev;
      var fire2 = 0;
      if (n.cfg.mode === '상승') fire2 = (cur && !pv) ? 1 : 0;
      else if (n.cfg.mode === '하강') fire2 = (!cur && pv) ? 1 : 0;
      else fire2 = (cur !== pv) ? 1 : 0;
      n.state.prev = cur;
      n.out[0] = fire2;
      break;
    }
    case 'hold': {
      if (truthy(readIn(g, n, 1))) n.state.v = readIn(g, n, 0);
      n.out[0] = n.state.v || 0;
      break;
    }
    case 'pid': {
      var sp = readIn(g, n, 0), pv2 = readIn(g, n, 1);
      var err = sp - pv2;
      var kp = +n.cfg.kp || 0, ki = +n.cfg.ki || 0, kd = +n.cfg.kd || 0;
      var lim = Math.abs(+n.cfg.lim || 100);
      if (n.state.i === undefined) n.state.i = 0;
      if (n.state.pe === undefined) n.state.pe = err;
      // 적분 와인드업 방지 — 적분항 자체를 제한 안에 가둔다
      if (ki !== 0) n.state.i = clamp(n.state.i + err * dt, -lim / Math.abs(ki), lim / Math.abs(ki));
      var der = dt > 0 ? (err - n.state.pe) / dt : 0;
      n.state.pe = err;
      var u = kp * err + ki * n.state.i + kd * der;
      n.out[0] = clamp(isFinite(u) ? u : 0, -lim, lim);
      n.out[1] = Math.round(err * 100) / 100;
      break;
    }

    case 'enable': {
      // **입력이 안 물렸으면 지배하지 않는다.** readIn 이 0 을 돌려주므로 예전에는
      // 노드를 놓고 대상만 고른 순간 기계가 즉시 멈췄다 — 배선을 하나도 안 했는데
      // 말이다. 아직 아무 말도 하지 않는 노드가 세계를 붙잡으면 안 된다.
      if (!inputFed(g, n, 0)) break;
      var te = entities[n.cfg.ent];
      // 자기 자신은 끌 수 없다 — 끄는 순간 평가가 멈추고 지배가 풀려 다시 켜지는 발진이 된다.
      if (te && ctrl && te.id === ctrl.id) break;
      if (te) {
        noteAxisWriter(te, '가동', ctrl);
        te.enabled = truthy(readIn(g, n, 0)); te.logicForced = true; te.fEnable = true;
      }
      break;
    }
    case 'gate': {
      if (!inputFed(g, n, 0)) break;
      var ge = entities[n.cfg.ent];
      if (ge && ge.cells) {
        var open = truthy(readIn(g, n, 0));
        noteAxisWriter(ge, '게이트', ctrl);
        for (var gc = 0; gc < ge.cells.length; gc++) ge.cells[gc].gate = open;
        ge.logicForced = true; ge.fGate = true;
      }
      break;
    }
    case 'filter': {
      if (!inputFed(g, n, 0)) break;
      var fe = entities[n.cfg.ent];
      if (fe && fe.type === 'inserter') {
        noteAxisWriter(fe, '필터', ctrl);
        fe.filter = truthy(readIn(g, n, 0)) ? (n.cfg.b || null) : (n.cfg.a || null);
        fe.logicForced = true; fe.fFilter = true;
      }
      break;
    }
    case 'fire': {
      if (!inputFed(g, n, 0)) break;
      var tu = entities[n.cfg.ent];
      if (tu && tu.type === 'turret') {
        noteAxisWriter(tu, '사격허가', ctrl);
        tu.fireOk = truthy(readIn(g, n, 0)); tu.logicForced = true; tu.fFire = true;
      }
      break;
    }
    case 'lamp': {
      // HUD 는 이름으로 중복을 지운다 — 기본 이름이 같으면 두 번째부터 화면에서
      // 사라진다. 이름을 안 적었으면 노드 번호로 구분한다.
      if (truthy(readIn(g, n, 0))) alarms.push(String(n.cfg.label || ('경보 #' + n.nid)));
      break;
    }
    case 'display': {
      displays.push({ label: String(n.cfg.label || ('값 #' + n.nid)), value: readIn(g, n, 0) });
      break;
    }
  }
}

// 제어기 하나 평가
// 같은 틱에 같은 축을 두 제어기가 쓰면 나중에 평가된 쪽이 이긴다. 그 자체는
// 결정적이지만 플레이어에게는 설명 불가능한 현상이라(한쪽 회로가 통째로 무시된
// 것처럼 보인다) 사실을 기록해 인스펙터에 드러낸다.
function noteAxisWriter(target, axis, ctrl) {
  if (!target || !ctrl) return;
  var prev = target.axisBy && target.axisBy[axis];
  if (prev && prev !== ctrl.id) {
    target.logicConflict = axis + ': 제어기 #' + prev + ' 와 #' + ctrl.id +
                           ' 가 동시에 지배 — 나중에 평가된 #' + ctrl.id + ' 가 이긴다';
  }
  if (!target.axisBy) target.axisBy = {};
  target.axisBy[axis] = ctrl.id;
}

function stepController(e, dt) {
  var g = e.graph;
  if (!g) return;
  // 전력은 보지 않는다 — 제어기는 전기를 쓰지 않는다(05_data.js 의 주석 참고).
  if (!e.enabled) { e.lastEval = null; return; }
  if (g.dirty || !g.order) graphCompile(g);
  // 직전 값 저장 — 피드백 간선이 읽는다
  for (var i = 0; i < g.nodes.length; i++) {
    var n = g.nodes[i];
    for (var p = 0; p < n.out.length; p++) n.prev[p] = n.out[p];
  }
  for (var k = 0; k < g.order.length; k++) {
    var node = g.byId[g.order[k]];
    if (node) evalNode(g, node, dt, e);
  }
  // 1틱 펄스는 표본으로 못 잡는다(폭 16.7ms vs 편집기 표본 140ms). 값 대신
  // **상승 횟수**를 세어 두면 표본을 놓쳐도 증거가 남는다. 편집기는 이 숫자가
  // 늘었는지로 LED 를 켠다 — 그래야 타이머가 도는 것이 화면에 보인다.
  for (var f = 0; f < g.nodes.length; f++) {
    var fn = g.nodes[f];
    if (!fn.fires) { fn.fires = []; for (var z = 0; z < fn.out.length; z++) fn.fires.push(0); }
    for (var fp = 0; fp < fn.out.length; fp++) {
      if (fn.out[fp] >= TRUE_EPS && fn.prev[fp] < TRUE_EPS) fn.fires[fp]++;
    }
  }
  e.lastEval = { nodes: g.nodes.length, links: g.links.length, cycles: g.cycles || 0 };
}

// 매 틱: logicForced 를 먼저 지우고 모든 제어기를 돌린다.
// 지우지 않으면 제어 노드를 삭제해도 기계가 영원히 꺼진 채로 남는다 (유령 지배).
function stepLogic(dt) {
  alarms.length = 0;
  displays.length = 0;
  forEachEntity(function (e) {
    e.logicForced = false; e.fEnable = false; e.fGate = false; e.fFilter = false; e.fFire = false;
    // 이번 틱에 이 축을 쓴 제어기가 누구인지 기억한다. 둘이 겹치면 나중에 평가된
    // 쪽이 조용히 이겨서, 한쪽 회로가 통째로 무시당하는 것처럼 보인다.
    e.axisBy = null; e.logicConflict = null;
  });
  forEachEntity(function (e) {
    if (e.type === 'controller') guard('controller#' + e.id, function () { stepController(e, dt); });
  });
  // 지배가 풀린 대상은 플레이어의 의사로 되돌린다.
  // 되돌리지 않으면 제어 노드를 지운 뒤에도 기계가 영원히 꺼진 채 남는다(유령 지배).
  // 축(가동/게이트/필터/사격)마다 따로 본다 — 게이트만 지배당한 벨트의 enabled 까지
  // 묶어서 판정하면 엉뚱한 축이 고정된다.
  forEachEntity(function (e) {
    if (!e.fEnable) e.enabled = (e.playerEnabled !== false);
    if (e.cells && !e.fGate) { for (var c = 0; c < e.cells.length; c++) e.cells[c].gate = true; }
    if (e.type === 'inserter' && !e.fFilter) e.filter = e.playerFilter || null;
    if (e.type === 'turret' && !e.fFire) e.fireOk = true;
  });
  logicDirty = false;
}

/* ===================== 40_enemy.js ===================== */
// ===========================================================================
//  40_enemy.js — 둥지, 습격파, 전투, 터렛
//
//  적은 길찾기를 하지 않는다. 목표를 향해 직진하고 앞을 막은 건물을 물어뜯는다
//  (Factorio 의 실제 행동이기도 하다). 대신 원장의 교착 사례를 피하려고:
//   * 이동에도 탈출 타임아웃을 둔다 — 일정 시간 거리가 안 줄면 옆으로 비킨다.
//   * 비키는 방향은 개체마다 다르게 준다. 같은 방향이면 서로를 영원히 민다.
//   * 목표가 사라지면 즉시 재선정한다. 유령 목표를 붙들면 그 자리에 굳는다.
// ===========================================================================

var nests = [];
var enemies = [];
var corpses = [];          // 연출용 (FX_RNG 만 사용)
var evolution = 0;
var waveStats = { spawned: 0, killed: 0, buildingsLost: 0, lastWaveT: 0, waves: 0,
                  lost: [] };   // 최근 파괴 목록 {t,type,x,y} — 어디가 뚫렸는지 보려고

function spawnNests(seed) {
  nests.length = 0;
  var rng = makeRng(seed ^ 0x5eed);
  var cx = world.spawnX, cy = world.spawnY;
  for (var i = 0; i < 26; i++) {
    var ang = rng.next() * Math.PI * 2;
    var d = 34 + rng.next() * 42;
    var x = Math.round(cx + Math.cos(ang) * d);
    var y = Math.round(cy + Math.sin(ang) * d);
    if (!inBounds(x, y)) continue;
    if (world.oreAmt[idx(x, y)] > 0) continue;
    nests.push({ x: x, y: y, hp: 350, maxHp: 350, absorbed: 0, cool: rng.next() * 30, seed: (rng.next() * 1e9) | 0 });
    clearTrees(x - 1, y - 1, 3, 3);
  }
}

function nearestNestDist(tx, ty) {
  var best = 1e9;
  for (var i = 0; i < nests.length; i++) {
    var d = dist(nests[i].x, nests[i].y, tx, ty);
    if (d < best) best = d;
  }
  return best;
}

// --- 목표 선정 ---------------------------------------------------------------
// 적은 가장 가까운 플레이어 건물을 문다. 오염을 많이 내는 건물에 가중치를 준다.
function pickTarget(ex, ey) {
  var best = null, bestScore = 1e18;
  forEachEntity(function (e) {
    var d2 = dist2(e.tx + e.w * 0.5, e.ty + e.h * 0.5, ex, ey);
    var w = 1;
    if (e.type === 'generator' || e.type === 'miner') w = 0.6;   // 시끄러운 건물이 먼저 표적
    else if (e.type === 'wall') w = 1.4;                          // 벽은 굳이 먼저 물지 않는다
    var sc = d2 * w;
    if (sc < bestScore) { bestScore = sc; best = e; }
  });
  return best;
}

// (tx,ty) 타일을 점유한 플레이어 건물 — 적의 진로를 막는가
function blockerAt(tx, ty) {
  var id = occAt(tx, ty);
  if (id <= 0) return null;
  return entities[id] || null;
}

function spawnWave(nest, count) {
  var mix = tierMixFor(evolution);
  var rng = makeRng((nest.seed ^ (waveStats.waves * 7919)) >>> 0);
  for (var i = 0; i < count; i++) {
    var r = rng.next(), tier = 0, acc = 0;
    for (var t = 0; t < mix.length; t++) { acc += mix[t]; if (r <= acc) { tier = t; break; } }
    var spec = ENEMY_TIERS[tier];
    var ang = rng.next() * Math.PI * 2, rad = rng.next() * 2.2;
    enemies.push({
      x: nest.x + Math.cos(ang) * rad, y: nest.y + Math.sin(ang) * rad,
      hp: spec.hp, maxHp: spec.hp, tier: tier,
      target: null, atk: 0, stuckT: 0, lastD: 1e9,
      side: (i % 2) ? 1 : -1,          // 비키는 방향을 개체마다 다르게
      wob: rng.next() * 6.283
    });
    waveStats.spawned++;
  }
  waveStats.waves++;
  waveStats.lastWaveT = gameTime;
}

// 진화도 — Factorio 와 같은 점근 형태.
//   d(evo) = (시간항 + 오염항) × (1 - evo)²
// 선형 clamp 였을 때는 소형 공장도 30분에 62%, 대형 공장은 16분에 100%에 닿아
// 후반이 통째로 벽이 됐다(실측). 점근형은 100%에 영원히 닿지 않으므로 그 벽이 없다.
//   시간만으로 evo 0.5 → 2시간 (t = 1/k)
//   오염만으로 evo 0.5 → 누적 6000
var EVO_TIME_K = 1 / 7200;
var EVO_POLL_K = 1 / 6000;
var evoPrevPoll = 0;
var WAVE_GRACE = 300;      // 초반 5분은 습격 없음 (둥지는 그동안에도 오염을 모은다)
var POLL_PER_ENEMY = 8;    // 둥지가 흡수한 오염 이만큼당 적 1마리
function resetEvolution() { evolution = 0; evoPrevPoll = 0; }

function stepNests(dt) {
  var dPoll = world.totalPollution - evoPrevPoll;
  if (dPoll < 0) dPoll = 0;
  evoPrevPoll = world.totalPollution;
  var room = 1 - evolution;
  evolution = clamp(evolution + (EVO_TIME_K * dt + EVO_POLL_K * dPoll) * room * room, 0, 0.9999);
  for (var i = 0; i < nests.length; i++) {
    var n = nests[i];
    if (n.hp <= 0) continue;
    var px = (n.x / SPEC.pollutionPerChunk) | 0, py = (n.y / SPEC.pollutionPerChunk) | 0;
    if (px >= 0 && py >= 0 && px < PW && py < PH) {
      var pi = pidx(px, py);
      var take = Math.min(world.poll[pi], 0.9 * dt);
      world.poll[pi] -= take;
      n.absorbed += take;
    }
    n.cool -= dt;
    // 흡수한 오염 POLL_PER_ENEMY 당 적 1마리. 5마리 모이고 쿨다운이 끝나면 보낸다.
    // 나눗셈과 차감이 같은 상수를 봐야 한다 — 한쪽만 바꾸면 파도가 조용히 잦아진다.
    var ready = Math.floor(n.absorbed / POLL_PER_ENEMY);
    // 초반 유예 — 처음 5분은 습격이 없다. 이게 없으면 큰 공장을 빨리 세울수록
    // 2분 만에 두들겨 맞아서, 잘 지은 것이 벌이 된다 (측정에서 실제로 그랬다).
    // 둥지는 그동안에도 오염을 흡수하므로 유예가 끝나면 곧바로 몰려온다.
    if (gameTime < WAVE_GRACE) continue;
    if (ready >= 5 && n.cool <= 0) {
      // 후반에 실제로 무서워야 한다 — 진화 100%에서 한 둥지가 최대 30마리.
      var count = Math.min(ready, 4 + Math.floor(evolution * 26));
      n.absorbed -= count * POLL_PER_ENEMY;
      n.cool = 26 + 40 * (1 - evolution);
      spawnWave(n, count);
    }
  }
}

function stepEnemies(dt) {
  for (var i = enemies.length - 1; i >= 0; i--) {
    var en = enemies[i];
    if (en.hp <= 0) {
      corpses.push({ x: en.x, y: en.y, t: 0, tier: en.tier });
      enemies.splice(i, 1); waveStats.killed++;
      continue;
    }
    var spec = ENEMY_TIERS[en.tier];

    // 목표 재선정 — 유령 목표를 붙들지 않는다
    if (!en.target || !entities[en.target]) {
      var t = pickTarget(en.x, en.y);
      en.target = t ? t.id : null;
      en.lastD = 1e9; en.stuckT = 0;
      if (!en.target) {
        // 부술 게 없으면 스폰 지점 쪽으로 어슬렁 — 화면 밖에서 굳지 않게
        en.x += (world.spawnX - en.x) * 0.02 * dt;
        en.y += (world.spawnY - en.y) * 0.02 * dt;
        continue;
      }
    }
    var tgt = entities[en.target];
    var gx = tgt.tx + tgt.w * 0.5, gy = tgt.ty + tgt.h * 0.5;
    var d = dist(en.x, en.y, gx, gy);

    // 사거리 안이면 문다
    var reach = Math.max(tgt.w, tgt.h) * 0.5 + spec.r + 0.55;
    if (d <= reach) {
      en.atk += dt;
      en.stuckT = 0;
      if (en.atk >= 1) {
        en.atk = 0;
        tgt.hp -= spec.dmg;
        if (tgt.hp <= 0) {
          waveStats.buildingsLost++;
          // **무엇이 어디서 부서졌는지 말해 준다.** 예전에는 상단 [손실] 숫자만 올라서,
          // 공장 어딘가가 뜯기는 중인데 어디인지 알 방법이 없었다. 방어선 밖에 혼자
          // 나가 있는 채광기 하나가 계속 물리는 상황이 특히 안 보인다.
          waveStats.lost.push({ t: Math.round(gameTime), type: tgt.type, x: tgt.tx, y: tgt.ty });
          if (waveStats.lost.length > 40) waveStats.lost.shift();
          if (typeof toast === 'function') {
            toast(BUILDINGS[tgt.type].name + ' 파괴됨 (' + tgt.tx + ',' + tgt.ty + ')', 'bad');
          }
          removeEntity(tgt.id, false);
          en.target = null;
        }
      }
      continue;
    }

    // 이동 — 목표 방향, 다만 막힌 타일이 있으면 그것을 새 목표로 삼는다
    var ux = (gx - en.x) / d, uy = (gy - en.y) / d;
    var step = spec.speed * dt;
    var nx2 = en.x + ux * step, ny2 = en.y + uy * step;
    var bl = blockerAt(Math.floor(nx2), Math.floor(ny2));
    if (bl && bl.id !== tgt.id) { en.target = bl.id; en.lastD = 1e9; en.stuckT = 0; continue; }

    // 정체 감지 — 거리 개선이 없으면 진행방향에 수직으로 비킨다
    if (d < en.lastD - 0.02) { en.lastD = d; en.stuckT = 0; }
    else {
      en.stuckT += dt;
      if (en.stuckT > 1.2) {
        var px2 = -uy * en.side, py2 = ux * en.side;
        nx2 = en.x + px2 * step * 1.6;
        ny2 = en.y + py2 * step * 1.6;
        if (en.stuckT > 4) { en.target = null; en.stuckT = 0; }   // 그래도 안 되면 목표를 버린다
      }
    }
    en.x = clamp(nx2, 0.5, W - 1.5);
    en.y = clamp(ny2, 0.5, H - 1.5);
  }

  for (var c = corpses.length - 1; c >= 0; c--) {
    corpses[c].t += dt;
    if (corpses[c].t > 6) corpses.splice(c, 1);
  }
}

// --- 터렛 --------------------------------------------------------------------
var turretFx = [];       // { x1,y1,x2,y2,t } 총선 연출

function stepTurrets(dt) {
  for (var f = turretFx.length - 1; f >= 0; f--) {
    turretFx[f].t -= dt;
    if (turretFx[f].t <= 0) turretFx.splice(f, 1);
  }
  forEachEntity(function (e) {
    if (e.type !== 'turret') return;
    e.working = false;
    e.target = null;              // 죽은 적/철거된 둥지를 계속 조준하지 않게 매 틱 비운다
    if (!e.enabled || !e.fireOk || e.ammo <= 0) return;
    var cx = e.tx + 1, cy = e.ty + 1;
    // 가장 가까운 적
    var best = null, bd = SPEC.turretRange;
    for (var i = 0; i < enemies.length; i++) {
      // 이미 이 틱에 다른 터렛이 죽인 적은 건너뛴다. 시체는 다음 틱에 치워지므로
      // 이 검사가 없으면 터렛 14기가 15hp 소형 하나를 함께 쏴 13발을 버린다.
      if (enemies[i].hp <= 0) continue;
      var d = dist(enemies[i].x, enemies[i].y, cx, cy);
      if (d < bd) { bd = d; best = enemies[i]; }
    }
    // 둥지도 사거리 안이면 쏜다 — 터렛 크립으로 둥지를 밀 수 있게
    var bestNest = null;
    if (!best) {
      var nd = SPEC.turretRange;
      for (var k = 0; k < nests.length; k++) {
        if (nests[k].hp <= 0) continue;
        var d2 = dist(nests[k].x, nests[k].y, cx, cy);
        if (d2 < nd) { nd = d2; bestNest = nests[k]; }
      }
    }
    var victim = best || bestNest;
    if (!victim) return;

    e.working = true;
    e.shotT = (e.shotT || 0) + dt;
    var shots = 0;
    while (e.shotT >= 0.1 && e.ammo > 0) { e.shotT -= 0.1; e.ammo--; shots++; }
    if (shots > 0) {
      victim.hp -= shots * 5;
      turretFx.push({ x1: cx, y1: cy, x2: victim.x, y2: victim.y, t: 0.06 });
    }
    e.target = victim;
  });
  // 파괴된 둥지 정리
  for (var n = nests.length - 1; n >= 0; n--) if (nests[n].hp <= 0) nests.splice(n, 1);
}

function enemyThreatLevel() {
  var near = 0;
  for (var i = 0; i < enemies.length; i++) {
    if (dist(enemies[i].x, enemies[i].y, world.spawnX, world.spawnY) < 45) near++;
  }
  return near;
}

/* ===================== 45_render.js ===================== */
// ===========================================================================
//  45_render.js — Canvas2D 렌더러
//
//  좌표계: 캔버스 변환을 걸어 "타일 단위"로 그린다. 1 유닛 = 1 타일.
//  선 굵기·반지름도 전부 타일 단위라 확대해도 비율이 유지된다.
//  글자만 화면 좌표로 되돌려 그린다 (작은 폰트가 변환에서 깨지므로).
//
//  시각 문법은 레퍼런스 스크린샷(Factorio wiki)에서 읽은 것을 따른다:
//    · 벨트 = 어두운 트레드 띠 + 노란 셰브론, 아이템은 좌우 2레인에 실린다
//    · 인서터 = 피벗 원 + 뒤에서 앞으로 도는 팔, 끝에 아이템을 쥔다
//    · 기계 = 회색 금속 몸체 + 검은 외곽 + 노란 위험 줄무늬, 위에 레시피 아이콘
//    · 전주 = 기둥 + 전주끼리 늘어지는 구리색 현수선
//    · 광맥 = 땅에 흩뿌린 돌덩이, 매장량이 많을수록 촘촘
// ===========================================================================

var cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0 };
var cv = null, ctx = null;
var frameCount = 0;

var COL = {
  grass: ['#41522c', '#485a31', '#3b4a28', '#4e6136'],
  grassDot: 'rgba(255,255,255,0.045)',
  belt: '#35363a',
  beltEdge: '#212226',
  beltTread: '#4a4b50',
  chev: '#f0c419',
  metal: '#6d7278',
  metalDark: '#464a50',
  metalLite: '#8d949c',
  outline: '#1a1c20',
  hazardA: '#e2b21c',
  hazardB: '#26272b',
  glow: '#ff9a2e',
  wire: '#c8752b',
  steel: '#2f5f8f',
  amber: '#f0a92b',
  enemy: '#7a4fc0',
  nest: '#3d2650'
};

function hash2(x, y) {
  var h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function initRender(canvas) {
  cv = canvas;
  ctx = cv.getContext('2d', { alpha: false });
  resizeCanvas();
  cam.x = world.spawnX; cam.y = world.spawnY; cam.z = 1;
}
function resizeCanvas() {
  if (!cv) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = cv.clientWidth || 1280, h = cv.clientHeight || 720;
  cv.width = Math.max(2, Math.round(w * dpr));
  cv.height = Math.max(2, Math.round(h * dpr));
  cam.dpr = dpr;
}
function viewScale() { return TILE * cam.z * (cam.dpr || 1); }
function screenOf(wx, wy) {
  var s = viewScale();
  return { x: (wx - cam.x) * s + cv.width / 2, y: (wy - cam.y) * s + cv.height / 2 };
}
function worldOf(sx, sy) {
  var s = viewScale(), d = cam.dpr || 1;
  return { x: (sx * d - cv.width / 2) / s + cam.x, y: (sy * d - cv.height / 2) / s + cam.y };
}
function visibleBounds() {
  var s = viewScale();
  var halfW = cv.width / 2 / s, halfH = cv.height / 2 / s;
  return {
    x0: Math.max(0, Math.floor(cam.x - halfW) - 1), x1: Math.min(W - 1, Math.ceil(cam.x + halfW) + 1),
    y0: Math.max(0, Math.floor(cam.y - halfH) - 1), y1: Math.min(H - 1, Math.ceil(cam.y + halfH) + 1)
  };
}

// --- 기본 도형 (타일 단위) ---------------------------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function body(x, y, w, h, fill, edge) {
  ctx.fillStyle = fill; rr(x + 0.06, y + 0.06, w - 0.12, h - 0.12, 0.1); ctx.fill();
  ctx.lineWidth = 0.07; ctx.strokeStyle = edge || COL.outline; ctx.stroke();
  // 위쪽 하이라이트 — 금속 느낌
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fillRect(x + 0.12, y + 0.12, w - 0.24, 0.13);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(x + 0.12, y + h - 0.26, w - 0.24, 0.14);
}
// 노란 위험 줄무늬 띠 — 레퍼런스의 기계 테두리에 항상 있는 요소
function hazard(x, y, w, h) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  var step = 0.22;
  for (var i = -h; i < w + h; i += step * 2) {
    ctx.fillStyle = COL.hazardA;
    ctx.beginPath();
    ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + step, y + h);
    ctx.lineTo(x + i + step + h, y); ctx.lineTo(x + i + h, y);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x, y, w, h * 0.18);
  ctx.restore();
}
function shadowUnder(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  rr(x + 0.12, y + 0.22, w - 0.1, h - 0.05, 0.12); ctx.fill();
}

// --- 지형 --------------------------------------------------------------------
function drawTerrain(b) {
  for (var y = b.y0; y <= b.y1; y++) {
    for (var x = b.x0; x <= b.x1; x++) {
      var i = idx(x, y);
      ctx.fillStyle = COL.grass[world.terr[i]];
      ctx.fillRect(x, y, 1.02, 1.02);
    }
  }
  // 얼룩 — 같은 색 타일이 넓게 붙으면 격자가 그대로 보인다. 타일 해시로 결정하므로
  // 난수 상태를 건드리지 않고, 프레임마다 같은 자리에 찍힌다.
  for (var y3 = b.y0; y3 <= b.y1; y3++) {
    for (var x3 = b.x0; x3 <= b.x1; x3++) {
      var hb = hash2(x3 + 313, y3 + 977);
      if (hb < 0.62) continue;
      ctx.fillStyle = hb > 0.85 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.055)';
      var bx = x3 + hash2(x3 + 5, y3) * 0.4, by = y3 + hash2(x3, y3 + 5) * 0.4;
      ctx.beginPath();
      ctx.ellipse(bx + 0.3, by + 0.3, 0.36 + hb * 0.22, 0.26 + hb * 0.2, hb * 3, 0, 6.283);
      ctx.fill();
    }
  }
  // 잔디 반점
  ctx.fillStyle = COL.grassDot;
  for (var y2 = b.y0; y2 <= b.y1; y2++) {
    for (var x2 = b.x0; x2 <= b.x1; x2++) {
      var h1 = hash2(x2, y2), h2 = hash2(x2 + 91, y2 + 17);
      if (h1 > 0.55) ctx.fillRect(x2 + h1 * 0.8, y2 + h2 * 0.8, 0.09, 0.06);
      if (h2 > 0.72) ctx.fillRect(x2 + h2 * 0.7 + 0.1, y2 + h1 * 0.7, 0.07, 0.05);
      if (h1 > 0.80) {   // 풀포기
        ctx.strokeStyle = 'rgba(180,205,140,0.16)'; ctx.lineWidth = 0.03;
        var gx2 = x2 + h2 * 0.7 + 0.15, gy2 = y2 + h1 * 0.6 + 0.2;
        ctx.beginPath();
        ctx.moveTo(gx2, gy2); ctx.lineTo(gx2 - 0.06, gy2 - 0.16);
        ctx.moveTo(gx2, gy2); ctx.lineTo(gx2 + 0.07, gy2 - 0.14);
        ctx.stroke();
        ctx.fillStyle = COL.grassDot;
      }
    }
  }
}

function drawOre(b) {
  for (var y = b.y0; y <= b.y1; y++) {
    for (var x = b.x0; x <= b.x1; x++) {
      var i = idx(x, y);
      var amt = world.oreAmt[i];
      if (!amt) continue;
      var t = world.ore[i];
      var base = ORE_COLOR[t];
      var dens = clamp(amt / 3000, 0.18, 1);
      var n = 2 + Math.round(dens * 5);
      for (var k = 0; k < n; k++) {
        var hx = hash2(x * 7 + k, y * 13), hy = hash2(x * 3 + k * 5, y * 11 + k);
        var r = 0.09 + hash2(x + k, y - k) * 0.10;
        ctx.fillStyle = base;
        ctx.beginPath();
        ctx.arc(x + 0.12 + hx * 0.76, y + 0.12 + hy * 0.76, r, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath();
        ctx.arc(x + 0.10 + hx * 0.76, y + 0.09 + hy * 0.76, r * 0.42, 0, 6.283);
        ctx.fill();
      }
    }
  }
}

function drawTrees(b) {
  for (var y = b.y0; y <= b.y1; y++) {
    for (var x = b.x0; x <= b.x1; x++) {
      var v = world.tree[idx(x, y)];
      if (!v) continue;
      var hx = hash2(x, y) * 0.3, hy = hash2(y, x) * 0.3;
      var cx = x + 0.5 + hx - 0.15, cy = y + 0.5 + hy - 0.15;
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      ctx.beginPath(); ctx.ellipse(cx + 0.1, cy + 0.22, 0.38, 0.16, 0, 0, 6.283); ctx.fill();
      var tone = ['#28401f', '#2f4a24', '#22381b'][v - 1];
      ctx.fillStyle = tone;
      ctx.beginPath(); ctx.arc(cx, cy, 0.40, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.beginPath(); ctx.arc(cx - 0.12, cy - 0.14, 0.20, 0, 6.283); ctx.fill();
    }
  }
}

// --- 벨트 --------------------------------------------------------------------
var beltPhase = 0;
function drawBeltCell(c) {
  var x = c.tx, y = c.ty, d = c.dir;
  ctx.save();
  ctx.translate(x + 0.5, y + 0.5);
  ctx.rotate(d * Math.PI / 2);          // 0=북 기준으로 회전. 내부는 "위로 흐른다"고 그린다
  ctx.fillStyle = COL.beltEdge; ctx.fillRect(-0.5, -0.5, 1, 1);
  ctx.fillStyle = COL.belt; ctx.fillRect(-0.44, -0.5, 0.88, 1);
  // 트레드 — 흐르는 방향으로 움직인다
  ctx.fillStyle = COL.beltTread;
  var ph = (beltPhase * beltSpeed()) % 0.25;
  for (var t = -0.5 - 0.25; t < 0.5; t += 0.25) {
    var yy = t + (0.25 - ph);
    if (yy > 0.5 || yy < -0.5) continue;
    ctx.fillRect(-0.44, yy, 0.88, 0.05);
  }
  // 노란 셰브론
  ctx.fillStyle = c.gate ? COL.chev : '#7a5f12';
  var cph = (beltPhase * beltSpeed() * 1) % 0.5;
  for (var s = -0.5 - 0.5; s < 0.6; s += 0.5) {
    var cy2 = s + (0.5 - cph);
    if (cy2 > 0.46 || cy2 < -0.52) continue;
    ctx.beginPath();
    ctx.moveTo(-0.20, cy2 + 0.13); ctx.lineTo(0, cy2 - 0.05); ctx.lineTo(0.20, cy2 + 0.13);
    ctx.lineTo(0.20, cy2 + 0.20); ctx.lineTo(0, cy2 + 0.02); ctx.lineTo(-0.20, cy2 + 0.20);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 0.05;
  ctx.strokeRect(-0.46, -0.5, 0.92, 1);
  ctx.restore();
}

function drawItemShape(id, wx, wy, scale) {
  var it = ITEMS[id];
  if (!it) return;
  var s = (scale || 1) * 0.20;
  ctx.fillStyle = it.color;
  switch (it.shape) {
    case 'plate':
      ctx.fillRect(wx - s, wy - s * 0.72, s * 2, s * 1.44);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(wx - s, wy - s * 0.72, s * 2, s * 0.34);
      break;
    case 'rock':
      ctx.beginPath();
      ctx.moveTo(wx - s, wy); ctx.lineTo(wx - s * 0.4, wy - s);
      ctx.lineTo(wx + s * 0.7, wy - s * 0.6); ctx.lineTo(wx + s, wy + s * 0.4);
      ctx.lineTo(wx - s * 0.2, wy + s); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.arc(wx - s * 0.25, wy - s * 0.3, s * 0.35, 0, 6.283); ctx.fill();
      break;
    case 'gear':
      ctx.beginPath(); ctx.arc(wx, wy, s, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#2a2d31';
      ctx.beginPath(); ctx.arc(wx, wy, s * 0.36, 0, 6.283); ctx.fill();
      ctx.fillStyle = it.color;
      for (var g = 0; g < 6; g++) {
        var a = g * 1.047;
        ctx.fillRect(wx + Math.cos(a) * s * 0.95 - s * 0.16, wy + Math.sin(a) * s * 0.95 - s * 0.16, s * 0.32, s * 0.32);
      }
      break;
    case 'wire':
      ctx.lineWidth = s * 0.45; ctx.strokeStyle = it.color;
      ctx.beginPath();
      ctx.moveTo(wx - s, wy + s * 0.5);
      ctx.quadraticCurveTo(wx, wy - s * 1.1, wx + s, wy + s * 0.5);
      ctx.stroke();
      break;
    case 'chip':
      ctx.fillRect(wx - s * 0.9, wy - s * 0.7, s * 1.8, s * 1.4);
      ctx.fillStyle = '#d9c15a';
      for (var p = -1; p <= 1; p++) ctx.fillRect(wx - s * 0.9 + (p + 1) * s * 0.6, wy - s * 1.0, s * 0.22, s * 0.3);
      break;
    case 'ammo':
      ctx.fillRect(wx - s * 0.55, wy - s, s * 1.1, s * 2);
      ctx.fillStyle = '#e8c14a';
      ctx.fillRect(wx - s * 0.55, wy + s * 0.3, s * 1.1, s * 0.7);
      break;
    case 'flask':
      ctx.beginPath();
      ctx.moveTo(wx - s * 0.35, wy - s); ctx.lineTo(wx + s * 0.35, wy - s);
      ctx.lineTo(wx + s * 0.8, wy + s); ctx.lineTo(wx - s * 0.8, wy + s);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(wx - s * 0.35, wy - s * 1.15, s * 0.7, s * 0.25);
      break;
    default:
      ctx.beginPath(); ctx.arc(wx, wy, s, 0, 6.283); ctx.fill();
  }
}

function drawBeltItems(c) {
  var d = c.dir;
  var fx = DIR_DX[d], fy = DIR_DY[d];
  var lv = [dirCCW(d), dirCW(d)];        // lane0 = 왼쪽, lane1 = 오른쪽
  for (var li = 0; li < 2; li++) {
    var ox = DIR_DX[lv[li]] * 0.25, oy = DIR_DY[lv[li]] * 0.25;
    var lane = c.lanes[li];
    for (var i = 0; i < lane.length; i++) {
      var p = lane[i].pos;
      var wx = c.tx + 0.5 + fx * (p - 0.5) + ox;
      var wy = c.ty + 0.5 + fy * (p - 0.5) + oy;
      drawItemShape(lane[i].id, wx, wy, 1);
    }
  }
}

// --- 건물 --------------------------------------------------------------------
function drawArrow(x, y, w, h, d, col) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(d * Math.PI / 2);
  ctx.fillStyle = col || COL.chev;
  ctx.beginPath();
  ctx.moveTo(0, -h / 2 + 0.10); ctx.lineTo(0.17, -h / 2 + 0.32); ctx.lineTo(-0.17, -h / 2 + 0.32);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEntity(e) {
  var x = e.tx, y = e.ty, w = e.w, h = e.h;
  switch (e.type) {
    case 'belt': case 'splitter': return;   // 벨트는 따로 그린다
    case 'inserter': drawInserter(e); return;
    case 'pole': drawPole(e); return;
    case 'wall': {
      ctx.fillStyle = '#7a6a58'; ctx.fillRect(x + 0.02, y + 0.02, 0.96, 0.96);
      ctx.fillStyle = '#95836d'; ctx.fillRect(x + 0.08, y + 0.08, 0.84, 0.36);
      ctx.fillStyle = '#5d5044'; ctx.fillRect(x + 0.08, y + 0.52, 0.84, 0.36);
      ctx.strokeStyle = COL.outline; ctx.lineWidth = 0.05;
      ctx.strokeRect(x + 0.02, y + 0.02, 0.96, 0.96);
      return;
    }
  }
  shadowUnder(x, y, w, h);

  if (e.type === 'miner') {
    body(x, y, w, h, COL.metal);
    hazard(x + 0.14, y + 0.14, w - 0.28, 0.22);
    ctx.fillStyle = COL.metalDark;
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2 + 0.08, 0.44, 0, 6.283); ctx.fill();
    // 회전 드릴
    var a = e.anim * 4;
    ctx.save(); ctx.translate(x + w / 2, y + h / 2 + 0.08); ctx.rotate(a);
    ctx.fillStyle = COL.metalLite;
    for (var k = 0; k < 3; k++) {
      ctx.save(); ctx.rotate(k * 2.094);
      ctx.fillRect(-0.06, -0.40, 0.12, 0.40);
      ctx.restore();
    }
    ctx.restore();
    drawArrow(x, y, w, h, e.dir);
    if (e.depleted) drawWarn(x, y, w, '광맥 고갈');
  } else if (e.type === 'furnace') {
    body(x, y, w, h, '#6a6560');
    ctx.fillStyle = '#3a352f'; ctx.fillRect(x + 0.28, y + h - 0.72, w - 0.56, 0.5);
    var glow = e.working ? 1 : 0.15;
    var gr = ctx.createRadialGradient(x + w / 2, y + h - 0.47, 0.02, x + w / 2, y + h - 0.47, 0.55);
    gr.addColorStop(0, 'rgba(255,190,80,' + (0.95 * glow) + ')');
    gr.addColorStop(1, 'rgba(255,90,10,0)');
    ctx.fillStyle = gr; ctx.fillRect(x + 0.1, y + h - 1.0, w - 0.2, 0.9);
    hazard(x + 0.16, y + 0.16, w - 0.32, 0.2);
  } else if (e.type === 'assembler') {
    body(x, y, w, h, COL.metal);
    hazard(x + 0.16, y + 0.16, w - 0.32, 0.22);
    ctx.fillStyle = COL.metalDark;
    rr(x + 0.5, y + 0.7, w - 1.0, h - 1.2, 0.12); ctx.fill();
    var ang = e.working ? e.anim * 3 : 0;
    ctx.save(); ctx.translate(x + w / 2, y + h / 2 + 0.1); ctx.rotate(ang);
    ctx.strokeStyle = COL.metalLite; ctx.lineWidth = 0.14;
    ctx.beginPath(); ctx.arc(0, 0, 0.42, 0, 6.283); ctx.stroke();
    for (var g2 = 0; g2 < 8; g2++) {
      var aa = g2 * 0.785;
      ctx.fillStyle = COL.metalLite;
      ctx.fillRect(Math.cos(aa) * 0.52 - 0.07, Math.sin(aa) * 0.52 - 0.07, 0.14, 0.14);
    }
    ctx.restore();
  } else if (e.type === 'generator') {
    body(x, y, w, h, '#5f6a72');
    hazard(x + 0.16, y + 0.16, w - 0.32, 0.2);
    // 플라이휠
    ctx.save(); ctx.translate(x + w / 2, y + h / 2 + 0.15);
    ctx.rotate(e.anim * (e.working ? 9 : 0));
    ctx.strokeStyle = '#8d949c'; ctx.lineWidth = 0.16;
    ctx.beginPath(); ctx.arc(0, 0, 0.62, 0, 6.283); ctx.stroke();
    ctx.lineWidth = 0.1;
    for (var s2 = 0; s2 < 4; s2++) {
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(s2 * 1.5708) * 0.62, Math.sin(s2 * 1.5708) * 0.62); ctx.stroke();
    }
    ctx.restore();
    // 연료 게이지
    var ff = clamp(e.fuel / (SPEC.coalEnergy * 20), 0, 1);
    ctx.fillStyle = '#20232a'; ctx.fillRect(x + 0.3, y + h - 0.42, w - 0.6, 0.2);
    ctx.fillStyle = ff > 0.15 ? COL.amber : '#c0392b';
    ctx.fillRect(x + 0.32, y + h - 0.40, (w - 0.64) * ff, 0.16);
    if (e.fuel <= 0) drawWarn(x, y, w, '연료 없음');
  } else if (e.type === 'chest') {
    ctx.fillStyle = '#8a6a3d'; rr(x + 0.08, y + 0.12, 0.84, 0.78, 0.08); ctx.fill();
    ctx.strokeStyle = COL.outline; ctx.lineWidth = 0.06; ctx.stroke();
    ctx.fillStyle = '#a8834e'; ctx.fillRect(x + 0.12, y + 0.16, 0.76, 0.26);
    ctx.fillStyle = '#5c4426'; ctx.fillRect(x + 0.12, y + 0.46, 0.76, 0.09);
    var tot = invTotal(e.inv);
    if (tot > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x + 0.1, y + 0.66, 0.8, 0.2);
      ctx.fillStyle = COL.amber;
      ctx.fillRect(x + 0.12, y + 0.68, 0.76 * clamp(tot / SPEC.chestCap, 0, 1), 0.16);
    }
  } else if (e.type === 'lab') {
    body(x, y, w, h, '#5a6470');
    for (var fl = 0; fl < 3; fl++) {
      var fx2 = x + 0.6 + fl * 0.9, fy2 = y + h - 1.0;
      ctx.fillStyle = fl === 0 ? '#e0483c' : (fl === 1 ? '#49c05a' : '#3a4250');
      ctx.beginPath();
      ctx.moveTo(fx2 - 0.2, fy2); ctx.lineTo(fx2 + 0.2, fy2);
      ctx.lineTo(fx2 + 0.3, fy2 + 0.55); ctx.lineTo(fx2 - 0.3, fy2 + 0.55);
      ctx.closePath(); ctx.fill();
      if (e.working) {
        var bub = (e.anim * 2 + fl * 0.4) % 1;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.arc(fx2, fy2 + 0.5 - bub * 0.45, 0.06, 0, 6.283); ctx.fill();
      }
    }
    hazard(x + 0.16, y + 0.16, w - 0.32, 0.2);
  } else if (e.type === 'controller') {
    body(x, y, w, h, '#2a3340', '#101418');
    // 화면
    ctx.fillStyle = '#0d1a12'; rr(x + 0.22, y + 0.26, w - 0.44, h - 0.7, 0.06); ctx.fill();
    var on = e.enabled && e.powerSat > 0;
    ctx.strokeStyle = on ? '#49c05a' : '#3a4a3a'; ctx.lineWidth = 0.05;
    // 노드 그래프 글리프 — 화면 안에 작은 회로가 돈다
    var g = e.graph;
    var nn = g ? Math.min(5, g.nodes.length) : 0;
    for (var i2 = 0; i2 < nn; i2++) {
      var px = x + 0.36 + (i2 % 3) * 0.52;
      var py = y + 0.46 + Math.floor(i2 / 3) * 0.46;
      ctx.beginPath(); ctx.arc(px, py, 0.09, 0, 6.283); ctx.stroke();
      if (i2 > 0) {
        ctx.beginPath();
        ctx.moveTo(x + 0.36 + ((i2 - 1) % 3) * 0.52, y + 0.46 + Math.floor((i2 - 1) / 3) * 0.46);
        ctx.lineTo(px, py); ctx.stroke();
      }
    }
    if (on) {
      var blink = 0.5 + 0.5 * Math.sin(e.anim * 6);
      ctx.fillStyle = 'rgba(73,192,90,' + (0.15 + 0.25 * blink) + ')';
      rr(x + 0.22, y + 0.26, w - 0.44, h - 0.7, 0.06); ctx.fill();
    }
    ctx.fillStyle = COL.steel; ctx.fillRect(x + 0.22, y + h - 0.38, w - 0.44, 0.16);
  } else if (e.type === 'turret') {
    body(x, y, w, h, '#5d6470');
    ctx.fillStyle = COL.metalDark;
    ctx.beginPath(); ctx.arc(x + 1, y + 1, 0.5, 0, 6.283); ctx.fill();
    var ta = e.turretAng || 0;
    if (e.target) ta = Math.atan2(e.target.y - (y + 1), e.target.x - (x + 1));
    e.turretAng = ta;
    ctx.save(); ctx.translate(x + 1, y + 1); ctx.rotate(ta);
    ctx.fillStyle = '#3c4148'; ctx.fillRect(0, -0.11, 0.92, 0.22);
    ctx.fillStyle = COL.metalLite; ctx.fillRect(0.6, -0.07, 0.34, 0.14);
    ctx.restore();
    // 탄약 표시
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x + 0.25, y + h - 0.34, w - 0.5, 0.18);
    ctx.fillStyle = e.ammo > 0 ? '#c94f3d' : '#444';
    ctx.fillRect(x + 0.27, y + h - 0.32, (w - 0.54) * clamp(e.ammo / 200, 0, 1), 0.14);
    if (e.ammo <= 0) drawWarn(x, y, w, '탄약 없음');
    if (!e.fireOk) drawWarn(x, y, w, '사격 금지');
  }

  // 레시피 배지 — 레퍼런스에서 조립기 위에 떠 있는 산출물 아이콘. 눈으로 라인을 읽는
  // 가장 빠른 단서라 기능적으로도 값이 크다.
  if (e.type === 'assembler' || e.type === 'furnace') {
    var rid = e.recipe;
    if (rid && RECIPES[rid]) {
      var outId = Object.keys(RECIPES[rid].out)[0];
      var bx2 = x + w / 2, by2 = y - 0.02;
      ctx.fillStyle = 'rgba(18,22,27,0.88)';
      rr(bx2 - 0.30, by2 - 0.58, 0.60, 0.60, 0.10); ctx.fill();
      ctx.strokeStyle = 'rgba(240,169,43,0.75)'; ctx.lineWidth = 0.045; ctx.stroke();
      drawItemShape(outId, bx2, by2 - 0.28, 1.25);
      // 진행 막대
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(bx2 - 0.26, by2 - 0.10, 0.52, 0.07);
      ctx.fillStyle = COL.chev;
      ctx.fillRect(bx2 - 0.26, by2 - 0.10, 0.52 * clamp(e.progress || 0, 0, 1), 0.07);
    }
  } else if (e.type === 'lab' && currentResearch) {
    var need = Object.keys(TECHS[currentResearch].cost);
    var lx = x + w / 2 - (need.length - 1) * 0.32;
    for (var li2 = 0; li2 < need.length; li2++) {
      ctx.fillStyle = 'rgba(18,22,27,0.88)';
      rr(lx + li2 * 0.64 - 0.26, y - 0.60, 0.52, 0.52, 0.09); ctx.fill();
      ctx.strokeStyle = invCount(e.inv, need[li2]) > 0 ? 'rgba(73,192,90,0.8)' : 'rgba(217,84,74,0.8)';
      ctx.lineWidth = 0.045; ctx.stroke();
      drawItemShape(need[li2], lx + li2 * 0.64, y - 0.34, 1.1);
    }
  }

  // 전력 없음 표시 — 모든 전기 기계 공통
  var B = BUILDINGS[e.type];
  if (B && B.power && e.powerSat <= 0 && e.enabled) drawWarn(x, y, w, '전력 없음');
  if (!e.enabled) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = e.logicForced ? '#49c05a' : '#c0392b'; ctx.lineWidth = 0.08;
    ctx.strokeRect(x + 0.08, y + 0.08, w - 0.16, h - 0.16);
  }
  // 제어기 지배 표시 — 초록 점선 테두리
  if (e.logicForced && e.enabled) {
    ctx.save();
    ctx.setLineDash([0.16, 0.12]);
    ctx.strokeStyle = 'rgba(73,192,90,0.85)'; ctx.lineWidth = 0.07;
    ctx.strokeRect(x + 0.06, y + 0.06, w - 0.12, h - 0.12);
    ctx.restore();
  }
  // 체력 바
  if (e.hp < e.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x + 0.1, y - 0.22, w - 0.2, 0.16);
    ctx.fillStyle = '#d94f3d';
    ctx.fillRect(x + 0.12, y - 0.20, (w - 0.24) * clamp(e.hp / e.maxHp, 0, 1), 0.12);
  }
}

var warnList = [];
function drawWarn(x, y, w, msg) {
  warnList.push({ x: x + w / 2, y: y - 0.35, msg: msg });
}

function drawInserter(e) {
  var x = e.tx, y = e.ty;
  ctx.fillStyle = '#3b4048';
  rr(x + 0.14, y + 0.14, 0.72, 0.72, 0.1); ctx.fill();
  ctx.strokeStyle = COL.outline; ctx.lineWidth = 0.05; ctx.stroke();
  ctx.fillStyle = e.enabled ? (e.filter ? '#4fae5a' : COL.chev) : '#803a34';
  ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 0.14, 0, 6.283); ctx.fill();

  // 팔 각도: phase 0 = 뒤(−) → 앞(+). 총 회전 180도.
  var frac = e.phase === 0 ? (1 - e.t) * 0.5 : 0.5 + e.t * 0.5;
  var baseA = e.dir * Math.PI / 2 - Math.PI / 2;   // dir 0(북) → 위쪽이 0도
  var ang = baseA + Math.PI + frac * Math.PI;
  var ax = x + 0.5 + Math.cos(ang) * 0.62, ay = y + 0.5 + Math.sin(ang) * 0.62;
  ctx.strokeStyle = '#9aa2ab'; ctx.lineWidth = 0.11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 0.5, y + 0.5); ctx.lineTo(ax, ay); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#c3cad2';
  ctx.beginPath(); ctx.arc(ax, ay, 0.11, 0, 6.283); ctx.fill();
  if (e.held) drawItemShape(e.held, ax, ay, 0.9);
}

function drawPole(e) {
  var x = e.tx, y = e.ty;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x + 0.58, y + 0.72, 0.22, 0.10, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#6b563c'; ctx.fillRect(x + 0.42, y + 0.16, 0.16, 0.58);
  ctx.fillStyle = '#8a7150'; ctx.fillRect(x + 0.24, y + 0.18, 0.52, 0.10);
  ctx.fillStyle = e.net >= 0 ? '#49c05a' : '#803a34';
  ctx.beginPath(); ctx.arc(x + 0.5, y + 0.13, 0.07, 0, 6.283); ctx.fill();
}

// 전주끼리 늘어지는 현수선 — 레퍼런스의 주황 전선.
// 그릴 간선은 전력망 재구축 때 최소신장트리로 정해 둔다(30_power.js). 매 프레임
// 모든 쌍을 다시 재면 O(n²)일 뿐 아니라 화면이 그물이 된다.
function drawWires() {
  if (!wireEdges.length) return;
  ctx.strokeStyle = COL.wire; ctx.lineWidth = 0.05;
  ctx.globalAlpha = 0.85;
  for (var i = 0; i < wireEdges.length; i++) {
    var w = wireEdges[i];
    var x1 = w[0] + 0.5, y1 = w[1] + 0.2;
    var x2 = w[2] + 0.5, y2 = w[3] + 0.2;
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + 0.30;   // 늘어짐
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// --- 적 ----------------------------------------------------------------------
function drawEnemies(b) {
  for (var i = 0; i < corpses.length; i++) {
    var c = corpses[i];
    ctx.fillStyle = 'rgba(60,30,80,' + clamp(1 - c.t / 6, 0, 0.5) + ')';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 0.4, 0.24, 0, 0, 6.283); ctx.fill();
  }
  for (var k = 0; k < enemies.length; k++) {
    var e = enemies[k];
    if (e.x < b.x0 - 2 || e.x > b.x1 + 2 || e.y < b.y0 - 2 || e.y > b.y1 + 2) continue;
    var spec = ENEMY_TIERS[e.tier];
    var wob = Math.sin(gameTime * 9 + e.wob) * 0.06;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + spec.r * 0.7, spec.r * 1.1, spec.r * 0.45, 0, 0, 6.283); ctx.fill();
    // 다리
    ctx.strokeStyle = '#2c1c40'; ctx.lineWidth = spec.r * 0.22;
    for (var l = -1; l <= 1; l += 2) {
      for (var j = 0; j < 3; j++) {
        var ly = e.y - spec.r * 0.4 + j * spec.r * 0.42;
        ctx.beginPath(); ctx.moveTo(e.x, ly);
        ctx.lineTo(e.x + l * spec.r * 1.25, ly + wob * l * (j - 1)); ctx.stroke();
      }
    }
    ctx.fillStyle = spec.color;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, spec.r * 1.1, spec.r * 0.85, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#d9c25a';
    ctx.beginPath(); ctx.arc(e.x - spec.r * 0.3, e.y - spec.r * 0.35, spec.r * 0.16, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x + spec.r * 0.3, e.y - spec.r * 0.35, spec.r * 0.16, 0, 6.283); ctx.fill();
    if (e.hp < e.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - 0.4, e.y - spec.r - 0.34, 0.8, 0.12);
      ctx.fillStyle = '#e05a4a';
      ctx.fillRect(e.x - 0.39, e.y - spec.r - 0.33, 0.78 * clamp(e.hp / e.maxHp, 0, 1), 0.10);
    }
  }
  for (var f = 0; f < turretFx.length; f++) {
    var t = turretFx[f];
    ctx.strokeStyle = 'rgba(255,230,140,0.9)'; ctx.lineWidth = 0.07;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }
}

function drawNests(b) {
  for (var i = 0; i < nests.length; i++) {
    var n = nests[i];
    if (n.x < b.x0 - 3 || n.x > b.x1 + 3 || n.y < b.y0 - 3 || n.y > b.y1 + 3) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(n.x, n.y + 0.4, 1.5, 0.7, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = COL.nest;
    ctx.beginPath(); ctx.ellipse(n.x, n.y, 1.4, 1.05, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#54346e';
    for (var s = 0; s < 7; s++) {
      var a = s * 0.897 + 0.3;
      ctx.beginPath();
      ctx.moveTo(n.x + Math.cos(a) * 0.9, n.y + Math.sin(a) * 0.65);
      ctx.lineTo(n.x + Math.cos(a) * 1.5, n.y + Math.sin(a) * 1.1 - 0.35);
      ctx.lineTo(n.x + Math.cos(a + 0.3) * 0.9, n.y + Math.sin(a + 0.3) * 0.65);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#1a0f24';
    ctx.beginPath(); ctx.ellipse(n.x, n.y + 0.1, 0.45, 0.3, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(n.x - 0.8, n.y - 1.5, 1.6, 0.16);
    ctx.fillStyle = '#b05aa8';
    ctx.fillRect(n.x - 0.78, n.y - 1.48, 1.56 * clamp(n.hp / n.maxHp, 0, 1), 0.12);
  }
}

// --- 오염 오버레이 -----------------------------------------------------------
var showPollution = true;
function drawPollution(b) {
  if (!showPollution) return;
  var C = SPEC.pollutionPerChunk;
  var px0 = Math.max(0, (b.x0 / C) | 0), px1 = Math.min(PW - 1, (b.x1 / C) | 0);
  var py0 = Math.max(0, (b.y0 / C) | 0), py1 = Math.min(PH - 1, (b.y1 / C) | 0);
  for (var py = py0; py <= py1; py++) {
    for (var px = px0; px <= px1; px++) {
      var v = world.poll[pidx(px, py)];
      if (v <= 0.02) continue;
      // 사각 블록이 그대로 보이면 화면을 통째로 덮는다 — 옅게 깔고 중심으로 갈수록 진하게.
      var a = clamp(v * 0.045, 0, 0.16);
      var gx = px * C + C / 2, gy = py * C + C / 2;
      var gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, C * 0.78);
      gr.addColorStop(0, 'rgba(158,64,30,' + a + ')');
      gr.addColorStop(1, 'rgba(158,64,30,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(px * C - C * 0.3, py * C - C * 0.3, C * 1.6, C * 1.6);
    }
  }
}

// --- 메인 --------------------------------------------------------------------
function render() {
  if (!ctx) return;
  frameCount++;
  warnList.length = 0;
  var s = viewScale();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a1e17';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(s, 0, 0, s, cv.width / 2 - cam.x * s, cv.height / 2 - cam.y * s);

  var b = visibleBounds();
  drawTerrain(b);
  drawOre(b);
  drawPollution(b);
  drawTrees(b);
  drawNests(b);

  // 벨트 → 벨트 아이템 → 나머지 건물 순서 (아이템이 기계 밑으로 안 들어가게)
  forEachEntity(function (e) {
    if (!e.cells) return;
    if (e.tx < b.x0 - 3 || e.tx > b.x1 + 3 || e.ty < b.y0 - 3 || e.ty > b.y1 + 3) return;
    for (var c = 0; c < e.cells.length; c++) drawBeltCell(e.cells[c]);
  });
  forEachEntity(function (e) {
    if (!e.cells) return;
    if (e.tx < b.x0 - 3 || e.tx > b.x1 + 3 || e.ty < b.y0 - 3 || e.ty > b.y1 + 3) return;
    for (var c = 0; c < e.cells.length; c++) drawBeltItems(e.cells[c]);
  });
  drawWires();
  forEachEntity(function (e) {
    if (e.cells) return;
    if (e.tx < b.x0 - 4 || e.tx > b.x1 + 4 || e.ty < b.y0 - 4 || e.ty > b.y1 + 4) return;
    guard('draw:' + e.type, function () { drawEntity(e); });
  });
  drawEnemies(b);

  if (typeof drawOverlays === 'function') guard('overlays', drawOverlays);

  // 경고 글자 — 화면 좌표로 되돌려 그린다
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  var dpr = cam.dpr || 1;
  ctx.font = (11 * dpr) + 'px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'center';
  for (var i = 0; i < warnList.length; i++) {
    var p = screenOf(warnList[i].x, warnList[i].y);
    if (p.x < 0 || p.y < 0 || p.x > cv.width || p.y > cv.height) continue;
    var tw = ctx.measureText(warnList[i].msg).width;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(p.x - tw / 2 - 4 * dpr, p.y - 11 * dpr, tw + 8 * dpr, 15 * dpr);
    ctx.fillStyle = '#f0a92b';
    ctx.fillText(warnList[i].msg, p.x, p.y + dpr);
  }
  ctx.textAlign = 'left';
}

// 프레임버퍼 직독 — "렌더 예외 0" 과 "화면에 뭔가 그려짐" 은 별개의 사실이다.
// 검증 하네스가 이 함수로 빈 화면을 잡는다.
window.__PIXEL_PROBE = function (w, h) {
  if (!ctx) return null;
  var ww = w || 64, hh = h || 64;
  var x0 = Math.max(0, ((cv.width - ww) / 2) | 0), y0 = Math.max(0, ((cv.height - hh) / 2) | 0);
  var d = ctx.getImageData(x0, y0, Math.min(ww, cv.width), Math.min(hh, cv.height)).data;
  var set = {}, n = 0;
  for (var i = 0; i < d.length; i += 4) {
    var key = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
    if (!set[key]) { set[key] = 1; n++; }
  }
  return { uniqueRGB: n, sample: [d[0], d[1], d[2], d[3]], size: [ww, hh] };
};

/* ===================== 50_ui.js ===================== */
// ===========================================================================
//  50_ui.js — 창고/연구/손조립, 건설 도구, 입력, HUD 패널, 미니맵, 인스펙터
// ===========================================================================

var inventory = {};
var techDone = {};
var currentResearch = null;
var researchProgress = 0;
// **연구를 갈아타도 먹인 연구팩은 남는다.** 예전에는 갈아타는 순간 진행이 0 이 됐다 —
// 49/50 까지 간 연구를 놔두고 다른 걸 누르면 적팩 49 + 녹팩 49 가 경고 한 줄 없이
// 사라졌다. 클릭 한 번에 되돌릴 수 없는 손실이 나는 자리는 게임에 있으면 안 된다.
// 연구별로 따로 세어 두면 갈아탔다 돌아와도 이어서 한다.
var researchProgressBy = {};

function researchFrac() {
  if (!currentResearch) return 0;
  return clamp(researchProgress / techCycles(currentResearch), 0, 1);
}
function addResearchProgress(n) {
  if (!currentResearch) return;
  researchProgress += n;
  if (researchProgress >= techCycles(currentResearch)) finishResearch();
}
function techAvailable(tid) {
  // **모르는 id 를 그냥 터뜨리면 안 된다.** 저장본이 손상됐거나 예전 판의 연구
  // id 가 남아 있으면 여기서 TypeError 가 나 게임이 통째로 멈춘다.
  if (!tid || !TECHS[tid]) return false;
  if (techDone[tid]) return false;
  var need = TECHS[tid].needs;
  for (var i = 0; i < need.length; i++) if (!techDone[need[i]]) return false;
  return true;
}
function startResearch(tid) {
  if (!techAvailable(tid)) return false;
  if (currentResearch) researchProgressBy[currentResearch] = researchProgress;   // 하던 것 보관
  currentResearch = tid;
  researchProgress = researchProgressBy[tid] || 0;                              // 하던 데서 이어간다
  markPowerDirty();
  toast('연구 시작: ' + TECHS[tid].name +
        (researchProgress > 0 ? ' (' + Math.round(researchProgress) + '개까지 이어서)' : ''), 'good');
  renderTech();
  return true;
}
function finishResearch() {
  var tid = currentResearch;
  if (!tid) return;
  techDone[tid] = true;
  delete researchProgressBy[tid];
  currentResearch = null; researchProgress = 0;
  if (tid === 'belt-2') beltSpeedMul = 2;
  if (tid === 'automation-2') { machineSpeedMul = 1.5; machinePowerMul = 0.8; }
  toast('연구 완료: ' + TECHS[tid].name + ' — ' + TECHS[tid].unlock.join(', '), 'good');
  markPowerDirty(); markLogicDirty();
  renderBuildList(); renderTech(); renderCraftList();
  if (logicOpen) renderPalette();
}

// --- 손 조립 -----------------------------------------------------------------
function canHandCraft(rid) {
  var r = RECIPES[rid];
  if (!r || !r.handOk) return false;
  if (r.tech && !techDone[r.tech]) return false;
  for (var k in r.inp) if ((inventory[k] || 0) < r.inp[k]) return false;
  return true;
}
// **손 조립에는 시간이 든다.** 예전에는 클릭 한 번에 즉시 완성이었다 — 조립기가
// 같은 것을 6.67초에 하나 만드는 동안 손으로는 초당 몇 개든 나왔고, 그러면
// "자동화할 이유"가 게임에서 사라진다. 이 장르의 전제 자체가 무너지는 자리다.
// 규약(Factorio 와 같다): 재료는 대기열에 넣는 즉시 빠지고, 완성품은 시간이 지나야
// 나온다. 대기열은 하나씩 순서대로 처리하므로 손은 언제나 "조립기 1대"가 최대다.
// 여러 대로 늘리려면 진짜 기계를 세워야 한다.
var handQueue = [];              // [{ rid, left }] — [0] 이 지금 만드는 것
var HAND_QUEUE_MAX = 100;
var handCraftCount = 0;          // **완성** 개수 (대기열에 넣은 수가 아니다)

function handCraft(rid) {
  if (!canHandCraft(rid)) { toast('재료가 부족하다', 'bad'); return false; }
  if (handQueue.length >= HAND_QUEUE_MAX) { toast('조립 대기열이 가득 찼다', 'bad'); return false; }
  var r = RECIPES[rid];
  for (var k in r.inp) inventory[k] -= r.inp[k];
  handQueue.push({ rid: rid, left: r.time });
  return true;
}
// 취소하면 재료를 돌려준다 — 안 그러면 잘못 누른 클릭이 아이템 소각이 된다
function handCancel(i) {
  if (i < 0 || i >= handQueue.length) return false;
  var job = handQueue.splice(i, 1)[0], r = RECIPES[job.rid];
  for (var k in r.inp) inventory[k] = (inventory[k] || 0) + r.inp[k];
  return true;
}
function stepHandCraft(dt) {
  var guard = 0;
  while (handQueue.length > 0 && dt > 1e-9 && guard++ < 2000) {
    var job = handQueue[0];
    var use = Math.min(dt, job.left);
    job.left -= use; dt -= use;
    if (job.left > 1e-9) break;
    handQueue.shift();
    var r = RECIPES[job.rid];
    for (var o in r.out) inventory[o] = (inventory[o] || 0) + r.out[o];
    handCraftCount++;
    prodStats.byRecipe[job.rid] = (prodStats.byRecipe[job.rid] || 0) + 1;
  }
}

// --- 토스트 ------------------------------------------------------------------
function toast(msg, kind) {
  var host = document.getElementById('toast');
  if (!host) return;
  var d = document.createElement('div');
  d.className = 'tmsg' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  host.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3600);
  while (host.children.length > 5) host.removeChild(host.firstChild);
}

// --- 건설 도구 ---------------------------------------------------------------
var tool = null;          // 건물 type
var toolDir = 1;          // 동쪽
var hoverT = { x: -1, y: -1 };
var selected = null;      // 선택된 엔티티 id
var pickMode = null;      // 제어기 노드가 지도에서 대상을 고르는 중

function selectTool(t) {
  if (t && BUILDINGS[t].tech && !techDone[BUILDINGS[t].tech]) {
    toast(TECHS[BUILDINGS[t].tech].name + ' 연구가 필요하다', 'bad'); return;
  }
  tool = t; selected = null; hideInsp();
  renderBuildList();
}

function tryPlace(tx, ty) {
  if (!tool) return false;
  var e = placeEntity(tool, tx, ty, toolDir, false);
  if (!e) {
    var chk = canPlace(tool, tx, ty, toolDir);
    var why = chk.why;
    // 재료가 모자란 경우에는 "어디서 얻는지"까지 함께 말한다.
    // 부족하다고만 하면 플레이어가 그 자리에서 막힌다 (회로기판이 실제로 그랬다).
    if (chk.missing) {
      var how = howToGet(chk.missing);
      if (how) why += ' — ' + how;
    }
    if (why && placeFailMsg !== why) { toast(why, 'bad'); placeFailMsg = why; placeFailT = gameTime; }
    return false;
  }
  placeFailMsg = null;
  renderInv();
  return true;
}
var placeFailMsg = null, placeFailT = 0;

// --- 입력 --------------------------------------------------------------------
var mouse = { x: 0, y: 0, down: false, rdown: false, dragged: false, sx: 0, sy: 0 };
var dragLast = null;
var keys = {};

function bindInput(canvas) {
  canvas.addEventListener('mousemove', function (ev) {
    var r = canvas.getBoundingClientRect();
    mouse.x = ev.clientX - r.left; mouse.y = ev.clientY - r.top;
    var w = worldOf(mouse.x, mouse.y);
    hoverT.x = Math.floor(w.x); hoverT.y = Math.floor(w.y);
    if (mouse.rdown) {
      var dx = ev.movementX || 0, dy = ev.movementY || 0;
      if (Math.abs(dx) + Math.abs(dy) > 0) mouse.dragged = true;
      cam.x -= dx / (TILE * cam.z); cam.y -= dy / (TILE * cam.z);
      clampCam(); refreshHover();
    } else if (mouse.down && tool) {
      dragPlace();
    }
  });
  canvas.addEventListener('mousedown', function (ev) {
    ev.preventDefault();
    if (ev.button === 2) { mouse.rdown = true; mouse.dragged = false; return; }
    if (ev.button !== 0) return;
    mouse.down = true;
    if (pickMode) { doPick(); return; }
    if (tool) { dragLast = null; dragPlace(); }
    else { pickEntity(); }
  });
  window.addEventListener('mouseup', function (ev) {
    if (ev.button === 2) {
      if (mouse.rdown && !mouse.dragged) rightClickAction();
      mouse.rdown = false; return;
    }
    mouse.down = false; dragLast = null;
  });
  // --- 터치 ------------------------------------------------------------------
  // 폰에는 버튼이 셋(좌·우·휠)이 아니라 손가락 개수밖에 없다. 그래서 의도를
  // **손가락 수**로 가른다:
  //   손가락 1개 + 도구 있음 → 건설 (탭 = 한 칸, 끌기 = 여러 칸)
  //   손가락 1개 + 도구 없음 → 지도 이동 (그 자리에서 떼면 = 선택)
  //   손가락 2개            → 핀치 확대 + 이동
  // 우클릭(철거)에 해당하는 것이 없으므로 **철거는 도구로** 만든다(아래 'demolish').
  var tch = { mode: null, id: null, sx: 0, sy: 0, lx: 0, ly: 0, moved: 0,
              pinchD: 0, pinchCx: 0, pinchCy: 0 };
  function localXY(t) {
    var r = canvas.getBoundingClientRect();
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function dist2(a, b) {
    var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function setHoverFrom(p) {
    mouse.x = p.x; mouse.y = p.y;
    var w = worldOf(p.x, p.y);
    hoverT.x = Math.floor(w.x); hoverT.y = Math.floor(w.y);
  }

  canvas.addEventListener('touchstart', function (ev) {
    ev.preventDefault();
    if (ev.touches.length >= 2) {
      tch.mode = 'pinch';
      tch.pinchD = dist2(ev.touches[0], ev.touches[1]);
      var c = localXY({ clientX: (ev.touches[0].clientX + ev.touches[1].clientX) / 2,
                        clientY: (ev.touches[0].clientY + ev.touches[1].clientY) / 2 });
      tch.pinchCx = c.x; tch.pinchCy = c.y;
      // 핀치로 바뀌면 그전까지의 한 손가락 건설은 중단한다 (두 손가락은 건설이 아니다)
      mouse.down = false; dragLast = null;
      return;
    }
    var t = ev.touches[0]; if (!t) return;
    var p = localXY(t);
    tch.id = t.identifier; tch.sx = p.x; tch.sy = p.y; tch.lx = p.x; tch.ly = p.y; tch.moved = 0;
    setHoverFrom(p);
    if (pickMode) { tch.mode = 'pick'; return; }
    if (tool) { tch.mode = 'build'; mouse.down = true; dragLast = null; dragPlace(); }
    else { tch.mode = 'pan'; }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (ev) {
    ev.preventDefault();
    if (tch.mode === 'pinch' && ev.touches.length >= 2) {
      var d = dist2(ev.touches[0], ev.touches[1]);
      if (tch.pinchD > 0 && d > 0) {
        var before = worldOf(tch.pinchCx, tch.pinchCy);
        cam.z = clamp(cam.z * (d / tch.pinchD), 0.35, 2.6);
        var after = worldOf(tch.pinchCx, tch.pinchCy);
        cam.x += before.x - after.x; cam.y += before.y - after.y;
        clampCam(); refreshHover();
      }
      tch.pinchD = d;
      return;
    }
    var t = ev.touches[0]; if (!t) return;
    var p = localXY(t);
    var dx = p.x - tch.lx, dy = p.y - tch.ly;
    tch.moved += Math.abs(dx) + Math.abs(dy);
    tch.lx = p.x; tch.ly = p.y;
    setHoverFrom(p);
    if (tch.mode === 'pan') {
      cam.x -= dx / (TILE * cam.z); cam.y -= dy / (TILE * cam.z);
      clampCam(); refreshHover();
    } else if (tch.mode === 'build') {
      dragPlace();
    }
  }, { passive: false });

  function endTouch(ev) {
    if (tch.mode === 'pinch') {
      if (!ev.touches || ev.touches.length === 0) { tch.mode = null; tch.pinchD = 0; }
      return;
    }
    // 손가락이 거의 안 움직였으면 탭이다. 손가락은 완벽히 가만있지 않으므로
    // 문턱을 둔다 — 0 으로 두면 실기에서 탭이 전부 드래그로 읽힌다.
    var TAP = 12;
    if (tch.mode === 'pick') { doPick(); }
    else if (tch.mode === 'pan' && tch.moved <= TAP) { pickEntity(); }
    mouse.down = false; dragLast = null; tch.mode = null;
  }
  canvas.addEventListener('touchend', function (ev) { ev.preventDefault(); endTouch(ev); }, { passive: false });
  canvas.addEventListener('touchcancel', function (ev) { endTouch(ev); });

  canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  canvas.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var before = worldOf(mouse.x, mouse.y);
    cam.z = clamp(cam.z * (ev.deltaY < 0 ? 1.14 : 1 / 1.14), 0.35, 2.6);
    var after = worldOf(mouse.x, mouse.y);
    cam.x += before.x - after.x; cam.y += before.y - after.y;
    clampCam(); refreshHover();
  }, { passive: false });

  window.addEventListener('keydown', function (ev) {
    // 입력 요소에 포커스가 있으면 게임 단축키로 먹지 않는다.
    // (인스펙터의 <select> 를 키보드로 고르다 'd' 를 누르면 카메라가 움직이고
    //  't' 를 누르면 연구창이 열렸다.)
    // ev.target 을 먼저 본다 — 실제로 타이핑 중이면 키 이벤트의 표적이 그 요소다.
    // document.activeElement 만 보면 창이 포커스를 잃은 상황에서 판정이 어긋난다.
    var ae = ev.target || document.activeElement;
    if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName || '') && ev.key !== 'Escape') return;
    keys[ev.key.toLowerCase()] = true;
    var k = ev.key;
    if (k === 'Escape') {
      if (pickMode) { cancelPick(); return; }
      if (logicOpen) { closeLogic(); return; }
      if (document.getElementById('tech').style.display === 'block') { closeTech(); return; }
      if (document.getElementById('help').style.display === 'block') { closeHelp(); return; }
      tool = null; selected = null; hideInsp(); renderBuildList(); return;
    }
    if (logicOpen) return;
    // 저장/불러오기 — 버튼과 같은 동작. F5(새로고침)·Ctrl+S 처럼 브라우저가 가져가는
    // 키는 피한다. 진입점이 없으면 저장 기능은 있어도 없는 것과 같다.
    if (k === 'F2') { ev.preventDefault(); saveGame(); return; }
    if (k === 'F3') { ev.preventDefault(); loadGame(); return; }
    if (k === 'r' || k === 'R') { toolDir = dirCW(toolDir); return; }
    if (k === 't' || k === 'T') { toggleTech(); return; }
    if (k === 'h' || k === 'H' || k === '?') { toggleHelp(); return; }
    if (k === 'p' || k === 'P') { showPollution = !showPollution; return; }
    if (k === 'q' || k === 'Q') { pipetteTool(); return; }
    // 단축키는 건물에 **고정**돼 있다 (BUILDINGS[].hotkey).
    // 예전엔 "잠긴 것을 뺀 목록의 순서"로 매겼는데, 연구로 새 건물이 열리면
    // 번호가 통째로 밀려서 3=채광기를 외운 사람이 물류학을 연구하는 순간
    // 3=인서터가 됐다. 손에 익은 번호가 바뀌면 안 된다.
    if (k >= '0' && k <= '9') {
      var hit = buildIdForKey(k);
      if (hit) selectTool(hit);
    }
  });
  window.addEventListener('keyup', function (ev) { keys[ev.key.toLowerCase()] = false; });
  window.addEventListener('resize', function () { resizeCanvas(); });
}

function clampCam() {
  cam.x = clamp(cam.x, 4, W - 4);
  cam.y = clamp(cam.y, 4, H - 4);
}

// 커서 아래 타일을 화면 좌표에서 다시 계산한다.
// 카메라가 움직이면 마우스는 그대로여도 가리키는 타일이 바뀐다 — 이걸 안 갱신하면
// WASD 로 이동한 뒤 클릭이 엉뚱한 칸에 들어간다.
function refreshHover() {
  if (!cv) return;
  var w = worldOf(mouse.x, mouse.y);
  hoverT.x = Math.floor(w.x); hoverT.y = Math.floor(w.y);
}

function stepCameraKeys(dt) {
  if (logicOpen && !pickMode) return;      // 대상 지정 중에는 지도를 움직일 수 있어야 한다
  var sp = 22 / cam.z * dt;
  var moved = false;
  if (keys['w'] || keys['arrowup']) { cam.y -= sp; moved = true; }
  if (keys['s'] || keys['arrowdown']) { cam.y += sp; moved = true; }
  if (keys['a'] || keys['arrowleft']) { cam.x -= sp; moved = true; }
  if (keys['d'] || keys['arrowright']) { cam.x += sp; moved = true; }
  if (moved) { clampCam(); refreshHover(); }
}

// 드래그 배치 — 벨트는 이동 방향으로 자동 회전한다 (공장 게임의 기본 손맛)
function dragPlace() {
  var tx = hoverT.x, ty = hoverT.y;
  if (!inBounds(tx, ty)) return;
  if (dragLast && dragLast.x === tx && dragLast.y === ty) return;
  if (dragLast && (tool === 'belt')) {
    var dx = tx - dragLast.x, dy = ty - dragLast.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) {
      for (var d = 0; d < 4; d++) if (DIR_DX[d] === dx && DIR_DY[d] === dy) toolDir = d;
      // 직전 칸의 벨트도 새 방향으로 돌려준다 — 코너가 자연스럽게 이어진다
      var prev = entityAt(dragLast.x, dragLast.y);
      if (prev && prev.type === 'belt') { prev.dir = toolDir; prev.cells[0].dir = toolDir; markBeltDirty(); }
    }
  }
  if (tryPlace(tx, ty)) dragLast = { x: tx, y: ty };
  else if (entityAt(tx, ty)) dragLast = { x: tx, y: ty };
}

function pickEntity() {
  var e = entityAt(hoverT.x, hoverT.y);
  // 철거 모드 — 폰에는 우클릭이 없다. 이게 없으면 잘못 놓은 건물을 영영 못 지운다.
  // 우클릭 경로(rightClickAction)와 같은 일을 하도록 그쪽을 그대로 부른다;
  // 따로 구현하면 "우클릭으로는 나무가 베이는데 철거 버튼으로는 안 된다" 가 생긴다.
  if (demolishMode) { rightClickAction(); renderInv(); return; }
  if (!e) { selected = null; hideInsp(); return; }
  if (e.type === 'controller') { openLogic(e); return; }
  selected = e.id;
  showInsp(e);
}
function rightClickAction() {
  // 대상 지정 중의 우클릭은 "취소"다. 철거로 동작하면 지정하려던 건물을 부수게 된다.
  if (pickMode) { cancelPick(); return; }
  if (tool) { tool = null; renderBuildList(); return; }
  var e = entityAt(hoverT.x, hoverT.y);
  if (e) {
    if (selected === e.id) { selected = null; hideInsp(); }
    removeEntity(e.id, true);
    renderInv();
    return;
  }
  if (inBounds(hoverT.x, hoverT.y) && world.tree[idx(hoverT.x, hoverT.y)]) {
    world.tree[idx(hoverT.x, hoverT.y)] = 0;
    treeCensusDone = false;
  }
}
function pipetteTool() {
  var e = entityAt(hoverT.x, hoverT.y);
  if (e && BUILDINGS[e.type]) { selectTool(e.type); toolDir = e.dir; }
}

// --- 지도에서 대상 고르기 (제어기 노드용) --------------------------------------
function startPick(ctrlId, nid, key, filter) {
  pickMode = { ctrl: ctrlId, nid: nid, key: key, filter: filter || null };
  document.getElementById('logic').style.display = 'none';
  document.getElementById('pickBanner').style.display = 'block';
}
function cancelPick() {
  pickMode = null;
  document.getElementById('pickBanner').style.display = 'none';
  if (logicOpen) document.getElementById('logic').style.display = 'block';
}
// 지정 중이던 제어기가 철거되면 지정 모드도 접는다 (25_entity.js 가 부른다)
function cancelPickIfTarget(id) {
  if (pickMode && pickMode.ctrl === id) cancelPick();
}
function doPick() {
  var e = entityAt(hoverT.x, hoverT.y);
  if (!e) { toast('그 자리엔 아무것도 없다', 'bad'); return; }
  if (pickMode.filter && pickMode.filter.indexOf(e.type) < 0) {
    toast(pickMode.filter.map(function (t) { return BUILDINGS[t].name; }).join('/') + ' 만 지정할 수 있다', 'bad');
    return;
  }
  var ctrl = entities[pickMode.ctrl];
  if (ctrl && ctrl.graph) {
    var n = graphNode(ctrl.graph, pickMode.nid);
    if (n) { n.cfg[pickMode.key] = e.id; ctrl.graph.dirty = true; }
  }
  var save = pickMode; pickMode = null;
  document.getElementById('pickBanner').style.display = 'none';
  if (logicOpen) { document.getElementById('logic').style.display = 'block'; renderGraph(); }
  void save;
}

// --- 오버레이 (월드 좌표계에서 그린다) ----------------------------------------
function drawOverlays() {
  // 전주 공급구역
  if (tool === 'pole' || (selected && entities[selected] && entities[selected].type === 'pole')) {
    ctx.fillStyle = 'rgba(240,169,43,0.09)';
    ctx.strokeStyle = 'rgba(240,169,43,0.4)'; ctx.lineWidth = 0.05;
    forEachEntity(function (e) {
      if (e.type !== 'pole') return;
      var S = SPEC.poleSupply;
      ctx.fillRect(e.tx - S, e.ty - S, S * 2 + 1, S * 2 + 1);
    });
    if (tool === 'pole' && inBounds(hoverT.x, hoverT.y)) {
      var S2 = SPEC.poleSupply;
      ctx.strokeRect(hoverT.x - S2, hoverT.y - S2, S2 * 2 + 1, S2 * 2 + 1);
    }
  }
  // 선택 강조 + 인서터/터렛 보조선
  if (selected && entities[selected]) {
    var se = entities[selected];
    ctx.strokeStyle = COL.amber; ctx.lineWidth = 0.08;
    ctx.strokeRect(se.tx - 0.05, se.ty - 0.05, se.w + 0.1, se.h + 0.1);
    if (se.type === 'inserter') {
      var s1 = inserterSource(se), t1 = inserterTarget(se);
      ctx.fillStyle = 'rgba(217,84,74,0.30)'; ctx.fillRect(s1.x, s1.y, 1, 1);
      ctx.fillStyle = 'rgba(73,192,90,0.30)'; ctx.fillRect(t1.x, t1.y, 1, 1);
    }
    if (se.type === 'turret') {
      ctx.strokeStyle = 'rgba(217,84,74,0.45)'; ctx.lineWidth = 0.07;
      ctx.beginPath(); ctx.arc(se.tx + 1, se.ty + 1, SPEC.turretRange, 0, 6.283); ctx.stroke();
    }
  }
  // 배치 미리보기
  if (tool && inBounds(hoverT.x, hoverT.y)) {
    var B = BUILDINGS[tool];
    var w = B.w, h = B.h;
    if (B.rot && (toolDir === 1 || toolDir === 3) && w !== h) { var t = w; w = h; h = t; }
    var ok = canPlace(tool, hoverT.x, hoverT.y, toolDir).ok;
    ctx.fillStyle = ok ? 'rgba(73,192,90,0.26)' : 'rgba(217,84,74,0.30)';
    ctx.fillRect(hoverT.x, hoverT.y, w, h);
    ctx.strokeStyle = ok ? '#49c05a' : '#d9544a'; ctx.lineWidth = 0.06;
    ctx.strokeRect(hoverT.x, hoverT.y, w, h);
    if (B.rot) drawArrow(hoverT.x, hoverT.y, w, h, toolDir, '#ffffff');
    if (tool === 'turret') {
      ctx.strokeStyle = 'rgba(217,84,74,0.35)'; ctx.lineWidth = 0.06;
      ctx.beginPath(); ctx.arc(hoverT.x + 1, hoverT.y + 1, SPEC.turretRange, 0, 6.283); ctx.stroke();
    }
  }
  // 커서 타일
  if (!tool && inBounds(hoverT.x, hoverT.y)) {
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 0.04;
    ctx.strokeRect(hoverT.x + 0.02, hoverT.y + 0.02, 0.96, 0.96);
  }
}

// --- HUD ---------------------------------------------------------------------
// 숫자 키 → 건물. 잠금 여부와 무관하게 항상 같은 건물을 가리킨다.
function buildIdForKey(k) {
  for (var i = 0; i < BUILD_IDS.length; i++) {
    if (BUILDINGS[BUILD_IDS[i]].hotkey === k) return BUILD_IDS[i];
  }
  return null;
}

function visibleBuildIds() {
  return BUILD_IDS.filter(function (b) {
    var B = BUILDINGS[b];
    return !B.tech || techDone[B.tech];
  });
}
function costStr(cost) {
  var s = [];
  for (var k in cost) s.push(cost[k] + ITEMS[k].name.slice(0, 2));
  return s.join(' ');
}
function renderBuildList() {
  var host = document.getElementById('buildList');
  if (!host) return;
  var html = [];
  for (var i = 0; i < BUILD_IDS.length; i++) {
    var id = BUILD_IDS[i], B = BUILDINGS[id];
    var locked = B.tech && !techDone[B.tech];
    var key = B.hotkey || '';   // 고정 — 연구를 해도 번호가 밀리지 않는다
    var poor = false;
    for (var k in B.cost) if ((inventory[k] || 0) < B.cost[k]) poor = true;
    html.push('<div class="bitem' + (tool === id ? ' sel' : '') + (locked ? ' locked' : '') +
      (poor ? ' poor' : '') + '" data-b="' + id + '" title="' + B.desc + '">' +
      '<span class="bkey">' + key + '</span>' +
      '<span class="bn">' + B.name + '</span>' +
      '<span class="bc">' + (locked ? '🔒' : costStr(B.cost)) + '</span></div>');
  }
  host.innerHTML = html.join('');
  var items = host.querySelectorAll('.bitem');
  for (var j = 0; j < items.length; j++) {
    items[j].onclick = (function (bid) { return function () { selectTool(bid); }; })(items[j].getAttribute('data-b'));
  }
}

function renderInv() {
  var host = document.getElementById('invList');
  if (!host) return;
  var html = [];
  for (var i = 0; i < ITEM_IDS.length; i++) {
    var k = ITEM_IDS[i];
    var q = inventory[k] || 0;
    if (!q) continue;
    html.push('<div class="irow"><span class="n">' + ITEMS[k].name + '</span><span class="q">' + q + '</span></div>');
  }
