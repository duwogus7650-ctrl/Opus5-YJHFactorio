}

// 대기열은 매 프레임 다시 그린다 (진행 막대가 움직여야 하므로). 항목이 없으면
// :empty 로 통째로 숨는다 — 빈 상자가 패널을 밀어 올리지 않게.
var craftQueueSig = '';
function renderCraftQueue() {
  var host = document.getElementById('craftQueue');
  if (!host) return;
  if (handQueue.length === 0) {
    if (craftQueueSig !== '') { host.innerHTML = ''; craftQueueSig = ''; }
    return;
  }
  // 매 프레임 innerHTML 을 새로 짜면 클릭 바인딩까지 60번/s 다시 건다. 줄 구성이
  // 그대로면 진행 막대 폭만 고친다 — 그래야 막대가 부드럽게 움직인다.
  var sig = handQueue.length + '|' + handQueue[0].rid;
  if (sig === craftQueueSig) {
    var bar = host.querySelector('.qbar');
    var rt = RECIPES[handQueue[0].rid].time;
    if (bar) bar.style.width = Math.round((1 - handQueue[0].left / rt) * 100) + '%';
    var lab = host.querySelector('.qrow .qx');
    if (lab) lab.textContent = handQueue[0].left.toFixed(1) + 's';
    return;
  }
  craftQueueSig = sig;
  // 대기열 줄과 아래 제작 목록이 같은 모양이라 경계가 안 보였다 — 무엇이 '만드는 중'
  // 이고 무엇이 '누르면 만들 것' 인지 그림만 보고 갈릴 수 있어야 한다.
  var html = ['<div class="qcap">만드는 중 · 클릭하면 취소</div>'];
  for (var i = 0; i < handQueue.length && i < 12; i++) {
    var job = handQueue[i], r = RECIPES[job.rid];
    var name = ITEMS[Object.keys(r.out)[0]].name;
    var pct = i === 0 ? Math.round((1 - job.left / r.time) * 100) : 0;
    html.push('<div class="qrow" data-i="' + i + '" title="클릭하면 취소하고 재료를 돌려받는다">' +
      '<i class="qbar" style="width:' + pct + '%"></i>' +
      '<span>' + name + '</span>' +
      '<span class="qx">' + (i === 0 ? job.left.toFixed(1) + 's' : '대기') + '</span></div>');
  }
  if (handQueue.length > 12) html.push('<div class="qrow"><span>… 외 ' + (handQueue.length - 12) + '개</span></div>');
  host.innerHTML = html.join('');
  var rows = host.querySelectorAll('.qrow[data-i]');
  for (var j = 0; j < rows.length; j++) {
    rows[j].onclick = (function (i) {
      return function () { if (handCancel(i)) { renderInv(); renderCraftList(); renderBuildList(); } };
    })(parseInt(rows[j].getAttribute('data-i'), 10));
  }
}

function renderCraftList() {
  var host = document.getElementById('craftList');
  if (!host) return;
  var html = [];
  for (var i = 0; i < RECIPE_IDS.length; i++) {
    var rid = RECIPE_IDS[i], r = RECIPES[rid];
    if (!r.handOk) continue;
    if (r.tech && !techDone[r.tech]) continue;
    var ok = canHandCraft(rid);
    var inp = [];
    for (var k in r.inp) inp.push(r.inp[k] + '×' + ITEMS[k].name.slice(0, 3));
    var outN = 0; for (var o in r.out) outN = r.out[o];
    html.push('<div class="craftbtn' + (ok ? '' : ' no') + '" data-r="' + rid + '">' +
      '<span>' + ITEMS[Object.keys(r.out)[0]].name + (outN > 1 ? ' ×' + outN : '') + '</span>' +
      '<span class="dim" style="font-size:10px">' + inp.join(' ') + '</span></div>');
  }
  host.innerHTML = html.join('');
  var btns = host.querySelectorAll('.craftbtn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].onclick = (function (rid) {
      return function () { if (handCraft(rid)) { renderInv(); renderCraftList(); renderBuildList(); } };
    })(btns[j].getAttribute('data-r'));
  }
}

function renderTop() {
  var host = document.getElementById('top');
  if (!host) return;
  var satPct = Math.round(powerStats.sat * 100);
  var satCls = satPct >= 99 ? 'okv' : (satPct >= 70 ? 'warnv' : 'badv');
  var evoPct = Math.round(evolution * 100);
  var threat = enemyThreatLevel();
  var res = currentResearch
    ? TECHS[currentResearch].name.split(' ')[0] + ' ' + Math.round(researchFrac() * 100) + '%'
    : '없음';
  var pollTot = 0;
  for (var i = 0; i < world.poll.length; i++) pollTot += world.poll[i];
  host.innerHTML =
    stat('시간', fmtTime(gameTime)) +
    stat('전력', satPct + '%', satCls, Math.round(powerStats.supply) + ' / ' + Math.round(powerStats.demand) + ' kW') +
    stat('오염', fmtShort(pollTot), pollTot > 60 ? 'warnv' : '') +
    stat('진화도', evoPct + '%', evoPct > 55 ? 'badv' : (evoPct > 25 ? 'warnv' : '')) +
    stat('적', String(enemies.length), threat > 0 ? 'badv' : '', '접근 ' + threat) +
    stat('연구', res, currentResearch ? 'okv' : 'warnv') +
    stat('손실', String(waveStats.buildingsLost), waveStats.buildingsLost ? 'badv' : '');
  // 라벨은 판에 각인, 값은 판에 박힌 계기창(well) 안에서 빛난다 — 이 UI 의 시그니처
  function stat(k, v, cls, sub) {
    return '<div class="stat" title="' + (sub || '') + '"><span class="k">' + k + '</span>' +
      '<span class="v well ' + (cls || '') + '">' + v + '</span></div>';
  }
}

function renderAlarms() {
  var a = document.getElementById('alarms');
  var uniq = {};
  for (var i = 0; i < alarms.length; i++) uniq[alarms[i]] = 1;
  var ks = Object.keys(uniq);
  a.innerHTML = ks.map(function (m) { return '<div class="alarm">⚠ ' + m + '</div>'; }).join('');
  var d = document.getElementById('dispRow');
  d.style.top = ks.length ? '100px' : '70px';
  var seen = {}, out = [];
  for (var j = 0; j < displays.length; j++) {
    var it = displays[j];
    if (seen[it.label]) continue;
    seen[it.label] = 1;
    out.push('<div class="disp">' + it.label + ' <b>' + fmt(it.value, 1) + '</b></div>');

}

// --- 인스펙터 ----------------------------------------------------------------
var lastInspSig = null;
function hideInsp() {
  document.getElementById('insp').style.display = 'none';
  lastInspSig = null;
}
function showInsp(e) {
  var p = document.getElementById('insp');
  document.getElementById('inspTitle').textContent = BUILDINGS[e.type].name + ' #' + e.id;
  // 좁은 화면에서는 시트가 겹친다 — 인스펙터를 열면 건설 시트는 접는다.
  if (window.matchMedia && window.matchMedia('(max-width: 720px)').matches) {
    document.body.classList.remove('sheet-build', 'sheet-right');
    var bb = document.getElementById('btnSheetBuild'); if (bb) bb.classList.remove('on');
    var br = document.getElementById('btnSheetRight'); if (br) br.classList.remove('on');
  }
  p.style.display = 'block';
  lastInspSig = null;
  refreshInsp();
}

// 조작 요소(<select>·버튼)의 구성이 바뀌었는지를 나타내는 지문.
// 이게 같으면 조작 영역을 다시 그리지 않는다 — 0.2초마다 innerHTML 을 갈아엎으면
// 사용자가 열어 둔 드롭다운이 강제로 닫혀 레시피를 아예 고를 수 없었다.
function inspSignature(e) {
  return [e.id, e.type, e.recipe, e.playerFilter, e.outPrio,
          e.playerEnabled === false ? 0 : 1, e.logicForced ? 1 : 0,
          stockPuttableItems(e).length > 0 ? 1 : 0,   // [넣기] 버튼의 활성 여부
          stockTakeCount(e) > 0 ? 1 : 0,     // [가져오기] 버튼의 활성 여부
          Object.keys(techDone).length].join('|');
}

function refreshInsp() {
  var p = document.getElementById('insp');
  if (p.style.display !== 'block') return;
  var e = entities[selected];
  if (!e) { hideInsp(); return; }
  var b = document.getElementById('inspBody');
  var B = BUILDINGS[e.type];

  // --- 조작 영역: 지문이 바뀔 때만 재생성 -----------------------------------
  var sig = inspSignature(e);
  if (sig !== lastInspSig) {
    lastInspSig = sig;
    var c = [];
    c.push('<div class="dim" style="font-size:11px;margin-bottom:6px">' + B.desc + '</div>');
    if (e.type === 'assembler') {
      c.push('<div class="frow"><label>레시피</label><select id="recSel"><option value="">— 없음 —</option>' +
        RECIPE_IDS.filter(function (r) {
          return RECIPES[r].cat === 'craft' && (!RECIPES[r].tech || techDone[RECIPES[r].tech]);
        }).map(function (r) {
          return '<option value="' + r + '"' + (e.recipe === r ? ' selected' : '') + '>' +
            ITEMS[Object.keys(RECIPES[r].out)[0]].name + ' (' + RECIPES[r].time + 's)</option>';
        }).join('') + '</select></div>');
    }
    if (e.type === 'furnace' && e.recipe) {
      c.push('<div class="frow"><label>레시피</label><span class="num">' +
        ITEMS[Object.keys(RECIPES[e.recipe].out)[0]].name + '</span></div>');
    }
    if (e.type === 'inserter') {
      c.push('<div class="frow"><label>필터</label><select id="filSel"><option value="">— 없음 —</option>' +
        ITEM_IDS.map(function (i) {
          return '<option value="' + i + '"' + (e.playerFilter === i ? ' selected' : '') + '>' + ITEMS[i].name + '</option>';
        }).join('') + '</select></div>');
    }
    if (e.type === 'splitter') {
      c.push('<div class="frow"><label>출력우선</label><select id="prioSel">' +
        '<option value="">균등 분배</option><option value="0"' + (e.outPrio === 0 ? ' selected' : '') + '>왼쪽</option>' +
        '<option value="1"' + (e.outPrio === 1 ? ' selected' : '') + '>오른쪽</option></select></div>');
    }
    // 보유 자재 → 기계. 손으로 라인을 초기 급유할 수 있어야 "레시피는 걸었는데
    // 왜 안 도나"를 스스로 확인할 수 있다. 무엇이 들어갈지는 canAccept 가 정한다.
    if (PUT_TYPES[e.type]) {
      var puttable = stockPuttableItems(e);
      var putTitle = puttable.length
        ? '넣을 수 있는 것: ' + puttable.map(function (i) { return ITEMS[i].name; }).join(' · ')
        : (e.recipe || e.type !== 'assembler'
            ? '지금 이 기계가 받을 수 있는 자재가 보유 자재에 없다'
            : '레시피를 먼저 골라야 무엇을 받을지 정해진다');
      c.push('<button id="putBtn" style="width:100%;margin-top:4px" title="' + putTitle + '"' +
        (puttable.length ? '' : ' disabled') + '>보유 자재 넣기</button>');
    }
    // 상자·기계에 든 것을 보유 자재로 꺼낸다. 이 버튼이 없으면 공장이 만든 것을
    // 쓸 방법이 철거밖에 없어서, 시작 지급분을 다 쓰는 순간 게임이 막힌다.
    if (e.type !== 'generator' && e.type !== 'turret' && (e.inv || e.out)) {
      c.push('<button id="takeBtn" style="width:100%;margin-top:4px"' +
        (stockTakeCount(e) < 1 ? ' disabled' : '') + '>보유 자재로 가져오기</button>');
    }
    c.push('<div style="display:flex;gap:6px;margin-top:9px">' +
      // 제어기가 가동 축을 지배 중이면 이 버튼은 **지금 아무 효과가 없다.**
      // 예전엔 라벨만 뒤집히고 기계는 계속 돌아서 버튼이 거짓말을 했다.
      '<button id="tglBtn"' + (e.fEnable ? ' title="제어기가 지배 중 — 지배가 풀린 뒤에 적용된다"' : '') + '>' +
      (e.playerEnabled === false ? '가동' : '정지') + (e.fEnable ? ' (지배중)' : '') + '</button>' +
      '<button class="danger" id="delBtn">철거</button></div>');
    if (e.logicForced) {
      c.push('<div class="ok" style="font-size:11px;margin-top:5px">⛓ 제어기 지배 중 — 수동 조작은 지배가 풀린 뒤 적용된다</div>');
    }
    // 두 제어기가 같은 축을 다투면 한쪽이 조용히 무시된다. 그걸 말해 준다.
    if (e.logicConflict) {
      c.push('<div class="bad" style="font-size:11px;margin-top:5px;font-weight:600">⚠ ' +
             e.logicConflict + '</div>');
    }
    b.innerHTML = '<div id="inspStat"></div>' + c.join('');
    bindInspControls(e);
  }

  // --- 수치 영역: 매번 갱신 (조작 요소가 없어 안전) ---------------------------
  var s = [];
  if (B.power) {
    s.push('<div class="frow"><label>전력</label><span class="num" style="color:' +
      (e.powerSat > 0.99 ? 'var(--run)' : (e.powerSat > 0 ? 'var(--warn)' : 'var(--stop)')) + '">' +
      Math.round(e.powerSat * 100) + '% · ' + Math.round(B.power * machinePowerMul) + ' kW' +
      (e.net < 0 ? ' · <b class="bad">망 미연결</b>' : '') + '</span></div>');
  }
  s.push('<div class="frow"><label>체력</label><span class="num">' + Math.round(e.hp) + ' / ' + e.maxHp + '</span></div>');
  if (e.type === 'generator') {
    s.push('<div class="frow"><label>연료</label><span class="num">' + fmt(e.fuel / 1000, 1) + ' MJ · 부하 ' +
      Math.round((e.load || 0) * 100) + '% · 보유 석탄 ' + (inventory['coal'] || 0) +
      (e.net < 0 ? ' · <b class="bad">망 미연결</b>' : '') + '</span></div>');
  }
  if (e.type === 'turret') {
    s.push('<div class="frow"><label>탄약</label><span class="num">' + e.ammo + ' 발' +
      (e.fireOk ? '' : ' · <b class="bad">사격 금지</b>') + '</span></div>');
  }
  if (e.type === 'miner') {
    s.push('<div class="frow"><label>광맥</label><span class="num">' +
      (e.surveyed && e.surveyed.item
        ? ITEMS[e.surveyed.item].name + ' ' + fmtShort(surveyOre(e.tx, e.ty, e.w, e.h).total)
        : '없음') + (e.depleted ? ' · <b class="bad">고갈</b>' : '') + '</span></div>');
  }
  var inv = {};
  for (var k in e.inv) inv[k] = e.inv[k];
  for (var o in e.out) inv[o] = (inv[o] || 0) + e.out[o];
  if (Object.keys(inv).length) {
    s.push('<div class="frow" style="align-items:flex-start"><label>내용물</label><div class="chips">' +
      Object.keys(inv).map(function (i) { return '<span class="chip">' + ITEMS[i].name + ' ' + inv[i] + '</span>'; }).join('') +
      '</div></div>');
  }
  // 레시피는 걸렸는데 왜 안 도는지 말해준다. 사용자가 "적색연구팩 제작이 안되는데?"
  // 로 막힌 자리다 — 화면에는 전력 100%·체력 만땅만 있고 정작 입력 버퍼가 비었다는
  // 사실은 [내용물] 행이 **없는 것**으로만 드러났다. 없는 것은 아무도 못 읽는다.
  if ((e.type === 'assembler' || e.type === 'furnace') && e.recipe) {
    var rec = RECIPES[e.recipe], missing = [];
    // 연구가 안 된 레시피는 시뮬에서도 안 돈다 — 그걸 안 알려주면 조용한 정지가 된다
    if (rec.tech && !techDone[rec.tech]) {
      s.push('<div class="frow" style="align-items:flex-start"><label>정지 이유</label>' +
        '<span class="bad">' + TECHS[rec.tech].name + ' 연구가 필요하다' +
        '<br><span class="hint">이 레시피는 연구가 끝나야 돈다. <b>T</b> 에서 연구한다.</span>' +
        '</span></div>');
    }
    for (var mk in rec.inp) {
      if ((e.inv[mk] || 0) < rec.inp[mk]) missing.push(ITEMS[mk].name + ' ' + (e.inv[mk] || 0) + '/' + rec.inp[mk]);
    }
    if (missing.length) {
      s.push('<div class="frow" style="align-items:flex-start"><label>정지 이유</label>' +
        '<span class="bad">재료 부족 — ' + missing.join(', ') + '<br>' +
        '<span class="hint">기계는 <b>제 안에 든 것</b>으로만 만든다. 인서터로 넣거나 ' +
        '아래 [보유 자재 넣기]로 손수 채운다.</span></span></div>');
    }
  }
  var statEl = document.getElementById('inspStat');
  if (statEl) statEl.innerHTML = s.join('');
}

function bindInspControls(e) {
  var rs = document.getElementById('recSel');
  if (rs) rs.onchange = function () {
    e.recipe = rs.value || null; e.progress = 0;
    // 레시피를 바꾸면 남은 입력은 창고로 — 안 그러면 영원히 안 쓰이는 재료가 갇힌다
    for (var kk in e.inv) inventory[kk] = (inventory[kk] || 0) + e.inv[kk];
    e.inv = {};
    markPowerDirty(); renderInv(); refreshInsp();
  };
  var fs = document.getElementById('filSel');
  if (fs) fs.onchange = function () { e.playerFilter = fs.value || null; e.filter = e.playerFilter; };
  var ps = document.getElementById('prioSel');
  if (ps) ps.onchange = function () { e.outPrio = ps.value === '' ? null : parseInt(ps.value, 10); };
  var pb = document.getElementById('putBtn');
  if (pb) pb.onclick = function () {
    var n = putFromStock(e);
    if (n > 0) toast(n + '개를 넣었다', 'good');
    else toast('넣을 수 있는 자재가 없다', 'bad');
    renderInv(); renderCraftList(); renderBuildList(); refreshInsp();
  };
  var tk = document.getElementById('takeBtn');
  if (tk) tk.onclick = function () {
    var n = takeAllToStock(e);
    if (n > 0) toast(n + '개를 보유 자재로 가져왔다', 'good');
    renderInv(); renderCraftList(); renderBuildList(); refreshInsp();
  };
  document.getElementById('tglBtn').onclick = function () {
    e.playerEnabled = (e.playerEnabled === false);
    if (!e.logicForced) e.enabled = e.playerEnabled;
    markPowerDirty(); refreshInsp();
  };
  document.getElementById('delBtn').onclick = function () {
    removeEntity(e.id, true); selected = null; hideInsp(); renderInv(); renderBuildList();
  };
}

function toggleTech() {
  var t = document.getElementById('tech');
  t.style.display = t.style.display === 'block' ? 'none' : 'block';
  if (t.style.display === 'block') renderTech();
}
function closeTech() { document.getElementById('tech').style.display = 'none'; }
function renderTech() {
  var body = document.getElementById('techBody');
  if (!body) return;
  var h = [];
  h.push('<div class="dim" style="font-size:11.5px;margin-bottom:8px">' +
    '연구소가 연구팩을 소비해 진행한다. 한 사이클마다 표시된 팩을 각각 1개씩 먹는다.</div>');
  for (var i = 0; i < TECH_IDS.length; i++) {
    var tid = TECH_IDS[i], T = TECHS[tid];
    var done = !!techDone[tid], avail = techAvailable(tid);
    var cls = done ? 'done' : (avail ? '' : 'locked');
    var cost = Object.keys(T.cost).map(function (k) { return T.cost[k] + '× ' + ITEMS[k].name.replace(' 연구팩', ''); }).join(' + ');
    // 갈아탄 연구의 진행도도 보여준다. 안 보이면 "0으로 날아갔나" 싶어 못 갈아탄다 —
    // 안전한데 안전해 보이지 않는 것은 안전하지 않은 것과 같다.
    var prog = '';
    if (currentResearch === tid) prog = ' — 진행 ' + Math.round(researchFrac() * 100) + '%';
    else if (!done && (researchProgressBy[tid] || 0) > 0) {
      prog = ' — <span class="dim">중단 ' +
        Math.round((researchProgressBy[tid] / techCycles(tid)) * 100) + '% (이어서 진행됨)</span>';
    }
    h.push('<div class="trow ' + cls + '"><div class="tn"><b>' + T.name + '</b>' + prog +
      '<div class="td">' + T.desc + ' <span class="lnk">해제: ' + T.unlock.join(', ') + '</span>' +
      (T.needs.length ? ' <span class="dim">· 선행: ' + T.needs.map(function (n) { return TECHS[n].name; }).join(', ') + '</span>' : '') +
      '</div></div><div class="tcost">' + cost + '</div>' +
      (done ? '<span class="ok">완료</span>'
        : (avail ? '<button data-t="' + tid + '" class="' + (currentResearch === tid ? '' : 'pri') + '">' +
          (currentResearch === tid ? '진행 중' : '시작') + '</button>' : '<span class="dim">잠김</span>')) +
      '</div>');
  }
  body.innerHTML = h.join('');
  var bs = body.querySelectorAll('button[data-t]');
  for (var j = 0; j < bs.length; j++) {
    bs[j].onclick = (function (tid) { return function () { startResearch(tid); }; })(bs[j].getAttribute('data-t'));
  }
}

var miniT = 0;
function renderMini() {
  var c = document.getElementById('mini');
  if (!c) return;
  var g = c.getContext('2d');
  var sx = c.width / W, sy = c.height / H;
  g.fillStyle = '#141a14'; g.fillRect(0, 0, c.width, c.height);
  // 광맥
  for (var y = 0; y < H; y += 2) {
    for (var x = 0; x < W; x += 2) {
      var i = idx(x, y);
      if (world.oreAmt[i]) { g.fillStyle = ORE_COLOR[world.ore[i]]; g.fillRect(x * sx, y * sy, sx * 2, sy * 2); }
      else if (world.tree[i]) { g.fillStyle = '#22331b'; g.fillRect(x * sx, y * sy, sx * 2, sy * 2); }
    }
  }
  // 오염
  var C = SPEC.pollutionPerChunk;
  for (var py = 0; py < PH; py++) {
    for (var px = 0; px < PW; px++) {
      var v = world.poll[pidx(px, py)];
      if (v <= 0.05) continue;
      g.fillStyle = 'rgba(190,70,35,' + clamp(v * 0.10, 0, 0.5) + ')';
      g.fillRect(px * C * sx, py * C * sy, C * sx, C * sy);
    }
  }
  // 건물
  forEachEntity(function (e) {
    g.fillStyle = e.type === 'belt' || e.type === 'splitter' ? '#8a8f96'
      : (e.type === 'turret' ? '#d9544a' : (e.type === 'controller' ? '#49c05a' : '#4a86c4'));
    g.fillRect(e.tx * sx, e.ty * sy, Math.max(1.4, e.w * sx), Math.max(1.4, e.h * sy));
  });
  // 둥지 / 적
  for (var n = 0; n < nests.length; n++) {
    g.fillStyle = '#8a5fc0';
    g.fillRect(nests[n].x * sx - 2, nests[n].y * sy - 2, 4, 4);
  }
  g.fillStyle = '#e05a8a';
  for (var k = 0; k < enemies.length; k++) g.fillRect(enemies[k].x * sx - 1, enemies[k].y * sy - 1, 2, 2);
  // 카메라 사각
  var vs = viewScale();
  var hw = cv.width / 2 / vs, hh = cv.height / 2 / vs;
  g.strokeStyle = '#f0a92b'; g.lineWidth = 1;
  g.strokeRect((cam.x - hw) * sx, (cam.y - hh) * sy, hw * 2 * sx, hh * 2 * sy);
}

function bindMini() {
  var c = document.getElementById('mini');
  function jump(clientX, clientY) {
    var r = c.getBoundingClientRect();
    cam.x = (clientX - r.left) / r.width * W;
    cam.y = (clientY - r.top) / r.height * H;
    clampCam(); refreshHover();
  }
  c.addEventListener('mousedown', function (ev) { jump(ev.clientX, ev.clientY); });
  c.addEventListener('touchstart', function (ev) {
    ev.preventDefault();
    var t = ev.touches[0]; if (t) jump(t.clientX, t.clientY);
  }, { passive: false });
}

//
//  설계 원칙: **문장을 읽었는지가 아니라 공장이 실제로 그렇게 됐는지로 판정한다.**
//  각 단계는 check() 하나이고, 그 함수는 세계 상태만 본다. "다음" 버튼으로 넘기는
//  튜토리얼은 아무것도 가르치지 않는다 — 눌러서 넘어가면 손은 배운 게 없다.
//
//  단계는 도움말의 "10분 안에 돌아가는 공장"과 같은 순서이고, 마지막 두 단계가
//  이 게임의 본체(제어기 배선)다. 거기까지 데려가는 것이 이 튜토리얼의 목적이다.
// ===========================================================================

// "지금 버퍼에 있는가"로 보면 인서터가 빼 가는 순간을 놓치므로 누적으로 센다.

// --- 판정 도우미 -------------------------------------------------------------
function anyEntity(fn) {
  var hit = null;
  forEachEntity(function (e) { if (!hit && fn(e)) hit = e; });
  return hit;
}
function countEntity(type) {
  var n = 0;
  forEachEntity(function (e) { if (e.type === type) n++; });
  return n;
}
// 건물 앞변(출력 방향)에 벨트가 있는가
function hasBeltInFront(e) {
  var d = e.dir, pts = [];
  if (d === 0) { for (var x = e.tx; x < e.tx + e.w; x++) pts.push([x, e.ty - 1]); }
  else if (d === 2) { for (var x2 = e.tx; x2 < e.tx + e.w; x2++) pts.push([x2, e.ty + e.h]); }
  else if (d === 1) { for (var y = e.ty; y < e.ty + e.h; y++) pts.push([e.tx + e.w, y]); }
  else { for (var y2 = e.ty; y2 < e.ty + e.h; y2++) pts.push([e.tx - 1, y2]); }
  for (var i = 0; i < pts.length; i++) {
    var c = cellAt(pts[i][0], pts[i][1]);
    if (c) return true;
  }
  return false;
}

// --- 배선 판정 도우미 --------------------------------------------------------
// 심화 단계는 "제어기에 무엇을 배선했는가"로 판정한다. 노드를 놓기만 한 것은
// 아무것도 아니고, **신호가 실제로 목적지까지 흐르는 배선**이어야 통과한다.
// 그래서 노드 개수가 아니라 링크를 따라간 도달성으로 본다.
function eachCtrlGraph(fn) {
  forEachEntity(function (e) { if (e.type === 'controller' && e.graph) fn(e.graph); });
}
// startNid 에서 링크를 따라 도달하는 노드 중 kinds 에 속하는 것 전부.
// **첫 하나에서 멈추지 않는다** — 멈추면 "그 하나가 막다른 길일 때" 뒤에 있는
// 멀쩡한 경로를 못 보고 거짓 실패를 낸다.
// 걸음 수 누적 — 게이트가 "순환에서 탐색이 폭발하지 않는가"를 숫자로 검정한다.
// 이게 없으면 순환 방어가 깨졌는지를 "멈추나 안 멈추나"로만 볼 수 있는데,
// 안 멈추는 것은 게이트가 못 잡는다. 브라우저가 통째로 매달릴 뿐이다.
var reachStepsTotal = 0;
function resetReachSteps() { reachStepsTotal = 0; }
var REACH_LIMIT = 20000;

function reachableNodes(g, startNid, kinds, pred) {
  var seen = {}, stack = [startNid], out = [], guard = 0;
  // 상한은 seen 과 **겹치는 방어**다. seen 하나만 믿으면 그것이 깨진 순간
  // 판정이 틀리는 게 아니라 브라우저가 멈춘다 — 이 검사는 플레이어 기계에서
  // 초당 4번 돈다. 실제로 seen 을 지운 돌연변이가 헤드리스 브라우저를 영구히
  // 매달아 돌연변이 게이트 전체를 세웠고, 그래서 상한을 따로 두게 됐다.
  while (stack.length && guard++ < REACH_LIMIT) {
    var cur = stack.pop();
    if (seen[cur]) continue;   // 되먹임 배선 순환 방어 (reachableNodes 전용)
    seen[cur] = 1;
    for (var i = 0; i < g.links.length; i++) {
      var l = g.links[i];
      if (l.fn !== cur) continue;
      var nx = graphNode(g, l.tn);
      if (!nx) continue;
      if (kinds.indexOf(nx.kind) >= 0 && (!pred || pred(nx))) out.push(nx);
      stack.push(l.tn);
    }
  }
  reachStepsTotal += guard;
  return out;
}
function portFed(g, nid, port) {
  for (var i = 0; i < g.links.length; i++) {
    if (g.links[i].tn === nid && g.links[i].tp === port) return true;
  }
  return false;
}
// 출력 노드는 대상이 물려 있어야 실제로 공장을 움직인다. 대상이 빈 노드는 장식이다.
function hasTarget(n) { return !!n.cfg && n.cfg.ent !== null && n.cfg.ent !== undefined; }

// kindFrom 에서 출발해 kindsTo 중 하나에 닿는 배선이 어느 제어기에든 있는가
function ctrlFeeds(kindFrom, kindsTo, pred) {
  var hit = false;
  eachCtrlGraph(function (g) {
    if (hit) return;
    for (var i = 0; i < g.nodes.length; i++) {
      if (g.nodes[i].kind !== kindFrom) continue;
      if (reachableNodes(g, g.nodes[i].nid, kindsTo, pred).length) hit = true;
    }
  });
  return hit;
}
// kindFrom → (kindMid 를 거쳐) → kindTo. 중간 노드 후보를 전부 시도한다.
function ctrlPathThrough(kindFrom, kindMid, kindTo, midOk) {
  var hit = false;
  eachCtrlGraph(function (g) {
    if (hit) return;
    for (var i = 0; i < g.nodes.length; i++) {
      if (g.nodes[i].kind !== kindFrom) continue;
      var mids = reachableNodes(g, g.nodes[i].nid, [kindMid]);
      for (var j = 0; j < mids.length; j++) {
        if (midOk && !midOk(g, mids[j])) continue;
        if (reachableNodes(g, mids[j].nid, [kindTo], hasTarget).length) hit = true;
      }
    }
  });
  return hit;
}
// 인서터가 앞칸에 터렛을 두고 있는가 (= 탄약을 자동으로 넣는 배치인가)
function inserterFeedsTurret() {
  return !!anyEntity(function (e) {
    if (e.type !== 'inserter') return false;
    var t = inserterTarget(e);
    var tgt = entityAt(t.x, t.y);
    return !!tgt && tgt.type === 'turret';
  });
}
// srcNid 에서 나온 신호가 nid 의 port 번 입력으로 흘러드는가.
// 래치의 RESET(포트 1)에 타이머가 실제로 물렸는지 보려면 포트를 구별해야 한다.
function feedsPort(g, nid, port, srcNid) {
  if (!g.inLinks) return false;
  var lk = g.inLinks[nid + ':' + port];
  if (!lk) return false;
  if (lk.fn === srcNid) return true;
  // 사이에 AND 같은 노드가 끼어 있을 수 있으니 거슬러 올라간다
  // 변수명을 reachableNodes 와 다르게 둔다 — 같은 줄이 두 곳에 있으면 돌연변이
  // 앵커가 유일하지 않아 그 게이트를 검정할 수 없다(INVALID 로 걸렸다).
  var walked = {}, stack = [lk.fn];
  while (stack.length) {
    var cur = stack.pop();
    if (walked[cur]) continue;
    walked[cur] = 1;
    if (cur === srcNid) return true;
    for (var i = 0; i < g.links.length; i++) {
      if (g.links[i].tn === cur) stack.push(g.links[i].fn);
    }
  }
  return false;
}

function countEntityWhere(type, fn) {
  var n = 0;
  forEachEntity(function (e) { if (e.type === type && fn(e)) n++; });
  return n;
}

// 현재 트랙의 단계 배열
function curSteps() { return tutorial.track === 'adv' ? ADVANCED_STEPS : TUTORIAL_STEPS; }
function trackName() { return tutorial.track === 'adv' ? '심화' : '튜토리얼'; }

// 기초를 끝낸 사람만 심화로 넘어간다. 되돌아가지는 않는다 —
// 기초 진행도를 덮어쓰면 "다 깼는데 다시 10/10 이 아니다"가 되어 후퇴로 읽힌다.
function startAdvanced() {
  if (tutorial.track === 'adv') return false;
  // 기초를 안 끝냈으면 거절한다. 심화는 공장이 이미 돌아가고 있다고 **가정하고**
  // 쓰여 있어서 (제어기·연구소·전력망이 있다는 전제), 빈 판에서 열면 첫 단계부터
  // 막힌다. 버튼은 완료 화면에만 나오지만 저장본 조작이나 훅으로도 못 들어오게 막는다.
  if (!tutorial.done) return false;
  tutorial.track = 'adv';
  tutorial.step = 0;
  tutorial.done = false;
  tutorial.justDone = -1;
  tutorial.on = true;
  return true;
}

// --- 진행 --------------------------------------------------------------------
var tutorTimer = 0;
function stepTutorial(dt) {
  if (!tutorial.on || tutorial.done) return;
  if (tutorial.celebrateT > 0) tutorial.celebrateT -= dt;
  tutorTimer += dt;
  if (tutorTimer < 0.25) return;      // 4Hz 로 충분하다
  tutorTimer = 0;
  var steps = curSteps();
  var s = steps[tutorial.step];
  if (!s) { tutorial.done = true; return; }
  var ok = false;
  try { ok = !!s.check(); } catch (e) { logError('tutorial:' + s.id, e); }
  if (!ok) return;
  tutorial.justDone = tutorial.step;
  tutorial.celebrateT = 2.2;
  tutorial.step++;
  if (tutorial.step >= steps.length) {
    tutorial.done = true;
    if (typeof toast === 'function') {
      toast(tutorial.track === 'adv'
        ? '심화 과정 완료 — 공장이 스스로 판단한다'
        : '튜토리얼 완료 — 이제 공장은 당신 것이다', 'good');
    }
  } else if (typeof toast === 'function') {
    toast('✔ ' + s.title, 'good');
  }
  renderTutorial();
}

// 건너뛰기는 "이 단계를 안 하고 넘어간다" — 튜토리얼 자체를 끄는 것과 다르다.
// step 은 총 단계 수를 넘지 않게 고정한다 (넘게 두면 진행 표시가 24/9 처럼 나온다).
function skipTutorialStep() {
  if (tutorial.done) return tutorial.step;
  var n = curSteps().length;
  tutorial.step++;
  if (tutorial.step >= n) {
    tutorial.step = n;
    tutorial.done = true;
  }
  return tutorial.step;
}

function resetTutorial(on) {
  tutorial.on = on !== false;
  tutorial.track = 'basic';
  tutorial.step = 0;
  tutorial.done = false;
  tutorial.flags = {};
  tutorial.justDone = -1;
  tutorial.celebrateT = 0;
  tutorTimer = 0;
  resetProdStats();
}

// --- 패널 --------------------------------------------------------------------
function renderTutorial() {
  var host = document.getElementById('tutor');
  if (!host) return;
  if (!tutorial.on) { host.style.display = 'none'; return; }
  host.style.display = 'block';

  var body = document.getElementById('tutorBody');
  var head = document.getElementById('tutorHead');
  var foot = document.getElementById('tutorFoot');
  var steps = curSteps();
  var n = steps.length;

  if (tutorial.done) {
    head.textContent = trackName() + ' — 완료 ' + n + '/' + n;
    if (foot) foot.style.display = 'none';
    if (tutorial.track === 'basic') {
      body.innerHTML =
        '<div class="ok" style="font-weight:600;margin-bottom:6px">전부 끝냈다.</div>' +
        '<div class="dim" style="font-size:11.5px;line-height:1.6;margin-bottom:8px">' +
        '공장 짓는 법은 익혔다. 남은 것은 <b>공장이 스스로 판단하게 만드는 일</b>이다.<br>' +
        '심화 과정 8단계는 두 가지를 가르친다 — 전기가 모자랄 때 <b>덜 급한 라인부터 끊는 것</b>(부하 차단)과, ' +
        '<b>적의 습격을 막는 것</b>. 둘 다 순진하게 하면 실패하고, 왜 실패하는지를 직접 보게 한다.</div>' +
        '<button id="tutorAdv" style="width:100%">심화 과정 시작 — 부하 차단과 방어</button>';
      var ab = document.getElementById('tutorAdv');
      if (ab) ab.onclick = function () { startAdvanced(); renderTutorial(); };
    } else {
      body.innerHTML =
        '<div class="ok" style="font-weight:600;margin-bottom:6px">심화까지 끝냈다.</div>' +
        '<div class="dim" style="font-size:11.5px;line-height:1.6">' +
        '이제 가르칠 것이 없다. 남은 것은 당신이 정한다 — 되먹임을 어디에 걸지, 무엇을 먼저 끊을지, ' +
        '얼마나 크게 지을지. 오염은 생산에 비례하고 적은 오염을 따라오므로, ' +
        '<b>덜 만드는 것이 정답인 순간</b>이 반드시 온다. H로 도움말을 볼 수 있다.</div>';
    }
    return;
  }
  if (foot) foot.style.display = '';

  // step 이 배열을 넘어서면 여기서 s 가 undefined 가 되어 패널이 통째로 죽는다
  // (돌연변이 시험이 실제로 이 경로를 밟아 드라이버를 죽였다). 지금 코드로는 그런
  // step 이 나올 수 없지만, 저장본 손상이나 트랙 계산 실수 한 번이면 나온다.
  if (tutorial.step >= n) { tutorial.step = n; tutorial.done = true; renderTutorial(); return; }

  head.textContent = trackName() + ' ' + (tutorial.step + 1) + '/' + n;
  var s = steps[tutorial.step];
  var lines = [];
  // 지나온 단계는 접어서 성취감만 남긴다
  if (tutorial.step > 0) {
    lines.push('<div class="tdone">');
    for (var i = 0; i < tutorial.step; i++) {
      lines.push('<span class="tchk">✔</span> ' + steps[i].title + '<br>');
    }
    lines.push('</div>');
  }
  lines.push('<div class="tnow">' + s.title + '</div>');
  lines.push('<div class="twhy">' + s.why + '</div>');
  // how 는 한 줄에 하나씩 — 문단으로 붙여 놓으면 읽지 않는다
  lines.push('<ol class="thow">');
  for (var h = 0; h < s.how.length; h++) lines.push('<li>' + s.how[h] + '</li>');
  lines.push('</ol>');
  if (s.need) lines.push('<div class="tneed">' + s.need + '</div>');
  body.innerHTML = lines.join('');
}

function bindTutorial() {
  var sk = document.getElementById('tutorSkip');
  var cl = document.getElementById('tutorClose');
  if (sk) sk.onclick = function () { skipTutorialStep(); renderTutorial(); };
  if (cl) cl.onclick = function () { tutorial.on = false; renderTutorial(); };
  var re = document.getElementById('tutorBtn');
  if (re) re.onclick = function () {
    if (!tutorial.on) { tutorial.on = true; renderTutorial(); return; }
    resetTutorial(true); renderTutorial();
  };
}

// ===========================================================================
//  55_logicui.js — 노드 그래프 편집기 (DOM 노드 + SVG 배선)
//
//  캔버스에 직접 그리지 않고 DOM 을 쓴다 — 노드 안에 <select>/<input> 이 들어가야
//  설정이 편하고, 링크만 SVG 로 그리면 곡선도 공짜다.
// ===========================================================================

var logicOpen = false;
var curCtrl = null;
var gpan = { x: 60, y: 40, z: 1 };
var linking = null;         // { nid, port } — 출력 포트에서 끌기 시작
var liveTimer = null;

function openLogic(e) {
  var switching = (curCtrl !== e);
  curCtrl = e;
  logicOpen = true;
  if (!e.graph) e.graph = newGraph();
  // **다른 제어기를 열면 화면을 처음으로 되돌린다.** 예전에는 이전 제어기에서
  // 끌어다 놓은 위치가 그대로 남아, 노드가 있는데도 빈 화면만 보였다.
  if (switching) { gpan.x = 20; gpan.y = 20; gpan.z = 1; }
  document.getElementById('logic').style.display = 'block';
  document.getElementById('ctrlName').textContent = '#' + e.id;
  tutorial.flags.openedEditor = true;    // 상태로는 못 보는 사건이라 여기서 표시한다
  renderPalette();
  renderGraph();
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(updateLive, 140);
}
function closeLogic() {
  logicOpen = false;
  document.getElementById('logic').style.display = 'none';
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  curCtrl = null;
  linking = null;
}
// 철거된 엔티티가 지금 편집 중인 제어기면 편집기를 닫는다 (25_entity.js 가 부른다)
function closeLogicIfEditing(id) {
  if (logicOpen && curCtrl && curCtrl.id === id) {
    closeLogic();
    toast('편집 중이던 제어기가 철거되어 편집기를 닫았다', 'bad');
  }
}

// --- 팔레트 ------------------------------------------------------------------
function renderPalette() {
  var host = document.getElementById('pal');
  if (!host) return;
  var cats = [['in', '입력 — 공장을 읽는다'], ['op', '연산 — 판단한다'], ['out', '출력 — 공장을 움직인다']];
  var h = [];
  for (var c = 0; c < cats.length; c++) {
    h.push('<div class="pcat">' + cats[c][1] + '</div>');
    for (var i = 0; i < NODE_KINDS.length; i++) {
      var k = NODE_KINDS[i], d = NODE_DEFS[k];
      if (d.cat !== cats[c][0]) continue;
      var lock = !nodeAvailable(k);
      h.push('<div class="pitem' + (lock ? ' locked' : '') + '" data-k="' + k + '" title="' +
        (lock ? TECHS[d.tech].name + ' 연구 필요' : '클릭해서 추가') + '">' +
        d.label + (lock ? ' 🔒' : '') + '</div>');
    }
  }
  host.innerHTML = h.join('');
  var items = host.querySelectorAll('.pitem');
  for (var j = 0; j < items.length; j++) {
    items[j].onclick = (function (kind) {
      return function () {
        if (!nodeAvailable(kind)) { toast(TECHS[NODE_DEFS[kind].tech].name + ' 연구가 필요하다', 'bad'); return; }
        var wrap = document.getElementById('graphWrap');
        var nx = (wrap.clientWidth / 2 - gpan.x) / gpan.z + (curCtrl.graph.nodes.length % 4) * 14;
        var ny = (wrap.clientHeight / 2 - gpan.y) / gpan.z + (curCtrl.graph.nodes.length % 5) * 16;
        graphAddNode(curCtrl.graph, kind, Math.max(10, nx - 89), Math.max(10, ny - 40));
        renderGraph();
      };
    })(items[j].getAttribute('data-k'));
  }
}

// --- 그래프 렌더 -------------------------------------------------------------
function applyPan() {
  var inner = document.getElementById('graphInner');
  inner.style.transform = 'translate(' + gpan.x + 'px,' + gpan.y + 'px) scale(' + gpan.z + ')';
}

function renderGraph() {
  // 컴파일은 updateLinks 한 곳에서만 한다(여기서도 하면 중복이고, 두 곳에 같은
  // 방어가 있으면 한쪽을 깨뜨려도 다른 쪽이 가려 게이트를 검정할 수 없다).
  var inner = document.getElementById('graphInner');
  if (!inner || !curCtrl) return;
  var g = curCtrl.graph;
  // 기존 노드 DOM 제거 (svg 는 남긴다)
  var old = inner.querySelectorAll('.node');
  for (var i = 0; i < old.length; i++) inner.removeChild(old[i]);

  for (var n = 0; n < g.nodes.length; n++) buildNodeDom(inner, g, g.nodes[n]);
  applyPan();
  updateLinks();
  updateCycleInfo(g);
}

// 제어기가 전력망 밖이면 [전력 만족도] 노드가 **영원히 0** 을 낸다 (netSatOf 는
// net<0 에 0 을 돌려준다). 제어기는 전기를 안 쓰므로 전주 밖에 놓기 쉬운데,
// 그러면 부하 차단 회로 전체가 조용히 죽고 화면에는 아무 단서도 없다.
// 측정 하네스가 실제로 이 함정에 걸려 "발진 0회"라는 거짓 결론을 냈다.
function updateCycleInfo(g) {
  var el = document.getElementById('cycleInfo');
  if (!el) return;
  var txt = g.nodes.length + '노드 · ' + g.links.length + '배선' +
            (g.cycles ? ' · 되먹임 ' + g.cycles + '개(1틱 지연)' : '');
  var offGrid = false;
  for (var i = 0; i < g.nodes.length; i++) {
    if (g.nodes[i].kind === 'power') { offGrid = !!curCtrl && curCtrl.net < 0; break; }
  }
  el.innerHTML = offGrid
    ? txt + ' · <b class="bad">이 제어기가 전력망 밖이다 — 만족%가 0으로 읽힌다. 전주 범위 안으로 옮겨라</b>'
    : txt;
}

// --- 출력 노드의 "지금 무슨 일을 하는가" -------------------------------------
// 이 게임에서 가장 자주 걸리는 함정: [기계 가동/정지]의 입력 포트는 **가동** 이다.
// 신호가 참이면 "돌려라" 다. 그래서 '재고 과다' 같은 조건을 그대로 물리면
// "재고 과다일 때 돌려라" 가 되어 의도와 정반대가 된다. 나도, 사용자도 똑같이
// 여기서 틀렸다 — 두 사람이 같은 자리에서 걸렸으면 이름 탓이다.
// 그래서 노드가 **지금 실제로 하는 일**을 스스로 말하게 한다. 배선하는 순간
// 뜻이 뒤집혔는지 보인다. 게이트·필터·사격허가도 같은 함정이 있어 같이 다룬다.
function entName(id) {
  var e = entities[id];
  if (!e) return null;
  return BUILDINGS[e.type].name + ' #' + e.id;
}
function outputMeaning(g, n) {
  var d = NODE_DEFS[n.kind];
  if (d.cat !== 'out') return null;
  var fed = !!g.inLinks && !!g.inLinks[n.nid + ':0'];
  var v = readIn(g, n, 0);
  var on = truthy(v);
  var who = (n.kind === 'lamp' || n.kind === 'display') ? null : entName(n.cfg.ent);

  // 대상이 없으면 이 노드는 장식이다. 이것이 "배선했는데 아무 반응이 없다" 의 정체다.
  if (n.kind !== 'lamp' && n.kind !== 'display' && !who) {
    return { bad: true, text: '대상이 비어 있다 — 배선해도 아무 일도 하지 않는다' };
  }
  if (!fed) {
    return { bad: true, text: '입력이 안 물렸다 — 늘 ' +
      (n.kind === 'enable' ? '멈춤' : n.kind === 'gate' ? '닫힘' :
       n.kind === 'fire' ? '사격 금지' : n.kind === 'filter' ? '0일 때 품목' : '꺼짐') + ' 으로 본다' };
  }
  var now = on ? '참' : '거짓';
  switch (n.kind) {
    case 'enable':
      return { bad: false, text: '지금 ' + now + ' → ' + who + ' 를 ' +
                                 (on ? '돌린다' : '멈춘다') };
    case 'gate':
      return { bad: false, text: '지금 ' + now + ' → ' + who + ' 가 ' +
                                 (on ? '열린다' : '닫힌다') };
    case 'fire':
      return { bad: false, text: '지금 ' + now + ' → ' + who + ' ' +
                                 (on ? '사격 허가' : '사격 금지') };
    case 'filter': {
      var pick = on ? n.cfg.b : n.cfg.a;
      return { bad: false, text: '지금 ' + now + ' → ' + who + ' 가 ' +
        (pick ? ITEMS[pick].name + ' 만 집는다' : '아무거나 집는다') };
    }
    case 'lamp':
      return { bad: false, text: '지금 ' + now + ' → 경보 ' + (on ? '켜짐' : '꺼짐') };
    case 'display':
      return { bad: false, text: '지금 값 ' + fmt(v, 2) };
  }
  return null;
}

function buildNodeDom(inner, g, n) {
  var d = NODE_DEFS[n.kind];
  var el = document.createElement('div');
  el.className = 'node ' + d.cat;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  el.setAttribute('data-nid', String(n.nid));

  var head = document.createElement('div');
  head.className = 'nhead';
  head.innerHTML = '<span>' + d.label + '</span><span class="x" title="삭제">✕</span>';
  el.appendChild(head);

  var bodyEl = document.createElement('div');
  bodyEl.className = 'nbody';

  // 설정 필드
  for (var c = 0; c < d.cfg.length; c++) {
    var cf = d.cfg[c];
    var row = document.createElement('div');
    row.className = 'nrow';
    var lab = document.createElement('label');
    lab.textContent = cf.label;
    row.appendChild(lab);
    if (cf.t === 'num') {
      var inp = document.createElement('input');
      inp.type = 'number'; inp.value = n.cfg[cf.k];
      inp.style.width = '58px';
      inp.oninput = (function (node, key, el2) { return function () { node.cfg[key] = parseFloat(el2.value) || 0; }; })(n, cf.k, inp);
      row.appendChild(inp);
    } else if (cf.t === 'opsel') {
      var sel = document.createElement('select');
      for (var o = 0; o < cf.opts.length; o++) {
        var op = document.createElement('option');
        op.value = cf.opts[o]; op.textContent = cf.opts[o];
        if (n.cfg[cf.k] === cf.opts[o]) op.selected = true;
        sel.appendChild(op);
      }
      sel.onchange = (function (node, key, el2) { return function () { node.cfg[key] = el2.value; }; })(n, cf.k, sel);
      row.appendChild(sel);
    } else if (cf.t === 'item') {
      var isel = document.createElement('select');
      var none = document.createElement('option'); none.value = ''; none.textContent = '— 전체 —';
      isel.appendChild(none);
      for (var ii = 0; ii < ITEM_IDS.length; ii++) {
        var io = document.createElement('option');
        io.value = ITEM_IDS[ii]; io.textContent = ITEMS[ITEM_IDS[ii]].name;
        if (n.cfg[cf.k] === ITEM_IDS[ii]) io.selected = true;
        isel.appendChild(io);
      }
      isel.onchange = (function (node, key, el2) { return function () { node.cfg[key] = el2.value || null; }; })(n, cf.k, isel);
      row.appendChild(isel);
    } else if (cf.t === 'text') {
      var tin = document.createElement('input');
      tin.type = 'text'; tin.value = n.cfg[cf.k] || '';
      tin.oninput = (function (node, key, el2) { return function () { node.cfg[key] = el2.value; }; })(n, cf.k, tin);
      row.appendChild(tin);
    } else if (cf.t === 'ent') {
      var btn = document.createElement('button');
      btn.className = 'entbtn';
      var te = entities[n.cfg[cf.k]];
      btn.textContent = te ? (BUILDINGS[te.type].name + ' #' + te.id) : '지정 안 됨 ▸';
      if (!te) btn.style.color = 'var(--stop)';
      btn.onclick = (function (node, key, filter) {
        return function () { startPick(curCtrl.id, node.nid, key, filter); };
      })(n, cf.k, cf.filter);
      row.appendChild(btn);
    }
    bodyEl.appendChild(row);
  }

  // 포트
  var ports = document.createElement('div');
  ports.className = 'ports';
  var cin = document.createElement('div'); cin.className = 'pcol i';
  for (var pi = 0; pi < d.ins.length; pi++) {
    var pr = document.createElement('div'); pr.className = 'port in';
    var dot = document.createElement('div'); dot.className = 'dot';
    dot.setAttribute('data-in', String(pi));
    var nm = document.createElement('span'); nm.textContent = d.ins[pi];
    pr.appendChild(dot); pr.appendChild(nm);
    cin.appendChild(pr);
  }
  var cout = document.createElement('div'); cout.className = 'pcol o';
  for (var po = 0; po < d.outs.length; po++) {
    var pr2 = document.createElement('div'); pr2.className = 'port out';
    var dot2 = document.createElement('div'); dot2.className = 'dot';
    dot2.setAttribute('data-out', String(po));
    var nm2 = document.createElement('span'); nm2.textContent = d.outs[po];
    var pv = document.createElement('span'); pv.className = 'pv'; pv.setAttribute('data-pv', n.nid + ':' + po);
    pv.textContent = '0';
    pr2.appendChild(dot2); pr2.appendChild(nm2); pr2.appendChild(pv);
    cout.appendChild(pr2);
  }
  ports.appendChild(cin); ports.appendChild(cout);
  bodyEl.appendChild(ports);
  // 출력 노드는 자기가 지금 하는 일을 한 줄로 말한다 (updateLive 가 매 140ms 갱신)
  if (d.cat === 'out') {
    var mrow = document.createElement('div');
    mrow.className = 'nmean';
    mrow.setAttribute('data-mean', String(n.nid));
    bodyEl.appendChild(mrow);
  }
  el.appendChild(bodyEl);
  inner.appendChild(el);

  // --- 상호작용 ---
  head.querySelector('.x').onclick = function (ev) {
    ev.stopPropagation();
    graphRemoveNode(g, n.nid);
    renderGraph();
  };
  head.onmousedown = function (ev) {
    ev.preventDefault(); ev.stopPropagation();
    var sx = ev.clientX, sy = ev.clientY, ox = n.x, oy = n.y;
    function mv(e2) {
      n.x = Math.max(0, ox + (e2.clientX - sx) / gpan.z);
      n.y = Math.max(0, oy + (e2.clientY - sy) / gpan.z);
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
      // **좌표가 곧 평가 순서다.** dirty 를 안 세우면 옮겨도 순서가 그대로라,
      // 도움말이 약속한 "보이는 배치가 규칙"이 거짓이 된다 — 되먹임 점선도
      // 옛 순서 그대로 남는다. 이 파일에서 dirty 를 쓰는 곳은 여기뿐이었다(읽기만).
      g.dirty = true;
      updateLinks();
    }
    function up() { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); }
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  };
  // 터치로도 노드를 끌 수 있어야 한다. 마우스 경로와 **같은 계산**을 쓰되 좌표만
  // 손가락에서 가져온다 — 따로 계산하면 배율(gpan.z)이 걸린 상태에서 어긋난다.
  head.addEventListener('touchstart', function (ev) {
    ev.preventDefault(); ev.stopPropagation();
    var t0 = ev.touches[0]; if (!t0) return;
    var sx = t0.clientX, sy = t0.clientY, ox = n.x, oy = n.y;
    function tmv(e2) {
      var t = e2.touches[0]; if (!t) return;
      e2.preventDefault();
      n.x = Math.max(0, ox + (t.clientX - sx) / gpan.z);
      n.y = Math.max(0, oy + (t.clientY - sy) / gpan.z);
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
      g.dirty = true;                 // 마우스 경로와 같은 이유 (좌표 = 평가 순서)
      updateLinks();
    }
    function tup() {
      window.removeEventListener('touchmove', tmv);
      window.removeEventListener('touchend', tup);
      window.removeEventListener('touchcancel', tup);
    }
    window.addEventListener('touchmove', tmv, { passive: false });
    window.addEventListener('touchend', tup);
    window.addEventListener('touchcancel', tup);
  }, { passive: false });
  // **행 전체를 배선 표적으로 만든다.** 예전에는 9x9px 도트에만 핸들러가 붙어
  // 있었는데 CSS 는 .port 행 전체에 crosshair 커서를 주고 hover 로 도트를
  // 강조했다 — 살아 있는 폭이 41% 뿐이라 이름표에 떨구면 조용히 실패했다.
  // 폰에서는 9 CSS px 를 손가락으로 맞춰야 했다.
  var outRows = el.querySelectorAll('.port.out');
  for (var orI = 0; orI < outRows.length; orI++) {
    var odt = outRows[orI].querySelector('[data-out]');
    if (odt) outRows[orI].setAttribute('data-out', odt.getAttribute('data-out'));
  }
  var inRows = el.querySelectorAll('.port.in');
  for (var irI = 0; irI < inRows.length; irI++) {
    var idt = inRows[irI].querySelector('[data-in]');
    if (idt) inRows[irI].setAttribute('data-in', idt.getAttribute('data-in'));
  }
  var outs = el.querySelectorAll('.port.out[data-out]');
  for (var k = 0; k < outs.length; k++) {
    outs[k].onmousedown = (function (nid, port) {
      return function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        linking = { nid: nid, port: port };
      };
    })(n.nid, parseInt(outs[k].getAttribute('data-out'), 10));
    // 터치: touchend 는 **손가락을 올린 요소가 아니라 시작한 요소**로 간다.
    // 그래서 입력 포트의 mouseup 을 기다리면 영원히 안 온다 — 뗀 좌표에서
    // elementFromPoint 로 직접 찾는다. 이 게임의 본체가 배선이라 여기가 막히면
    // 폰에서는 게임이 성립하지 않는다.
    outs[k].addEventListener('touchstart', (function (nid, port) {
      return function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        linking = { nid: nid, port: port };
        function tmv(e2) {
          var t = e2.touches[0]; if (!t || !linking) return;
          e2.preventDefault();
          var r = document.getElementById('graphWrap').getBoundingClientRect();
          updateLinks({ x: (t.clientX - r.left - gpan.x) / gpan.z,
                        y: (t.clientY - r.top - gpan.y) / gpan.z });
        }
        function tup(e2) {
          window.removeEventListener('touchmove', tmv);
          window.removeEventListener('touchend', tup);
          window.removeEventListener('touchcancel', tup);
          var t = (e2.changedTouches && e2.changedTouches[0]) || null;
          if (t && linking) {
            var el2 = document.elementFromPoint(t.clientX, t.clientY);
            var dot = el2 && el2.closest ? el2.closest('[data-in]') : null;
            var host = dot && dot.closest ? dot.closest('.node') : null;
            if (dot && host) {
              var toNid = parseInt(host.getAttribute('data-nid'), 10);
              var toPort = parseInt(dot.getAttribute('data-in'), 10);
              if (!graphLink(curCtrl.graph, linking.nid, linking.port, toNid, toPort)) {
                toast('자기 자신에는 연결할 수 없다', 'bad');
              }
            }
          }
          linking = null; renderGraph();
        }
        window.addEventListener('touchmove', tmv, { passive: false });
        window.addEventListener('touchend', tup);
        window.addEventListener('touchcancel', tup);
      };
    })(n.nid, parseInt(outs[k].getAttribute('data-out'), 10)), { passive: false });
  }
  var ins = el.querySelectorAll('.port.in[data-in]');
  for (var m = 0; m < ins.length; m++) {
    ins[m].onmouseup = (function (nid, port) {
      return function (ev) {
        ev.stopPropagation();
        if (linking) {
          if (!graphLink(curCtrl.graph, linking.nid, linking.port, nid, port)) toast('자기 자신에는 연결할 수 없다', 'bad');
          linking = null; renderGraph();
        }
      };
    })(n.nid, parseInt(ins[m].getAttribute('data-in'), 10));
    ins[m].onclick = (function (nid, port) {
      return function (ev) {
        ev.stopPropagation();
        if (linking) return;
        graphUnlink(curCtrl.graph, nid, port);
        renderGraph();
      };
    })(n.nid, parseInt(ins[m].getAttribute('data-in'), 10));
  }
}

// --- 배선(SVG) ---------------------------------------------------------------
function portPos(nid, port, isOut) {
  var inner = document.getElementById('graphInner');
  var el = inner.querySelector('.node[data-nid="' + nid + '"]');
  if (!el) return null;
  var dot = el.querySelector(isOut ? '[data-out="' + port + '"]' : '[data-in="' + port + '"]');
  if (!dot) return null;
  return { x: el.offsetLeft + dot.offsetLeft + dot.offsetWidth / 2,
           y: el.offsetTop + dot.offsetTop + dot.offsetHeight / 2 };
}
function updateLinks(tempTo) {
  // **그리기 전에 컴파일한다.** back 플래그는 graphCompile 이 세우므로, 더러운
  // 그래프를 그대로 그리면 '되먹임 점선' 이 한 편집 전 상태로 나온다 —
  // 방금 만든 되먹임 배선이 표시가 안 났다.
  if (curCtrl && curCtrl.graph && curCtrl.graph.dirty) graphCompile(curCtrl.graph);
  var svg = document.getElementById('links');
  if (!svg || !curCtrl) return;
  var g = curCtrl.graph;
  var parts = [];
  for (var i = 0; i < g.links.length; i++) {
    var lk = g.links[i];
    var a = portPos(lk.fn, lk.fp, true), b = portPos(lk.tn, lk.tp, false);
    if (!a || !b) continue;
    var dx = Math.max(28, Math.abs(b.x - a.x) * 0.45);
    var col = lk.back ? '#b23a10' : '#2c5470';
    parts.push('<path d="M' + a.x + ' ' + a.y + ' C' + (a.x + dx) + ' ' + a.y + ',' +
      (b.x - dx) + ' ' + b.y + ',' + b.x + ' ' + b.y + '" fill="none" stroke="' + col +
      '" stroke-width="2"' + (lk.back ? ' stroke-dasharray="6 4"' : '') + '/>');
    parts.push('<circle cx="' + b.x + '" cy="' + b.y + '" r="3" fill="' + col + '"/>');
  }
  if (tempTo && linking) {
    var s = portPos(linking.nid, linking.port, true);
    if (s) {
      parts.push('<path d="M' + s.x + ' ' + s.y + ' L' + tempTo.x + ' ' + tempTo.y +
        '" fill="none" stroke="#b23a10" stroke-width="2" stroke-dasharray="5 4"/>');
    }
  }
  svg.innerHTML = parts.join('');
}

// --- 라이브 값 ---------------------------------------------------------------
function updateLive() {
  if (!logicOpen || !curCtrl) return;
  var g = curCtrl.graph;
  for (var i = 0; i < g.nodes.length; i++) {
    var n = g.nodes[i];
    for (var p = 0; p < n.out.length; p++) {
      var el = document.querySelector('[data-pv="' + n.nid + ':' + p + '"]');
      if (el) {
        // 값은 늘 현재값을 보여준다(거짓말하지 않는다). 펄스형 신호는 그것만으로는
        // 영원히 0 이므로 누적 발화 횟수를 옆에 붙인다.
        var txt = fmt(n.out[p], 1);
        if (n.fires && n.fires[p] > 0) txt += ' ↑' + n.fires[p];
        el.textContent = txt;
      }
    }
  }
  // 활성 배선 강조
  var dots = document.querySelectorAll('.dot[data-out]');
  for (var k = 0; k < dots.length; k++) {
    var host = dots[k].closest ? dots[k].closest('.node') : null;
    if (!host) continue;
    var nid = parseInt(host.getAttribute('data-nid'), 10);
    var nn = graphNode(g, nid);
    var port = parseInt(dots[k].getAttribute('data-out'), 10);
    // **1틱 펄스는 값 표본으로 못 잡는다** — 폭 16.7ms 에 표본 주기 140ms 다.
    // 그래서 값이 아니라 '지난 갱신 이후 몇 번 올라갔는가' 로도 켠다.
    var lit = false;
    if (nn) {
      lit = truthy(nn.out[port]);
      if (!lit && nn.fires) {
        if (!nn._uiFires) nn._uiFires = [];
        var seenN = nn._uiFires[port] || 0;
        if (nn.fires[port] > seenN) lit = true;
        nn._uiFires[port] = nn.fires[port];
      }
    }
    if (lit) dots[k].classList.add('on'); else dots[k].classList.remove('on');
  }
  // 출력 노드의 해석 줄 — 값이 바뀌면 문장도 바뀐다
  var means = document.querySelectorAll('[data-mean]');
  for (var m = 0; m < means.length; m++) {
    var mn = graphNode(g, parseInt(means[m].getAttribute('data-mean'), 10));
    if (!mn) continue;
    var info = outputMeaning(g, mn);
    if (!info) { means[m].textContent = ''; continue; }
    means[m].textContent = info.text;
    means[m].classList.toggle('bad', !!info.bad);
  }
  updateCycleInfo(g);
}

// --- 화면 이동/확대 ----------------------------------------------------------
function bindLogicPane() {
  var wrap = document.getElementById('graphWrap');
  wrap.addEventListener('mousedown', function (ev) {
    if (ev.button !== 0) return;
    if (ev.target !== wrap && ev.target.id !== 'links' && ev.target.id !== 'graphInner') return;
    wrap.classList.add('panning');
    var sx = ev.clientX, sy = ev.clientY, ox = gpan.x, oy = gpan.y;
    function mv(e2) { gpan.x = ox + (e2.clientX - sx); gpan.y = oy + (e2.clientY - sy); applyPan(); }
    function up() {
      wrap.classList.remove('panning');
      window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up);
    }
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });
  wrap.addEventListener('mousemove', function (ev) {
    if (!linking) return;
    var r = wrap.getBoundingClientRect();
    updateLinks({ x: (ev.clientX - r.left - gpan.x) / gpan.z, y: (ev.clientY - r.top - gpan.y) / gpan.z });
  });
  window.addEventListener('mouseup', function () {
    if (linking) { linking = null; updateLinks(); }
  });
  // 편집기 화면도 손가락으로 움직이고 확대해야 한다 (휠은 폰에 없다)
  var gt = { mode: null, lx: 0, ly: 0, d: 0, cx: 0, cy: 0 };
  wrap.addEventListener('touchstart', function (ev) {
    if (ev.target !== wrap && ev.target.id !== 'links' && ev.target.id !== 'graphInner') return;
    if (ev.touches.length >= 2) {
      var r0 = wrap.getBoundingClientRect();
      gt.mode = 'pinch';
      gt.d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                        ev.touches[0].clientY - ev.touches[1].clientY);
      gt.cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2 - r0.left;
      gt.cy = (ev.touches[0].clientY + ev.touches[1].clientY) / 2 - r0.top;
    } else {
      gt.mode = 'pan'; gt.lx = ev.touches[0].clientX; gt.ly = ev.touches[0].clientY;
      wrap.classList.add('panning');
    }
    ev.preventDefault();
  }, { passive: false });
  wrap.addEventListener('touchmove', function (ev) {
    if (!gt.mode) return;
    ev.preventDefault();
    if (gt.mode === 'pinch' && ev.touches.length >= 2) {
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      if (gt.d > 0 && d > 0) {
        var before = { x: (gt.cx - gpan.x) / gpan.z, y: (gt.cy - gpan.y) / gpan.z };
        gpan.z = clamp(gpan.z * (d / gt.d), 0.4, 2.2);
        gpan.x = gt.cx - before.x * gpan.z; gpan.y = gt.cy - before.y * gpan.z;
        applyPan(); updateLinks();
      }
      gt.d = d;
      return;
    }
    var t = ev.touches[0]; if (!t) return;
    gpan.x += t.clientX - gt.lx; gpan.y += t.clientY - gt.ly;
    gt.lx = t.clientX; gt.ly = t.clientY;
    applyPan();
  }, { passive: false });
  wrap.addEventListener('touchend', function () { gt.mode = null; wrap.classList.remove('panning'); });
  wrap.addEventListener('touchcancel', function () { gt.mode = null; wrap.classList.remove('panning'); });

  wrap.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var r = wrap.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var before = { x: (mx - gpan.x) / gpan.z, y: (my - gpan.y) / gpan.z };
    gpan.z = clamp(gpan.z * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), 0.4, 2.2);
    gpan.x = mx - before.x * gpan.z; gpan.y = my - before.y * gpan.z;
    applyPan(); updateLinks();
  }, { passive: false });
}

// --- 예제 회로 ---------------------------------------------------------------
// 재고 히스테리시스: 상자 재고 < 하한이면 라인을 켜고, > 상한이면 끈다.
// 비교 하나로 하면 경계에서 덜덜 떨린다(채터링). SR 래치가 그것을 막는다 —
// 제어를 아는 사람이 처음 배선하는 회로이고, 이 게임에서 가장 자주 쓰인다.
function loadExample() {
  if (!curCtrl) return;
  // 기존 그래프를 비우고 새로 깐다. 예전엔 덧붙여서 두 번 누르면 같은 좌표에
  // 노드가 겹쳐 쌓이고 어느 쪽이 배선된 것인지 알 수 없었다.
  // confirm() 같은 블로킹 모달은 쓰지 않는다 — 게임 루프를 세우고, 헤드리스에서는
  // 페이지 자체가 멈춰 검증이 통째로 죽는다(실제로 그렇게 걸렸다). 사후 고지로 대신한다.
  var had = curCtrl.graph.nodes.length;
  curCtrl.graph = newGraph();
  var g = curCtrl.graph;
  var chest = null, asm = null;
  forEachEntity(function (e) {
    if (!chest && e.type === 'chest') chest = e;
    if (!asm && e.type === 'assembler') asm = e;
  });

  var nSense = graphAddNode(g, 'chest', 40, 60);
  nSense.cfg.ent = chest ? chest.id : null;
  var nLo = graphAddNode(g, 'const', 40, 250); nLo.cfg.value = 50;
  var nHi = graphAddNode(g, 'const', 40, 360); nHi.cfg.value = 200;
  var cLo = graphAddNode(g, 'cmp', 260, 90); cLo.cfg.op = '<';
  var cHi = graphAddNode(g, 'cmp', 260, 280); cHi.cfg.op = '>';

  var outNode;
  if (nodeAvailable('latch')) {
    var lat = graphAddNode(g, 'latch', 480, 170);
    graphLink(g, cLo.nid, 0, lat.nid, 0);      // 재고 부족 → SET
    graphLink(g, cHi.nid, 0, lat.nid, 1);      // 재고 충분 → RESET
    outNode = lat;
  } else {
    // 논리 II 이전에는 래치가 없다 — 비교 하나로 임시 배선하고 한계를 알려준다
    outNode = cLo;
    toast('논리 II(기억소자)를 연구하면 SR 래치로 채터링을 없앨 수 있다', 'bad');
  }
  var en = graphAddNode(g, 'enable', 700, 170);
  en.cfg.ent = asm ? asm.id : null;
  graphLink(g, outNode.nid, 0, en.nid, 0);

  var lamp = graphAddNode(g, 'lamp', 700, 300);
  lamp.cfg.label = '재고 부족';
  graphLink(g, cLo.nid, 0, lamp.nid, 0);

  graphLink(g, nSense.nid, 0, cLo.nid, 0);
  graphLink(g, nLo.nid, 0, cLo.nid, 1);
  graphLink(g, nSense.nid, 0, cHi.nid, 0);
  graphLink(g, nHi.nid, 0, cHi.nid, 1);

  renderGraph();
  if (had) toast('기존 배선 ' + had + '개 노드를 예제로 교체했다', 'bad');
  if (!chest || !asm) toast('상자와 조립기를 지어 두면 예제가 대상까지 자동으로 물린다', 'bad');
  else toast('예제 배선 완료 — 상자 #' + chest.id + ' 재고로 조립기 #' + asm.id + ' 를 켜고 끈다', 'good');
}

/* ===================== 60_game.js ===================== */
// ===========================================================================
//  60_game.js — 부팅, 고정 스텝 루프, 저장/불러오기, 테스트 API
//
//  틱 순서에는 이유가 있다:
//    로직 → 전력 → 기계 → 벨트 → 오염 → 적
//  로직이 먼저여야 이번 틱에 "끈" 기계가 이번 틱 전력수요에서 빠진다. 반대로 두면
//  부하 차단이 항상 한 틱 늦게 들어 전력이 덜덜 떨린다.
// ===========================================================================

var gameTime = 0;
var worldSeed = 20260807;
var paused = false;
var gameSpeed = 1;        // 시험/녹화용 배속 (1 = 실시간)
var lastFrame = 0;
var accumulator = 0;
var uiTimer = 0, miniTimer = 0;

function newGame(seed) {
  worldSeed = (seed === undefined || seed === null) ? worldSeed : (seed >>> 0);
  entities = {}; entOrder = []; nextEntId = 1;
  inventory = {}; techDone = {}; currentResearch = null; researchProgress = 0;
  researchProgressBy = {};
  beltSpeedMul = 1; machineSpeedMul = 1; machinePowerMul = 1; powerCheatOn = false;
  gameTime = 0; accumulator = 0; handCraftCount = 0; handQueue.length = 0;
  enemies.length = 0; corpses.length = 0; turretFx.length = 0;
  resetEvolution();          // 진화도는 증분 누적이라 기준점까지 같이 되돌려야 한다
  waveStats.spawned = 0; waveStats.killed = 0; waveStats.buildingsLost = 0;
  waveStats.lost.length = 0;
  waveStats.waves = 0; waveStats.lastWaveT = 0;
  beltStats.delivered = 0;
  ERRORS.length = 0;
  alarms.length = 0; displays.length = 0;

  generateWorld(worldSeed);
  spawnNests(worldSeed);
  treeCensusDone = false;
  for (var k in START_INV) inventory[k] = START_INV[k];

  resetTutorial(tutorial ? tutorial.on : true);   // 껐다면 새 판에서도 꺼진 채로 둔다
  markBeltDirty(); markPowerDirty(); markLogicDirty();
  rebuildPower();

  // 콜드 스타트 해소 — 전기가 없으면 아무것도 못 돌리고, 발전기에 연료를 넣으려면
  // 인서터가 필요한데 인서터도 전기가 필요하다. 그래서 시작 발전기 한 대는 켜서 준다.
  var cx = world.spawnX, cy = world.spawnY;
  var gen = placeEntity('generator', cx - 1, cy - 4, 2, true);
  if (gen) gen.fuel = SPEC.coalEnergy * 12;
  placeEntity('pole', cx + 2, cy - 3, 0, true);
  placeEntity('pole', cx + 2, cy + 2, 0, true);
  markPowerDirty(); rebuildPower();

  if (cv) { cam.x = cx; cam.y = cy; cam.z = 1; }
  refreshAllUI();
}

function refreshAllUI() {
  if (typeof document === 'undefined' || !document.getElementById('buildList')) return;
  renderBuildList(); renderInv(); renderCraftList(); renderCraftQueue();
  renderTech(); renderTop(); renderTutorial();
}

// --- 한 틱 -------------------------------------------------------------------
function stepEntities(dt) {
  forEachEntity(function (e) {
    e.anim += dt;
    switch (e.type) {
      case 'miner': guard('miner', function () { stepMiner(e, dt); }); break;
      case 'furnace': guard('furnace', function () { stepCrafter(e, dt, SPEC.furnaceSpeed); }); break;
      case 'assembler': guard('assembler', function () { stepCrafter(e, dt, SPEC.assemblerSpeed); }); break;
      case 'generator': guard('generator', function () { stepGenerator(e, dt); }); break;
      case 'lab': guard('lab', function () { stepLab(e, dt); }); break;
      case 'inserter': guard('inserter', function () { stepInserter(e, dt); }); break;
    }
  });
}

function tick(dt) {
  stepLogic(dt);
  stepPower(dt);
  stepEntities(dt);
  stepHandCraft(dt);      // 손 조립도 시간이 든다 — 기계와 같은 틱에 진행한다
  stepBelts(dt);
  stepPollution(dt);
  absorbByTrees(dt);
  stepNests(dt);
  stepEnemies(dt);
  stepTurrets(dt);
  gameTime += dt;
  beltPhase += dt;
  // 튜토리얼은 세계를 읽기만 한다 — 시뮬레이션에 영향을 주지 않는다(난수도 안 쓴다)
  guard('tutorial', function () { stepTutorial(dt); });
}

// 고정 스텝 — 프레임 시간에 상관없이 시뮬은 항상 TICK 단위로 전진한다.
function advance(elapsed) {
  accumulator += elapsed;
  var steps = 0;
  // 배속을 올리면 한 프레임에 밀 틱 수도 그만큼 늘어야 한다. 상한을 고정해 두면
  // 배속 8 이상에서 시간이 조용히 버려져 "30분 돌렸다" 가 거짓이 된다.
  var cap = MAX_STEPS * Math.max(1, Math.ceil(gameSpeed));
  while (accumulator >= TICK && steps < cap) {
    tick(TICK);
    accumulator -= TICK;
    steps++;
  }
  if (steps >= cap) accumulator = 0;   // 밀린 시간은 버린다 (나선 방지)
  return steps;
}

function frame(now) {
  var elapsed = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  if (!paused) {
    stepCameraKeys(elapsed);
    // 배속은 **녹화·소크 시험 전용**이다. UI 에 노출하지 않는다 — 게임 난이도를
    // 바꾸는 손잡이가 되어 버린다. 시뮬레이션은 여전히 고정 스텝이라 결정성이
    // 유지되고, 배속은 "한 프레임에 몇 틱을 미느냐" 만 바꾼다.
    guard('advance', function () { advance(elapsed * gameSpeed); });
  }
  guard('render', render);
  // 손 조립 대기열은 매 프레임 — 0.2초 주기로 그리면 0.5초짜리 레시피의 진행
  // 막대가 두 칸만 움직여 "멈춘 것"처럼 보인다. 줄이 그대로면 폭만 고치므로 싸다.
  guard('cqueue', renderCraftQueue);

  uiTimer += elapsed;
  if (uiTimer > 0.2) {
    uiTimer = 0;
    guard('ui', function () {
      renderTop(); renderAlarms(); renderInv(); renderCraftList(); refreshInsp();
      if (document.getElementById('tech').style.display === 'block') renderTech();
    });
  }
  miniTimer += elapsed;
  if (miniTimer > 0.35) { miniTimer = 0; guard('mini', renderMini); }
  requestAnimationFrame(frame);
}

// --- 저장 / 불러오기 ---------------------------------------------------------
function b64enc(u8) {
  var s = '', chunk = 0x8000;
  for (var i = 0; i < u8.length; i += chunk) {
    s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + chunk, u8.length)));
  }
  return btoa(s);
}
function b64dec(str) {
  var bin = atob(str), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function serializeEntity(e) {
  var o = { id: e.id, t: e.type, x: e.tx, y: e.ty, d: e.dir, hp: e.hp,
            pe: e.playerEnabled, pf: e.playerFilter, inv: e.inv, out: e.out,
            rec: e.recipe, prog: e.progress };
  if (e.type === 'generator') o.fuel = e.fuel;
  if (e.type === 'furnace' && e.lastRecipe) o.lrec = e.lastRecipe;   // 굽던 것의 기억
  if (e.type === 'turret') o.ammo = e.ammo;
  if (e.type === 'splitter') o.prio = e.outPrio;
  if (e.type === 'lab') o.res = e.researching;
  if (e.type === 'inserter') { o.ph = e.phase; o.tt = e.t; o.held = e.held; }
  if (e.type === 'controller' && e.graph) {
    o.g = {
      nextNid: e.graph.nextNid,
      nodes: e.graph.nodes.map(function (n) {
        // o/p = 레지스터 값(현재/직전). 이걸 빼면 불러오기 때 래치가 전부 풀린다.
        return { nid: n.nid, k: n.kind, x: n.x, y: n.y, cfg: n.cfg, st: n.state,
                 o: n.out.slice(), p: n.prev.slice() };
      }),
      links: e.graph.links.map(function (l) { return [l.fn, l.fp, l.tn, l.tp]; })
    };
  }
  if (e.cells) {
    o.cells = e.cells.map(function (c) {
      return { l0: c.lanes[0].map(function (i) { return [i.id, Math.round(i.pos * 1000)]; }),
               l1: c.lanes[1].map(function (i) { return [i.id, Math.round(i.pos * 1000)]; }) };
    });
  }
  return o;
}

function saveGame() {
  var data = {
    v: VERSION, seed: worldSeed, t: gameTime,
    inv: inventory, tech: techDone, res: currentResearch, resP: researchProgress,
    resBy: researchProgressBy,      // 갈아탄 연구의 진행도 — 없으면 불러올 때 도로 0이 된다
    // 손 조립 대기열도 저장한다. 재료는 예약할 때 이미 빠졌으므로, 안 담으면
    // 저장 한 번이 만들던 것을 통째로 태운다 (되돌릴 방법이 없다).
    hand: handQueue.map(function (j) { return [j.rid, j.left]; }),
    ore: b64enc(new Uint8Array(world.oreAmt.buffer.slice(0))),
    oreT: b64enc(world.ore),
    tree: b64enc(world.tree),
    poll: b64enc(new Uint8Array(world.poll.buffer.slice(0))),
    totalPoll: world.totalPollution,
    mined: world.minedTotal,
    ents: entOrder.map(function (id) { return serializeEntity(entities[id]); }),
    nextId: nextEntId,
    nests: nests.map(function (n) { return [n.x, n.y, n.hp, n.absorbed, n.cool, n.seed]; }),
    enemies: enemies.map(function (e) { return [Math.round(e.x * 100), Math.round(e.y * 100), e.hp, e.tier]; }),
    evo: evolution, ws: waveStats,
    tut: { on: tutorial.on, track: tutorial.track, step: tutorial.step, done: tutorial.done, flags: tutorial.flags },
    prod: { smelted: prodStats.smelted, crafted: prodStats.crafted, byRecipe: prodStats.byRecipe }
  };
  try {
    localStorage.setItem('logic-foundry-save', JSON.stringify(data));
    toast('저장 완료', 'good');
    return true;
  } catch (e) { logError('save', e); toast('저장 실패: ' + e, 'bad'); return false; }
}

function loadGame(raw) {
  var data;
  try { data = typeof raw === 'string' ? JSON.parse(raw) : JSON.parse(localStorage.getItem('logic-foundry-save')); }
  catch (e) { toast('저장된 게임이 없다', 'bad'); return false; }
  if (!data) { toast('저장된 게임이 없다', 'bad'); return false; }
  // 현재 판을 부수기 **전에** 저장본을 검사한다. 예전에는 newGame 을 먼저 불러
  // 세계를 지운 뒤에 실패해서, 저장본도 못 얻고 진행 중이던 공장도 잃었다.
  if (!Array.isArray(data.ents) || typeof data.ore !== 'string' || typeof data.oreT !== 'string' ||
      typeof data.tree !== 'string' || typeof data.poll !== 'string' || data.seed === undefined) {
    toast('저장본 형식이 맞지 않다 — 현재 게임은 그대로 둔다', 'bad');
    return false;
  }
  try {
    newGame(data.seed);
    // newGame 이 심어 둔 시작 키트를 지운다 — 저장본이 진실이다
    var ids = entOrder.slice();
    for (var z = 0; z < ids.length; z++) removeEntity(ids[z], false);
    entities = {}; entOrder = [];

    gameTime = data.t || 0;
    inventory = data.inv || {}; techDone = data.tech || {};
    currentResearch = data.res || null; researchProgress = data.resP || 0;
    researchProgressBy = data.resBy || {};   // 예전 저장본엔 없다 — 빈 채로 두면 그만이다
    handQueue.length = 0;
    if (Array.isArray(data.hand)) {
      for (var hj = 0; hj < data.hand.length; hj++) {
        var hrow = data.hand[hj];
        if (RECIPES[hrow[0]]) handQueue.push({ rid: hrow[0], left: +hrow[1] || 0 });
      }
    }
    if (techDone['belt-2']) beltSpeedMul = 2;
    if (techDone['automation-2']) { machineSpeedMul = 1.5; machinePowerMul = 0.8; }

    world.oreAmt = new Uint16Array(b64dec(data.ore).buffer);
    world.ore.set(b64dec(data.oreT));
    world.tree.set(b64dec(data.tree));
    world.poll = new Float32Array(b64dec(data.poll).buffer);
    world.pollNext = new Float32Array(world.poll.length);
    world.totalPollution = data.totalPoll || 0;
    world.minedTotal = data.mined || 0;      // 물질수지 오라클의 좌변 — 안 되돌리면 무너진다
    treeCensusDone = false;
    world.occ.fill(0);

    // 임시 id 가 저장본 id 와 절대 겹치지 않게 커서를 먼저 올린다.
    // 겹치면 placeEntity 의 entities[id]=e 가 앞서 복원한 엔티티를 덮고,
    // entOrder.indexOf 가 엉뚱한 항목을 잘라내 엔티티가 사라진다 (실측: 20개 → 4개).
    var maxId = 0;
    for (var mi2 = 0; mi2 < data.ents.length; mi2++) {
      if (data.ents[mi2].id > maxId) maxId = data.ents[mi2].id;
    }
    nextEntId = maxId + 1;

    var dropped = [];
    for (var i = 0; i < data.ents.length; i++) {
      var o = data.ents[i];
      var e = placeEntity(o.t, o.x, o.y, o.d, true);
      if (!e) { dropped.push(o.t + '@' + o.x + ',' + o.y); continue; }
      // id 를 저장본과 맞춘다 — 제어기 노드가 id 로 대상을 가리키기 때문
      delete entities[e.id];
      var oi = entOrder.indexOf(e.id); if (oi >= 0) entOrder.splice(oi, 1);
      e.id = o.id; entities[o.id] = e; entOrder.push(o.id);
      setOcc(e.tx, e.ty, e.w, e.h, o.id);
      e.hp = o.hp; e.playerEnabled = o.pe !== false; e.playerFilter = o.pf || null;
      e.filter = e.playerFilter;
      e.inv = o.inv || {}; e.out = o.out || {}; e.recipe = o.rec || null; e.progress = o.prog || 0;
      if (o.lrec) e.lastRecipe = o.lrec;
      if (o.fuel !== undefined) e.fuel = o.fuel;
      if (o.ammo !== undefined) e.ammo = o.ammo;
      if (o.prio !== undefined) e.outPrio = o.prio;
      if (o.res !== undefined) e.researching = o.res;
      if (o.ph !== undefined) { e.phase = o.ph; e.t = o.tt; e.held = o.held || null; }
      if (o.cells && e.cells) {
        for (var cc = 0; cc < e.cells.length && cc < o.cells.length; cc++) {
          e.cells[cc].lanes[0] = o.cells[cc].l0.map(function (p) { return { id: p[0], pos: p[1] / 1000 }; });
          e.cells[cc].lanes[1] = o.cells[cc].l1.map(function (p) { return { id: p[0], pos: p[1] / 1000 }; });
        }
      }
      if (o.g && e.graph) {
        e.graph.nextNid = o.g.nextNid;
        e.graph.nodes = o.g.nodes.map(function (n) {
          var d = NODE_DEFS[n.k];
          if (!d) return null;                     // 모르는 노드 종류는 버리되 전체를 죽이지 않는다
          var nn = { nid: n.nid, kind: n.k, x: n.x, y: n.y, cfg: n.cfg, state: n.st || {}, out: [], prev: [] };
          // 되먹임 간선은 "직전 틱 값"을 읽는 레지스터다. out/prev 를 0 으로 되살리면
          // 불러온 순간 모든 레지스터가 리셋돼 래치가 풀리고 라인이 예상 밖으로 켜진다.
          for (var q = 0; q < d.outs.length; q++) {
            nn.out.push((n.o && n.o[q] !== undefined) ? n.o[q] : 0);
            nn.prev.push((n.p && n.p[q] !== undefined) ? n.p[q] : nn.out[q]);
          }
          return nn;
        }).filter(function (n) { return !!n; });
        var validNid = {};
        for (var vn = 0; vn < e.graph.nodes.length; vn++) validNid[e.graph.nodes[vn].nid] = 1;
        e.graph.links = o.g.links
          .filter(function (l) { return validNid[l[0]] && validNid[l[2]]; })
          .map(function (l) { return { fn: l[0], fp: l[1], tn: l[2], tp: l[3] }; });
        e.graph.dirty = true;
      }
    }
    if (dropped.length) {
      logError('load', '복원하지 못한 엔티티 ' + dropped.length + '건: ' + dropped.slice(0, 8).join(', '));
      toast('경고: 엔티티 ' + dropped.length + '건을 복원하지 못했다', 'bad');
    }
    nextEntId = Math.max(data.nextId || 0, maxId + 1);

    nests.length = 0;
    (data.nests || []).forEach(function (n) {
      nests.push({ x: n[0], y: n[1], hp: n[2], maxHp: 350, absorbed: n[3], cool: n[4], seed: n[5] });
    });
    enemies.length = 0;
    (data.enemies || []).forEach(function (e2) {
      var spec = ENEMY_TIERS[e2[3]] || ENEMY_TIERS[0];
      enemies.push({ x: e2[0] / 100, y: e2[1] / 100, hp: e2[2], maxHp: spec.hp, tier: e2[3],
                     target: null, atk: 0, stuckT: 0, lastD: 1e9, side: 1, wob: 0 });
    });
    evolution = data.evo || 0;
    evoPrevPoll = world.totalPollution;     // 증분식이라 기준점을 맞춰야 한다
    if (data.ws) for (var wk in data.ws) waveStats[wk] = data.ws[wk];
    if (data.tut) {
      tutorial.on = data.tut.on !== false; tutorial.step = data.tut.step || 0;
      // 옛 저장본에는 track 이 없다 — 그때는 기초뿐이었으므로 basic 으로 읽는다
      tutorial.track = (data.tut.track === 'adv') ? 'adv' : 'basic';
      tutorial.done = !!data.tut.done; tutorial.flags = data.tut.flags || {};
    }
    if (data.prod) {
      prodStats.smelted = data.prod.smelted || 0;
      prodStats.crafted = data.prod.crafted || 0;
      prodStats.byRecipe = data.prod.byRecipe || {};
    }

    markBeltDirty(); markPowerDirty(); markLogicDirty();
    rebuildPower();
    refreshAllUI();
    toast('불러오기 완료 — ' + fmtTime(gameTime), 'good');
    return true;
  } catch (e3) { logError('load', e3); toast('불러오기 실패: ' + e3, 'bad'); return false; }
}

// --- 부팅 --------------------------------------------------------------------
function boot() {
  var canvas = document.getElementById('view');
  generateWorld(worldSeed);          // initRender 가 world.spawn 을 읽으므로 먼저
  initRender(canvas);
  bindInput(canvas);
  bindMini();
  bindSaveButtons();
  bindMobileBar();
  bindTutorial();
  bindLogicPane();
  fillHelp();
  newGame(worldSeed);
  document.getElementById('help').style.display = 'block';
  requestAnimationFrame(frame);
  window.__READY = true;
}

// 인라인 onclick 은 IIFE 안의 함수를 못 본다 — 전역으로 내보낸다
window.closeTech = closeTech;
window.closeHelp = closeHelp;
window.closeLogic = closeLogic;
window.loadExample = loadExample;
window.saveGame = saveGame;
window.loadGame = loadGame;

// --- 테스트 API --------------------------------------------------------------
// 판정은 전부 이 계약(반환 JSON 필드)으로만 한다. 화면 문자열 눈대중 금지.
window.__GAME = {
  version: VERSION,
  gfx: function () {
    return { canvas: cv ? [cv.width, cv.height] : null, dpr: cam.dpr || 1, zoom: cam.z };
  },
  errors: function () { return ERRORS.slice(); },
  reset: function (seed) { newGame(seed); return gameTime; },
  pause: function (v) { paused = !!v; },

  // 결정론 전진 — 프레임과 무관하게 정확히 n 틱
  run: function (seconds) {
    var n = Math.round(seconds / TICK);
    for (var i = 0; i < n; i++) tick(TICK);
    return { ticks: n, t: gameTime };
  },
  tickOnce: function () { tick(TICK); return gameTime; },
  setSpeed: function (n) { gameSpeed = Math.max(0, Math.min(60, +n || 1)); return gameSpeed; },
  getSpeed: function () { return gameSpeed; },

  give: function (item, n) { inventory[item] = (inventory[item] || 0) + n; return inventory[item]; },
  giveAll: function (n) {
    for (var i = 0; i < ITEM_IDS.length; i++) inventory[ITEM_IDS[i]] = n;
    return invTotal(inventory);
  },
  // **place 는 free 다** — 비용도 기술도 광맥도 안 본다. 계통 하나만 떼어 재는
  // 시험에는 그게 맞지만, 그걸로 "자력 완주"를 주장하면 거짓이 된다: 광맥 없는
  // 땅에 채광기를 세워 놓고 아무것도 안 캐는 것을 눈치채지 못했다(실측).
  place: function (type, tx, ty, dir) {
    var e = placeEntity(type, tx, ty, dir === undefined ? 1 : dir, true);
    return e ? e.id : null;
  },
  // build 는 **플레이어와 같은 길**로 짓는다 — 재료를 내고, 기술을 요구하고,
  // 채광기는 광맥 위에만 선다. 완주 주행은 이쪽만 써야 한다.
  build: function (type, tx, ty, dir) {
    var e = placeEntity(type, tx, ty, dir === undefined ? 1 : dir, false);
    return e ? e.id : null;
  },
  // refund 를 생략하면 환급 없이 지운다(기존 호출부 그대로). 환급 경로는 플레이어의
  // 철거 버튼이 쓰는 것과 같은 코드라 시험으로 잴 수 있어야 한다.
  remove: function (id, refund) { return removeEntity(id, refund === true); },
  ent: function (id) {
    var e = entities[id];
    if (!e) return null;
    return {
      id: e.id, type: e.type, tx: e.tx, ty: e.ty, w: e.w, h: e.h, dir: e.dir, hp: e.hp, maxHp: e.maxHp,
      enabled: e.enabled, playerEnabled: e.playerEnabled, logicForced: !!e.logicForced,
      logicConflict: e.logicConflict || null,
      powerSat: e.powerSat, net: e.net, working: !!e.working, stallT: e.stallT,
      inv: JSON.parse(JSON.stringify(e.inv)), out: JSON.parse(JSON.stringify(e.out)),
      recipe: e.recipe, progress: e.progress,
      fuel: e.fuel, load: e.load, ammo: e.ammo, filter: e.filter, held: e.held, depleted: !!e.depleted,
      // 터렛의 사격 허가. 노출을 빼먹었더니 시험이 '없는 키' 를 읽고 값이 뒤집혔다고
      // 오독했다 — 없는 것과 false 는 다르다.
      fireOk: (e.fireOk === undefined) ? null : !!e.fireOk,
      beltItems: e.cells ? e.cells.map(function (c) { return cellItemCount(c); }) : null,
      gate: e.cells ? e.cells.map(function (c) { return c.gate; }) : null
    };
  },
  setRecipe: function (id, rid) { var e = entities[id]; if (e) { e.recipe = rid; e.progress = 0; return true; } return false; },
  setFuel: function (id, kj) { var e = entities[id]; if (e) { e.fuel = kj; return true; } return false; },
  setAmmo: function (id, n) { var e = entities[id]; if (e) { e.ammo = n; return true; } return false; },
  fillChest: function (id, item, n) { var e = entities[id]; if (e) { invAdd(e.inv, item, n); return invTotal(e.inv); } return -1; },
  putOnBelt: function (id, item, cellIdx, lane) {
    var e = entities[id];
    if (!e || !e.cells) return false;
    return beltAccept(e.cells[cellIdx || 0], item, lane);
  },

  // 로직 그래프 조작 (테스트가 배선을 직접 짠다)
  gAdd: function (ctrlId, kind, x, y) {
    var e = entities[ctrlId]; if (!e || !e.graph) return null;
    return graphAddNode(e.graph, kind, x || 0, y || 0).nid;
  },
  gCfg: function (ctrlId, nid, key, val) {
    var e = entities[ctrlId]; if (!e) return false;
    var n = graphNode(e.graph, nid); if (!n) return false;
    n.cfg[key] = val; e.graph.dirty = true; return true;
  },
  gLink: function (ctrlId, fn, fp, tn, tp) {
    var e = entities[ctrlId]; if (!e) return false;
    return graphLink(e.graph, fn, fp, tn, tp);
  },
  // 노드의 화면상 위치 (터치 드래그가 실제로 옮겼는지 보려면 좌표가 필요하다)
  // 노드의 대상 목록 필터 (게이트가 '고를 수 있는 건물' 을 검정한다)
  // 컴파일 전 그래프에서 readIn 이 안전한지 검정하기 위한 훅
  readInProbe: function (ctrlId, nid, port) {
    var e = entities[ctrlId]; if (!e || !e.graph) return null;
    var n = graphNode(e.graph, nid); if (!n) return null;
    try { return readIn(e.graph, n, port || 0); } catch (err) { return 'THREW:' + err.message; }
  },
  // 전수 스윕용 열거 훅 — "모든 X" 를 실제로 하나씩 돌려 보려면 목록이 필요하다
  nodeKinds: function () { return NODE_KINDS.slice(); },
  nodeAvailable: function (kind) { return nodeAvailable(kind); },
  techIds: function () { return TECH_IDS.slice(); },
  buildingTypes: function () { return Object.keys(BUILDINGS); },
  buildingInfo: function (t) {
    var B = BUILDINGS[t];
    if (!B) return null;
    return { cost: B.cost, tech: B.tech || null, w: B.w, h: B.h, power: B.power || 0 };
  },
  recipeIds: function () { return Object.keys(RECIPES); },
  recipeInfo: function (rid) {
    var r = RECIPES[rid]; if (!r) return null;
    return { cat: r.cat, time: r.time, inp: JSON.parse(JSON.stringify(r.inp)),
             out: JSON.parse(JSON.stringify(r.out)), handOk: !!r.handOk, tech: r.tech || null };
  },
  // 벨트 센서를 시험하려면 벨트에 물건을 직접 얹어야 한다
  // lanes 는 **엔티티가 아니라 셀** 에 있다 (20_belt.js:21). 엔티티에서 찾다가
  // 조용히 false 를 돌려주고, 그 탓에 벨트 센서가 고장난 것처럼 보였다.
  // 벨트 게이트가 실제로 닫혔는지 (셀의 gate 플래그)
  gateState: function (id) {
    var e = entities[id];
    if (!e || !e.cells || !e.cells.length) return null;
    for (var i = 0; i < e.cells.length; i++) if (!e.cells[i].gate) return false;
    return true;
  },
  beltPut: function (id, item, pos) {
    var e = entities[id];
    if (!e || !e.cells || !e.cells.length) return false;
    e.cells[0].lanes[0].push({ id: item, pos: (pos === undefined ? 0.5 : pos) });
    return true;
  },
  nodeTargets: function (kind) {
    var d = NODE_DEFS[kind]; if (!d) return null;
    for (var i = 0; i < d.cfg.length; i++) {
      if (d.cfg[i].t === 'ent') return d.cfg[i].filter || Object.keys(BUILDINGS);
    }
    return null;
  },
  // 노드를 옮긴다 (좌표가 평가 순서를 정하므로 그것을 검정하는 데 쓴다)
  gMove: function (ctrlId, nid, x, y) {
    var e = entities[ctrlId]; if (!e || !e.graph) return false;
    var n = graphNode(e.graph, nid); if (!n) return false;
    n.x = x; n.y = y; e.graph.dirty = true; return true;
  },
  // 펄스 누적 발화 횟수 (값 표본으로는 1틱 신호를 못 잡는다)
  beltClear: function (id) {
    var e = entities[id]; if (!e || !e.cells) return false;
    for (var i = 0; i < e.cells.length; i++) { e.cells[i].lanes[0].length = 0; e.cells[i].lanes[1].length = 0; }
    return true;
  },
  // 이 제어기 그래프에 실제로 놓인 노드 종류 (완주 판정이 '다 써 봤는가'를 본다)
  gKinds: function (ctrlId) {
    var e = entities[ctrlId]; if (!e || !e.graph) return null;
    var seen = {}, r = [];
    for (var i = 0; i < e.graph.nodes.length; i++) {
      var k = e.graph.nodes[i].kind;
      if (!seen[k]) { seen[k] = 1; r.push(k); }
    }
    return r;
  },
  gFires: function (ctrlId, nid, port) {
    var e = entities[ctrlId]; if (!e || !e.graph) return null;
    var n = graphNode(e.graph, nid); if (!n || !n.fires) return 0;
    return n.fires[port || 0] || 0;
  },
  setEnabled: function (id, on) {
    var e = entities[id]; if (!e) return false;
    e.playerEnabled = !!on; e.enabled = !!on; return true;
  },
  gPos: function (ctrlId, nid) {
    var e = entities[ctrlId]; if (!e || !e.graph) return null;
    var n = graphNode(e.graph, nid); if (!n) return null;
    return { x: n.x, y: n.y };
  },
  // 타일 좌표 → CSS 픽셀. 터치 좌표는 clientX/Y 라 dpr 을 나눈 값이어야 한다.
  // cam.x/y 와 screenOf 는 **타일 단위**다 (픽셀이 아니다 — cam.x 는 [4, W-4] 로
  // 클램프된다). TILE 을 곱했다가 화면좌표가 59587 로 나왔다.
  tileToScreen: function (tx, ty) {
    var p = screenOf(tx + 0.5, ty + 0.5), d = cam.dpr || 1;
    return { x: p.x / d, y: p.y / d };
  },
  camera: function () { return { x: cam.x, y: cam.y, z: cam.z, dpr: cam.dpr || 1 }; },
  // 녹화용 — 방금 지은 곳을 비춰야 영상이 무엇을 하는지 보여준다
  setCamera: function (x, y, z) {
    if (x !== undefined && x !== null) cam.x = clamp(x, 4, W - 4);
    if (y !== undefined && y !== null) cam.y = clamp(y, 4, H - 4);
    if (z) cam.z = clamp(z, 0.35, 2.6);
    return { x: cam.x, y: cam.y, z: cam.z };
  },
  gOut: function (ctrlId, nid, port) {

  },
  gInfo: function (ctrlId) {
    var e = entities[ctrlId]; if (!e || !e.graph) return null;
    if (e.graph.dirty) graphCompile(e.graph);
    return { nodes: e.graph.nodes.length, links: e.graph.links.length,
             cycles: e.graph.cycles || 0, order: e.graph.order.slice() };
  },

  research: function (tid) {
    if (tid) { techDone[tid] = true;
      if (tid === 'belt-2') beltSpeedMul = 2;
      if (tid === 'automation-2') { machineSpeedMul = 1.5; machinePowerMul = 0.8; }
      return true; }
    return false;

  setResearch: function (tid) { return startResearch(tid); },
  addResearch: function (n) { addResearchProgress(n); return researchProgress; },

  spawnEnemyAt: function (x, y, tier) {

    enemies.push({ x: x, y: y, hp: spec.hp, maxHp: spec.hp, tier: tier || 0,
                   target: null, atk: 0, stuckT: 0, lastD: 1e9, side: 1, wob: 0 });

  clearEnemies: function () { enemies.length = 0; nests.length = 0; return 0; },
