<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOGIC FOUNDRY — 갱신</title>
<meta name="theme-color" content="#1c2024">
<!-- **탈출문.** 오프라인을 되게 하려고 캐시를 앞세운 대가로, 갱신 장치가 갱신되어야 할
     물건 안에 들어가 버렸다 — 예전 사본을 열고 있는 폰에는 [지금 갱신] 버튼 자체가 없다.
     이 페이지는 **캐시에 없는 새 주소**라 항상 네트워크에서 받아지고(서비스워커가
     이 경로는 지나치게 해 두었다), 받자마자 캐시를 비우고 서비스워커를 걷어낸 뒤
     게임으로 보낸다. 저장(localStorage)은 건드리지 않는다 — 판은 그대로 남는다. -->
<style>
  html,body{margin:0;height:100%;background:#171a1d;color:#eae6dd;
    font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
  .box{border:1px solid #2f353a;background:#1c2024;border-radius:4px;padding:22px 20px;max-width:420px}
  h1{font-size:15px;letter-spacing:.16em;margin:0 0 12px;font-weight:700}
  p{margin:8px 0;font-size:14px;line-height:1.6;color:#cfd4d8}
  .dim{color:#8b9199;font-size:12px}
  .num{font-family:"Consolas",monospace;color:#e2b21c}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
    padding:0 20px;margin-top:14px;border:1px solid #a8830c;border-radius:4px;
    background:#e2b21c;color:#231d05;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>LOGIC FOUNDRY</h1>
  <p id="msg">저장해 둔 옛 사본을 지우는 중…</p>
  <p class="dim">게임 저장(만들던 공장)은 지우지 않는다. 지우는 것은 <b>프로그램 사본</b>뿐이다.</p>
  <p class="dim">새 판 도장 <span class="num" id="ver">확인 중…</span></p>
  <a class="btn" id="go" href="dist/Logic-Foundry.html">게임 열기</a>
</div>
<script>
(function () {
  var msg = document.getElementById('msg');
  var ver = document.getElementById('ver');

  // 도장을 먼저 보여 준다 — 무엇으로 갱신되는지 눈으로 확인할 수 있어야 한다.
  fetch('build.txt', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) { ver.textContent = t ? t.trim() : '알 수 없음'; })
    .catch(function () { ver.textContent = '오프라인'; });

  function clearAll() {
    var jobs = [];
    if (window.caches && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    return Promise.all(jobs);
  }

  clearAll().then(function () {
    msg.innerHTML = '<b>다 지웠다.</b> 아래 버튼을 누르면 새 판을 받는다.';
    // 사람이 안 눌러도 3초 뒤 알아서 넘어간다 — 한 번 더 누르게 만들 이유가 없다.
    setTimeout(function () { location.replace('dist/Logic-Foundry.html'); }, 3000);
  }, function () {
    msg.innerHTML = '지우지 못했다 — 아래 버튼으로 게임을 연 뒤, 브라우저 설정에서 ' +
                    '이 사이트의 데이터를 지워야 할 수도 있다.';
  });
})();
</script>
</body>
</html>
